<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Islands and Vietnam Trip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f3f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1714" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="../icon-512.png"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* One page, five views (Now, Days, Places, Book, Info), hash routes so the back button works.
   Phone: tab bar at the bottom (top when framed, e.g. inside claude.ai). Desktop: sidebar with the trip outline.
   Colour marks the stop, never the content type. Data lives in the JSON at the bottom; this file only draws it. */
:root{--bg:#f3f6f4;--card:#ffffff;--fg:#14211d;--muted:#566862;--line:#d3ddd8;--soft:#e9efec;--link:#0b5f7a;--on:#fff;
--zt:#0b6e6e;--zh:#b23a3a;--zg:#a05a1c;--zs:#7a4fb8;--zx:#6b7a74;
--ok:#1f6b45;--okbg:#dff0e5;--warn:#8a5a0a;--warnbg:#f7ead0;--bad:#9b2f2f;--badbg:#f6dede;--idea:#4b2f86;--ideabg:#ece6f6;--fine:#3d5a73;--finebg:#e3ecf3;
--display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;--body:"Source Sans 3","Helvetica Neue",Arial,sans-serif;--bar:60px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1714;--card:#15231e;--fg:#e2ece8;--muted:#98ada5;--line:#2a3d35;--soft:#1b2d26;--link:#7fc4de;
--zt:#4fc3c3;--zh:#e07a6e;--zg:#e5a574;--zs:#b89af0;--zx:#8fa39a;--ok:#7bd1a0;--okbg:#17352a;--warn:#e8c07a;--warnbg:#3a2f16;--bad:#f0a0a0;--badbg:#3d2020;--idea:#cbbaf6;--ideabg:#2b2346;--fine:#a9c6dd;--finebg:#1f3040;--on:#0e1714;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1714;--card:#15231e;--fg:#e2ece8;--muted:#98ada5;--line:#2a3d35;--soft:#1b2d26;--link:#7fc4de;
--zt:#4fc3c3;--zh:#e07a6e;--zg:#e5a574;--zs:#b89af0;--zx:#8fa39a;--ok:#7bd1a0;--okbg:#17352a;--warn:#e8c07a;--warnbg:#3a2f16;--bad:#f0a0a0;--badbg:#3d2020;--idea:#cbbaf6;--ideabg:#2b2346;--fine:#a9c6dd;--finebg:#1f3040;--on:#0e1714;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);margin:0}
a{color:var(--link)}
button{font:inherit;color:inherit}
.shell{max-width:1240px;margin:0 auto}
main{padding:8px max(16px,env(safe-area-inset-right,0px)) calc(var(--bar) + 28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:820px;margin:0 auto}
.framed main{padding-bottom:40px}

/* nav: bottom bar on phone */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.framed .nav{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding:0}
.nav a{flex:1;min-width:0;height:var(--bar);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font:600 .74rem var(--body)}
.nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"]{color:var(--fg)}
.nav a[aria-current="page"] svg{stroke-width:2.4}
.framed .nav a{height:48px;flex-direction:row;gap:6px;font-size:.88rem}
.framed .nav a svg{width:18px;height:18px}
.side{display:none}

/* type */
.hd{padding:14px 0 6px}
.hd h1{font:800 1.5rem/1.1 var(--display);margin:0}
.hd p{margin:3px 0 0;color:var(--muted);font-size:.9rem}
h2{font:800 1.25rem/1.2 var(--display);margin:24px 0 8px;text-wrap:balance}
h3{font:700 .76rem var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.muted{color:var(--muted)}.small{font-size:.9rem}
.kick{font:700 .72rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.big{font:800 2.6rem/1 var(--display);margin:2px 0 4px}
.lead{font:700 1.1rem/1.25 var(--display);margin:2px 0 3px}
.note{color:var(--muted);font-size:.9rem;margin:3px 0}

/* blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.dd{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;flex:none;vertical-align:1px}
.zt{--z:var(--zt)}.zh{--z:var(--zh)}.zg{--z:var(--zg)}.zs{--z:var(--zs)}.zx{--z:var(--zx)}
.dd{background:var(--z)}
.strip{display:flex;gap:2px;margin:14px 0 2px}
.strip a{min-width:0;height:10px;border-radius:3px;background:var(--z)}
.striplab{display:flex;gap:2px;font-size:.7rem;color:var(--muted);line-height:1.1}
.striplab span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;min-height:40px;font:700 .92rem var(--body);background:var(--fg);color:var(--bg);text-decoration:none;border-radius:9px;padding:8px 14px}
.btn.alt{background:none;color:var(--link);border:1px solid var(--line)}
.pill{display:inline-block;font:700 .7rem var(--body);letter-spacing:.04em;padding:2px 8px;border-radius:99px;white-space:nowrap;text-transform:lowercase}
.pill.buy,.pill.do{background:var(--okbg);color:var(--ok)}.pill.decide{background:var(--warnbg);color:var(--warn)}.pill.ask,.pill.book,.pill.idea{background:var(--ideabg);color:var(--idea)}
.pill.wait,.pill.fine{background:var(--finebg);color:var(--fine)}.pill.skip{background:var(--badbg);color:var(--bad)}
.row{display:flex;gap:12px;align-items:center;min-height:56px;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.row:first-child{border-top:0}
.row .d{width:3.6em;flex:none;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.row .d small{display:block;font-weight:600;color:var(--muted);font-size:.78rem}
.row .b{min-width:0;flex:1}
.row .go{color:var(--muted);flex:none}
.row.cur{background:var(--soft);margin:0 -16px;padding-inline:16px;border-radius:8px}
.row .mv{color:var(--muted);font-size:.9rem;line-height:1.3}
.bedl{display:none}
.grp{border-left:4px solid var(--z);padding:2px 0 2px 14px;margin:18px 0 6px}
.grp b{font:800 1.05rem var(--display)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chip{flex:none;min-height:36px;font:600 .86rem var(--body);border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:6px 13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.it{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0}
.it.do{border-left-color:var(--ok)}.it.fine{border-left-color:var(--fine)}.it.idea{border-left-color:var(--idea)}.it.skip{border-left-color:var(--bad)}
.it .t{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.it .t b{font:700 1rem/1.25 var(--display)}
.meta{font-size:.9rem;margin:3px 0}
.meta b{font-weight:700}
.see{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.see a{font-size:.84rem;font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:5px 11px;color:var(--link)}
.mis{padding-block:4px}.mi{padding:10px 0;border-top:1px solid var(--line)}.mi:first-child{border-top:0}.mi .see{margin-top:5px}.mis .see a{padding:3px 10px}
.leg{padding:9px 0;border-top:1px solid var(--line)}.leg:first-child{border-top:0}
.leg b{display:block}
.bed{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.bed .n{min-width:0;flex:1 1 220px}
.price{font:800 1.25rem var(--display);font-variant-numeric:tabular-nums}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
details>summary{cursor:pointer;font-weight:700;padding:10px 0;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+";display:inline-block;width:1.2em;color:var(--muted)}
details[open]>summary::before{content:"\2212"}
table{border-collapse:collapse;width:100%;font-size:.92rem}
td,th{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-top:0}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
ul.tight{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.stopcard{display:block;text-decoration:none;color:inherit;border-left:5px solid var(--z)}
.stopcard .lead{display:flex;justify-content:space-between;gap:8px}
.stopcard .lead span{font:600 .85rem var(--body);color:var(--muted);white-space:nowrap}
.pager{display:flex;justify-content:space-between;gap:8px;margin:6px 0 4px}
.pager a{flex:1;text-decoration:none;font-weight:600;font-size:.9rem;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--card)}
.pager a:last-child{text-align:right}
.pager span{flex:1}
.back{display:inline-block;margin:10px 0 0;font-weight:600;text-decoration:none;font-size:.92rem}
.warn{background:var(--warnbg);color:var(--warn);border-radius:9px;padding:9px 12px;font-size:.92rem;margin:10px 0}
.today{border:2px solid var(--fg)}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}

/* desktop: sidebar with the trip outline, wider content */
@media (min-width:1000px){
  .shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;padding:0 24px}
  .nav{display:none}
  .side{display:block;position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 0 30px;border-right:1px solid var(--line);padding-right:18px}
  .side h1{font:800 1.3rem/1.1 var(--display);margin:0 0 3px}
  .side p{margin:0 0 14px;color:var(--muted);font-size:.86rem}
  .side a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--fg);padding:7px 10px;border-radius:8px;font-weight:600}
  .side a[aria-current="page"]{background:var(--soft)}
  .side a:hover{background:var(--soft)}
  .side a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .side .out{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  .side .out a{font-weight:400;font-size:.92rem;padding:5px 10px}
  .side .out a small{margin-left:auto;color:var(--muted);font-size:.8rem;white-space:nowrap}
  main{padding:18px 0 60px;max-width:900px;margin:0}
  .hd{display:none}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .grid2>.it,.grid2>.card{margin:6px 0}
  .row.cur{margin:0 -10px;padding-inline:10px}
  .bedl{display:block}
}
@media print{.nav,.side,.chips,.pager{display:none!important}main{padding:0;max-width:none}.card,.it{break-inside:avoid}details>summary::before{content:""}}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.side a{transition:background .12s}}
</style>
</head>

o", "map": "https://www.google.com/maps/search/?api=1&query=Tiger+Cave+Temple+Krabi", "tags": ["tigercavetemple"]}, {"name": "Railay viewpoint and Princess Lagoon", "dur": "~3 h with the boat: 30 min up, 20-25 more to the lagoon with ropes and mud", "cost": "boat THB 100 each way", "note": "Do the lagoon near high water: about 16:00 on Tue 16. Muddy rope scramble, wear shoes. Phra Nang Cave Beach is on the same walk. Back on the last shared boat before 18:00", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Railay+Viewpoint+Krabi", "tags": []}, {"name": "Rock climbing, half day", "dur": "~4 h", "cost": "THB 900-1,500 each (EUR 24-40) at the school counter, not USD 48-55 on a booking site", "note": "Hot Rock 5.0 (479), Railay Rock Climbing Shop 4.9 (212), Real Rocks 4.8 (237). Ask the age of the bolts. Walk up to a school the evening before", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Hot+Rock+Climbing+School+Railay", "tags": []}, {"name": "Kayak to Poda and Phra Nang", "dur": "~3.5 h, about 1 h each way to Poda", "cost": "THB 600 each, half day", "note": "The other choice on Tue 16 morning. Be back for the 18:00 boat", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Phra+Nang+Cave+Beach+Railay", "tags": []}, {"name": "Klong Root self-paddle kayak", "dur": "1-1.5 h", "cost": "THB 300 per 2-seat kayak", "note": "Shorter and cheaper than Poda, the other choice on Tue 16 morning. Rated 4.6 on Maps; the distance from Ao Nang is not checked", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Klong+Root+Krabi", "tags": []}, {"name": "Ao Nang beach at sunset", "dur": "~1 h", "cost": "free", "note": "Walk from Ao Nang to Nopparat Thara; sunset 18:36 on 15 Mar", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Ao+Nang+Beach+Krabi", "tags": ["aonangbeach"]}, {"name": "Dinner Mon 15: Ko Dam Kitchen or Khao Yum Nai Baan", "dur": "~1 h", "cost": "dishes about THB 70-80", "note": "Ko Dam Kitchen 4.7, open to 22:30. <a href=\"https://www.google.com/maps/search/?api=1&query=Khao+Yum+Nai+Baan+Ao+Nang\" target=\"_blank\" rel=\"noopener\">Khao Yum Nai Baan</a> 4.8 is a southern breakfast place that opens 06:00; its closing time is not shown, so go early", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Ko+Dam+Kitchen+Ao+Nang", "tags": []}, {"name": "Ao Nang Wednesday night market, Wed 17", "dur": "~2 h", "cost": "cheap meals", "note": "Wednesday 16:00-20:00. Krabi Town Walking Street is Fri-Sun, so it is not open while you are here", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Ao+Nang+Wednesday+Night+Market+Krabi", "tags": []}, {"name": "Krabi Town Walking Street", "dur": "-", "cost": "-", "note": "Runs Fri-Sun only: not in Mon 15 - Thu 18", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Krabi+Town+Walking+Street+Krabi", "tags": []}, {"name": "Emerald Pool and hot spring", "dur": "~5 h with ~1 h ride each way", "cost": "THB 400-650", "note": "Scooter or tour; open 08:30-16:30, go at opening, vans arrive later", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Emerald+Pool+Krabi", "tags": []}, {"name": "Hong Islands by longtail", "dur": "~7 h", "cost": "Group tour about EUR 34-37 each (68-74 for two). Private longtail THB 2,500-2,800 a boat + THB 300 park each (about EUR 84-92 for two)", "note": "For two the group tour is cheaper; the private boat wins from 3-4 people and gives your own pace. Your call. Ask at the Ao Nang ticket booth for a shared boat (one report of THB 300 return, unconfirmed). Fits Wed 17 instead of the climbing: back about 15:30, market after", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Hong+Islands+Krabi", "tags": ["hongisland"]}, {"name": "Ao Nang Landmark Night Market", "dur": "~1.5 h", "cost": "-", "note": "A tourist market, not a meal stop. The Wednesday night market on Wed 17 is the one to use", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Ao+Nang+Landmark+Night+Market", "tags": []}, {"name": "Tonsai at night", "dur": "2-3 h", "cost": "after 18:00 the shared boat waits for 8 people (~THB 150 each) or a private boat is THB 800-1,500", "note": "Not from this base unless you accept that cost", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Tonsai+Beach+Railay", "tags": ["tonsai"]}, {"name": "Jet ski", "dur": "-", "cost": "-", "note": "Damage-claim scam with the passport held", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Jet+ski+rental+Ao+Nang", "tags": []}, {"name": "Diving", "dur": "-", "cost": "THB 3,000-4,000 for two dives", "note": "Lanta is cheaper for Hin Daeng, which needs Advanced Open Water", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Dive+centre+Ao+Nang", "tags": []}, {"name": "Bioluminescence", "dur": "-", "cost": "-", "note": "Moon is waxing on 15-18 Mar, full on Mon 22: the glow is weak", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Bioluminescence+kayak+Krabi", "tags": []}], "tags": ["krabi", "tonsai", "hongisland"], "extra": ""}, {"id": "mook", "cls": "zt", "name": "Koh Mook", "short": "Koh Mook", "dates": "Thu 18 - Sat 20 Mar", "nights": "2 nights", "from_": "2027-03-18", "to": "2027-03-20", "avail": "1 full day (Fri), Thursday from about 12:30, Saturday morning until the 11:00 boat (the 14:00 gives the whole morning)", "fit": "Fri 19: the optional dugong boat, then Kradan and Ngai in the morning, Emerald Cave 14:30-16:30, dinner in the village. Thu 18 afternoon: bike, village, Charlie Beach sunset and Mong Bar. A third night repeats it (a 2025 traveller called it \"way too calm\"; 2-3 days is enough).", "legs": [{"leg": "Arrive from Ao Nang", "how": "Jijie van + boat from Ao Nang 07:30 (pickup about 07:00), on Mook 12:30, about EUR 21 each (4.8 on 12go). Fallbacks: Satun Pakbara 08:35, lands 11:20, EUR 43; Bundhaya 10:10 from Nopparat Thara, lands 13:20, EUR 51. The cave is not possible on Thursday either way. <a href=\"https://12go.asia/en/travel/ao-nang/koh-muk?date=2027-03-18\" target=\"_blank\" rel=\"noopener\">12go, Thu 18 Mar</a>", "note": "<span class=\"nt\">Book through the guesthouse on Wed</span>"}, {"leg": "Leave for Lanta (Sat 20)", "how": "Bundhaya (2.9 on Maps) / Satun Pakbara (3.4 on Maps) speedboat: Bundhaya from 11:00 EUR 24, Satun Pakbara from 10:45 EUR 26-28 on 12go; a village agent may be cheaper (THB 540-600 reported, about EUR 15). Tigerline also runs it but has delay complaints. March 2027 times and fares unconfirmed; pier transfers on both islands unpriced. Book the evening before at a village agent and keep a 2-3 h buffer. Both rate low: ask the village agent which boat is running. Times and fares: <a href=\"https://12go.asia/en/travel/koh-mook/koh-lanta?date=2027-03-20\" target=\"_blank\" rel=\"noopener\">12go, Sat 20 Mar</a>", "note": "<span class=\"nt\">Ask Kookkai about the March boat times in December</span>"}], "sleep": [{"name": "Pick: Kookkai Bungalows (Booking now lists it as Mook Bamboo Bungalows)", "price": "64 per room for 2 nights with breakfast, 32 a night", "note": "free cancellation to 15 Mar", "link": "https://www.booking.com/hotel/th/kookkai-bungalows.en-gb.html?checkin=2027-03-18&checkout=2027-03-20&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Mook+Bamboo+Bungalows+Koh+Mook", "primary": true}, {"name": "Alternative: Koh Mook Bungalows", "price": "58 per room", "note": "Rated 8.8 from 492", "link": "https://www.booking.com/hotel/th/koh-mook-bungalows.en-gb.html?checkin=2027-03-18&checkout=2027-03-20&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Koh+Mook+Bungalows+Koh+Mook", "primary": false}], "sleepnote": "Airbnb has nothing real on Mook. One ATM on the island and it can run dry: bring THB 6,000-8,000 cash for two, withdrawn once in Ao Nang on Mon 15.", "menu": [{"name": "Emerald Cave", "dur": "~2 h, Fri 14:30-16:30", "cost": "private longtail THB 1,000-1,700 a boat + park fee THB 200 each (carry 400)", "note": "Not at sunrise: high water is about 09:00 on Fri 19 and floods the arch; low water is about 14:45 (tide table for Railay), so the 14:30 boat is at low water. Go in the afternoon, after the Lanta tours have left, with a torch and a life jacket. Kookkai confirms the boat time; ask the boatman the evening before.", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Tham+Morakot+Emerald+Cave+Ko+Mook+Trang", "tags": ["emeraldcave"]}, {"name": "Kradan and Ngai by longtail", "dur": "~3.5 h, Fri 10:00-13:30", "cost": "about THB 800 a boat (EUR 21) split between two; Ngai alone by scheduled boat THB 200-350", "note": "Snorkel off the beach: some of the best in Thailand. The dugong boat can go before it, not instead. Tight before the 14:30 cave: ask for one boat doing both", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Koh+Kradan", "tags": []}, {"name": "Dugong boat with a spotter, from Mook", "dur": "~2 h, Fri about 07:30-09:30", "cost": "ask Kookkai on Thu (THB 1,000-2,000 was the price from the Libong side)", "note": "A March 2024 trip report found the dugongs had moved from Libong to Koh Mook: 3 and 4 seen with a spotter, and a free observation tower on Mook is also reported. Goes before Kradan and Ngai at 10:00, not instead of it. Not confirmed for 2027", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Koh+Mook", "tags": []}, {"name": "Sabai Beach jungle track", "dur": "~2 h: 40 min to the viewpoint, 20 to the beach, back", "cost": "free", "note": "Sat morning before the boat. Mud, mosquitoes, snakes: take a stick", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Sabai+Beach+Koh+Mook", "tags": ["kohmook"]}, {"name": "Bicycle round the island", "dur": "~2 h", "cost": "THB 100 a day (scooter THB 250)", "note": "Thursday afternoon. Quiet roads, cash only", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Koh+Mook", "tags": ["kohmook"]}, {"name": "Charlie Beach (Garnet Beach on Maps) sunset", "dur": "~1 h", "cost": "free", "note": "Sunset 18:33, then Mong Bar (it closes 20:00). Moto-taxi THB 50 from the village", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Charlie+Beach+Koh+Mook", "tags": []}, {"name": "The village", "dur": "~1 h", "cost": "free", "note": "Muslim village, cover up. Cash only", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Ban+Koh+Mook", "tags": ["kohmook"]}, {"name": "Mong Bar", "dur": "1 h evening, before 19:30", "cost": "beer from THB 50", "note": "Rated 4.8 (305). Maps shows it open 08:00-20:00 with no closure flag. Drink before or at sunset and leave by 19:30. Perfect Bar and Restaurant 4.6 (317), a restaurant with a bar, open 12:00-22:00, is the fallback. Halal places serve no alcohol.", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Mong+Bar+Koh+Mook", "tags": []}, {"name": "Cuttlefish snorkel", "dur": "-", "cost": "-", "note": "Visibility reported \"terrible\" at Mook; one reel only", "v": "idea", "map": "https://www.google.com/maps/search/?api=1&query=Cuttlefish+snorkel+Koh+Mook", "tags": []}], "tags": ["kohmook", "emeraldcave"], "extra": ""}, {"id": "lanta", "cls": "zt", "name": "Koh Lanta", "short": "Koh Lanta", "dates": "Sat 20 - Wed 24 Mar", "nights": "4 nights", "from_": "2027-03-20", "to": "2027-03-24", "avail": "3 full days, Saturday afternoon (~3 h); leave Wednesday 07:00", "fit": "The Do list is about 18 h against about 33 h available, so about 14 h stays free for the scooter and the beach. Four nights is the most the list supports.", "legs": [{"leg": "Arrive from Mook", "how": "Bundhaya (2.9 on Maps) / Satun Pakbara (3.4 on Maps) speedboat from Mook, Bundhaya from 11:00 EUR 24 or Satun Pakbara from 10:45 EUR 26-28 (a village agent may be cheaper); lands Lanta early afternoon, then a songthaew or taxi to the room", "note": "<span class=\"nt\">Crossing time unconfirmed</span>"}, {"leg": "Leave Lanta (Wed 24)", "how": "Jijie shared van 07:00 (12go, EUR 11 each, free cancellation; 06:00 and 08:00 runs also exist), listed at 2 h 30 to Krabi airport, so there about 09:30, 4 h before the 13:35 flight; the ferry queue can add up to 2 h. Hotel pickup is not stated on 12go: confirm with Cat Bungalow. Fallback only: a private SUV, about EUR 60 a car (EUR 30 each). <a href=\"https://www.12go.asia/en/travel/koh-lanta/krabi-airport?date=2027-03-24\" target=\"_blank\" rel=\"noopener\">12go, Wed 24 Mar</a>", "note": "<span class=\"nt\">Ferry queue not published; hotel pickup to confirm</span>"}], "sleep": [{"name": "Pick: Cat Bungalow", "price": "80 per room for 4 nights, 20 a night, fan and breakfast", "note": "Rated 9.1 from 688, free cancellation to 19 Mar", "link": "https://www.booking.com/hotel/th/cat-bungalow.en-gb.html?checkin=2027-03-20&checkout=2027-03-24&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Cat+Bungalow+Koh+Lanta", "primary": true}, {"name": "Alternative: Thai House Beach Resort", "price": "85 per room", "note": "Rated 9.0 from 372", "link": "https://www.booking.com/hotel/th/thai-house-beach-resort-ko-lanta.en-gb.html?checkin=2027-03-20&checkout=2027-03-24&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Thai+House+Beach+Resort+Koh+Lanta", "primary": false}], "sleepnote": "Airbnb on Lanta is EUR 117-181 for 4 nights, so no cheaper. Lanta is spread out: the scooter is how you move (THB 250 a day).", "menu": [{"name": "Snorkel Koh Rok and Koh Haa", "dur": "~8 h, a full day", "cost": "THB 1,600-3,000 each + 400 park each (EUR 53-90)", "note": "Sun 21 (Mon 22 if the swell is up: then the cave and park move to Tue 23 09:00-13:00, Muay Thai drops). Listings show THB 1,595-1,700 (park 400 extra). Walk in to 2-3 agencies in Saladan and ask if the park fee is included; never the hotel desk. Jellyfish possible until April. Tin Adventure 4.7 (270)", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Koh+Rok+Nok", "tags": ["kohrok"]}, {"name": "Old Town, then National Park and lighthouse", "dur": "~5 h: Old Town 1.5 h, park and lighthouse 3 h", "cost": "park THB 200 + 20 for a vehicle", "note": "Old Town in the morning or on Sat evening. Gate hours are 16:30 or 17:30, not confirmed (HQ +66 75 656 576): the park is a dead-end road, so be in by 13:00, lighthouse by 15:30, out by 16:30. Watch the sunset (about 18:35) from Long Beach, which faces west, not from the lighthouse. Old Town 4.4 (6,303)", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Mu+Ko+Lanta+National+Park", "tags": []}, {"name": "Khao Mai Kaew cave", "dur": "~2.5 h", "cost": "entry THB 200-300 (two prices seen) + local guide THB 30-50", "note": "Guide is required. Bring a headlamp. Also the rain backup", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Khao+Mai+Kaew+Cave+Koh+Lanta", "tags": []}, {"name": "Muay Thai gym lesson", "dur": "~1.5 h", "cost": "THB 500 each (EUR 13)", "note": "Nicha 4.9 (163), open 08:30-19:00; Lanta Muay Thai Complex 4.9 (127), open 07:00-20:00. Class times not found: ask on Mon", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Nicha+Muay+Thai+Koh+Lanta", "tags": []}, {"name": "Cooking class", "dur": "~4 h", "cost": "Time for Lime about THB 2,000 each (EUR 53)", "note": "Time for Lime is 4.9 on Maps. <a href=\"https://www.google.com/maps/search/?api=1&query=Cooking+with+Mon+Koh+Lanta\" target=\"_blank\" rel=\"noopener\">Cooking with Mon</a> is a separate school (5.0), price not found. Only if a Lanta evening is free; none is planned", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Time+for+Lime+Koh+Lanta", "tags": []}, {"name": "Beach volleyball on Long Beach ~16:00", "dur": "~1.5 h", "cost": "free", "note": "Locals play. A hand tennis group could not be confirmed. Tue 23", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Long+Beach+Koh+Lanta", "tags": []}, {"name": "Local markets: Old Town Sat, Klong Dao Mon, Klong Nin Tue", "dur": "~1.5 h each", "cost": "cheap meals", "note": "Sat 20 Old Town walking street (the street market opens 11:00), Mon 22 Klong Dao (from about noon, Maps says 15:00, to about 18:30: go after the park), Tue 23 Klong Nin (a morning market until about 12:00: eat at the roadside shops instead). The Saladan market day is not confirmed", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Klong+Nin+Beach+Koh+Lanta", "tags": []}, {"name": "Work at KoHub", "dur": "-", "cost": "day pass THB 400", "note": "Not planned: work blocks get placed once the route is final. Open Tue 09:00-17:30, fast wifi", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=KoHub+Koh+Lanta", "tags": []}, {"name": "Mangrove self-kayak, Thung Yee Peng", "dur": "2-3 h", "cost": "THB 400 per 2-person kayak", "note": "Flat mangrove water, not gorge water. Tue 23", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Thung+Yee+Peng+Koh+Lanta", "tags": []}, {"name": "Dive Hin Daeng and Hin Muang", "dur": "~8 h, a full day", "cost": "THB 4,330-4,700 + 600 park (EUR 130-140 with the park, 112-125 without)", "note": "Needs Advanced Open Water: skip unless certified. Rok and Haa is the snorkel day", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Hin+Daeng+Hin+Muang+dive+site", "tags": []}, {"name": "Night squid or fishing boat", "dur": "-", "cost": "hotels sell a boat from THB 4,750 for two", "note": "Ask boatmen at Saladan pier or in Old Town before paying a resort. A resort boat is THB 4,750 for two (6 h, a meal); a private longtail is about USD 200 each. Your call: yes or no", "v": "idea", "map": "https://www.google.com/maps/search/?api=1&query=Saladan+Pier+Koh+Lanta", "tags": []}, {"name": "Zipline", "dur": "-", "cost": "from THB 1,300", "note": "Tourist-priced", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Lanta+Zipline+Koh+Lanta", "tags": []}, {"name": "Muay Thai fight night", "dur": "-", "cost": "-", "note": "Both tourist stadiums rated 3.1 and 3.5: train instead", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Muay+Thai+stadium+Koh+Lanta", "tags": []}, {"name": "Elephant rides, jeep tours", "dur": "-", "cost": "-", "note": "Poor treatment; a jeep is THB 1,200 for what a scooter does", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Elephant+rides+Koh+Lanta", "tags": []}], "tags": ["kohrok"], "extra": ""}, {"id": "hanoi1", "cls": "zh", "name": "Wednesday night bus, Noi Bai airport to Ha Giang", "short": "Night bus", "dates": "Wed 24 Mar", "nights": "night bus", "from_": "2027-03-24", "to": "2027-03-25", "avail": "land 20:15, bus 23:45 from the airport, Ha Giang 05:45 Thursday", "fit": "No Hanoi night here: the bus leaves from the airport itself, you lie down in a cabin and walk into the Faithien room in Ha Giang, booked for Wednesday night so it is yours at 06:00. That is what starts the loop on Thursday and gives Hanoi its two days.", "legs": [{"leg": "Noi Bai airport to Ha Giang (Wed 24)", "how": "Sao Viet night bus 23:45 from Noi Bai airport, arrives 05:45 at Delapong Homestay, Ha Giang, EUR 18 each for an upper single cabin, other cabins from EUR 20 (rated 4.4; a lower double cabin exists, ask for it). Lying down, with WC. One reviewer could not sleep for the driving, so take earplugs; the company meets you at the airport after you message them with your bags. Book on 12go once March dates are on sale: <a href=\"https://12go.asia/en/travel/noi-bai-airport/ha-giang?date=2027-03-24\" target=\"_blank\" rel=\"noopener\">12go, Noi Bai airport to Ha Giang</a>. A Grab from Delapong to Faithien is a few minutes.", "note": "<span class=\"nt\">Times read for Nov 2026; March 2027 not on sale yet</span>"}, {"leg": "If the flight is very late (bus missed)", "how": "Grab to the Old Quarter (VND 230-350k, in the app, never an approaching driver), a room for the night (La Ava's Home, about EUR 26), and the Bang Phan day bus 09:30 from 156 Tran Quang Khai to Ha Giang, arrives 15:30, EUR 12. Then the bike Thursday late afternoon, a night in Ha Giang, and Friday straight to Meo Vac via Yen Minh: Du Gia drops, the rest of the loop and the Sunday bus stand.", "note": ""}], "sleep": [{"name": "Faithien Homestay, Ha Giang, booked from Wed night (you arrive 06:00)", "price": "10 per room", "note": "one night, the room is yours from 06:00; ask them that a 06:00 arrival goes straight to the room", "link": "https://www.booking.com/hotel/vn/ha-giang-faithien-homestay.en-gb.html?checkin=2027-03-24&checkout=2027-03-25&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Faithien+Homestay+Ha+Giang", "primary": true}], "sleepnote": "Book Faithien for Wed 24 so the room is yours when the bus arrives. Sun 28 is a separate booking.", "menu": [], "tags": [], "extra": ""}, {"id": "hagiang", "cls": "zg", "name": "Ha Giang loop", "short": "Ha Giang", "dates": "Thu 25 - Sun 28 Mar", "nights": "3 nights", "from_": "2027-03-25", "to": "2027-03-28", "avail": "Thu ride from about 10:30 (off the night bus 05:45, nap first), Fri and Sat riding days, Sunday market, ride back, night bus", "fit": "Three nights hold the whole loop, because Thursday now rides: Du Gia family night, Meo Vac, Dong Van as the last night so Sunday opens with its market at the peak. The route runs Du Gia first (against the tour flow); Sunday returns from Dong Van via Yen Minh and Quan Ba (about 133 km). You are back about 15:00 and use the Faithien room for a shower, bags and a rest before the bus, unless the bike shop gives a free shower and bag storage.", "legs": [{"leg": "Wed 24 night bus from Noi Bai", "how": "see the night bus card: Sao Viet 23:45 from the airport, Ha Giang 05:45 Thu. Pick the bike up on Thursday at 09:30, after a nap (WhatsApp Hung Cuong and HagiangGo beforehand: test ride, film it, cash deposit, free bag storage, whether it bills per 24 h; ask about a free shower on Sun 28). Border permit about USD 10 through the shop: keep the receipt", "note": "<span class=\"nt\">March 2027 time unconfirmed</span>"}, {"leg": "Sun 28 Dong Van back to Ha Giang town", "how": "ride about 133 km via Yen Minh and Quan Ba (better tarmac than the Mau Due gravel, 20 min stops at the Twin Mountains and Tham Ma): leave Dong Van at 09:15 and be back about 14:30-15:00, bike back 15:30", "note": "<span class=\"nt\">Real time not known</span>"}, {"leg": "Sun 28 evening, Ha Giang to Ninh Binh", "how": "night bus G8 23:00 to Tam Coc or Sao Viet 22:00 to Dong Gung station, about 07:00-07:20, lying-down cabins (see the night bus card)", "note": "<span class=\"nt\">Return the bike before boarding</span>"}], "sleep": [{"name": "Thu: Happy Homestay Du Gia, double room with breakfast (dinner is a EUR 7 extra on the 23 rate)", "price": "14 per room", "note": "Free cancellation", "link": "https://www.booking.com/hotel/vn/happy-homestay-du-gia-yen-minh.en-gb.html?checkin=2027-03-25&checkout=2027-03-26&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Happy+Homestay+Du+Gia", "primary": true}, {"name": "Fri: Xua Vu Homestay, double room with garden view, Meo Vac", "price": "17 per room", "note": "Free cancellation until 18 Mar; breakfast extra", "link": "https://www.booking.com/hotel/vn/xua-vu-homestay.en-gb.html?checkin=2027-03-26&checkout=2027-03-27&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Xua+Vu+Homestay+Meo+Vac", "primary": true}, {"name": "Sat: ToTo-Chan Hotel, standard double with breakfast, Dong Van", "price": "15 per room", "note": "Breakfast included, free cancellation until 24 Mar", "link": "https://www.booking.com/hotel/vn/toto-chan.en-gb.html?checkin=2027-03-27&checkout=2027-03-28&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=ToTo-Chan+Hotel+Dong+Van", "primary": true}, {"name": "Fri alternative (Airbnb): room in Meo Vac", "price": "15 per room (dates to re-read)", "note": "5.0 from only 17 reviews; cancellation terms not read; price and dates to re-read", "link": "https://www.airbnb.com/rooms/1448687455585712722?check_in=2027-03-26&check_out=2027-03-27&adults=2"}, {"name": "Sat alternative (Airbnb): room in Dong Van", "price": "16 per room (dates to re-read)", "note": "5.0 from only 15 reviews; cancellation terms not read; price and dates to re-read", "link": "https://www.airbnb.com/rooms/893991177587711327?check_in=2027-03-27&check_out=2027-03-28&adults=2"}], "sleepnote": "About EUR 56 for four nights (Faithien Wed, then Du Gia, Meo Vac, Dong Van). No dorms: a volunteer found bed bugs in a Ha Giang dorm in March 2026. Check each room row at booking. Alternatives for Faithien (Ha Giang town): Ha Giang Hostel (9.9 from 287) or Ali Hostel (10 from 89), private rooms only. Cash: ATMs only in Ha Giang town, Dong Van and Meo Vac, none in Du Gia: withdraw in town on Thu morning. Airbnb: Ha Giang town and Du Gia have nothing cheaper with real reviews; Meo Vac has a room EUR 2 cheaper and Dong Van one at about the same price, both with few reviews.", "menu": [{"name": "Self-ride the loop", "dur": "~14-15.5 h riding in all: Thu 3.5-4 h, Fri 2.5-3 h, Sat 2.5-3 h, Sun about 5.5 h back (133 km)", "cost": "125 cc about EUR 10-12 a day (VND 290-345k) against EUR 198 for a 3-4 day tour with a driver; an easy rider costs about USD 40 a day", "note": "Cash deposit and a written receipt, never the passport (homestays and the police need it). A notarised copy is the other way. Since April 2026 the road is more closely watched after a tourist death, so line up two shops: Hung Cuong (<a href=\"https://www.google.com/maps/search/?api=1&query=Hung+Cuong+Motorbike+Rental+Ha+Giang\" target=\"_blank\" rel=\"noopener\">4.9 from 75</a>) first, <a href=\"https://www.google.com/maps/search/?api=1&query=HagiangGo+Motorbike+Rental+Ha+Giang\" target=\"_blank\" rel=\"noopener\">HagiangGo</a> second. Ask for a semi-automatic 125 cc (engine braking) and skip Klook. Film the bike before and after", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Ha+Giang+Loop", "tags": ["hagiangloop"]}, {"name": "Ha Giang town: Km0 marker and Lo river walk", "dur": "~1.5 h", "cost": "free", "note": "Thu 25, a short stop on the way out of town", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Ha+Giang+Km0+Milestone", "tags": []}, {"name": "Meo Vac market (Sunday, not on your route)", "dur": "~1.5 h", "cost": "free", "note": "The largest market in the region, but Sunday you are in Dong Van for the ride back. Dong Van has its own Sunday market, at the door", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Meo+Vac+Market+Ha+Giang", "tags": []}, {"name": "Dong Van Sunday market", "dur": "~1 h", "cost": "free", "note": "Sun 28, 07:00-09:00: it peaks 06:30-09:00 and you sleep next to it", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Dong+Van+Market+Ha+Giang", "tags": ["dongvan"]}, {"name": "Ma Pi Leng pass", "dur": "~2 h riding and viewpoints, once: Sat morning, Meo Vac to Dong Van", "cost": "free", "note": "Rated 4.8 (816). Ridden once, in the morning light: it is the only crossing between Meo Vac and Dong Van. The USD 68 skywalk trek is not needed", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Ma+Pi+Leng+Pass", "tags": []}, {"name": "Nho Que boat", "dur": "30 min-2 h, not confirmed", "cost": "VND 120-150k (EUR 4-5), shuttle VND 50-100k", "note": "Fri afternoon after the Mau Due ride. Rated 4.8 (990). Take the kayak or half cruise; the party-music tour boats are the trap", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Nho+Que+River+Ha+Giang", "tags": []}, {"name": "Quan Ba, Heaven's Gate and Yen Minh (Sunday ride back)", "dur": "ridden through, 20 min stops", "cost": "free", "note": "The gate itself is gone, only a sign; the road is the value. Sunday on the way back, not Friday. The Quan Ba market is not on the menu: its day is not confirmed", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Quan+Ba+Heaven+Gate+Ha+Giang", "tags": []}, {"name": "Du Gia waterfall and family dinner", "dur": "~1.5 h + the Friday market and dinner", "cost": "fee not found", "note": "Waterfall Thu afternoon after the ride. The market is usually Fridays, over by noon (not confirmed): Fri from about 07:30. Cold water; one report says private, another too crowded", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Du+Gia+Waterfall+Ha+Giang", "tags": []}, {"name": "Lung Cu flag tower and village", "dur": "~2.5 h, a dead-end out and back, distance not sourced", "cost": "VND 30k (EUR 1)", "note": "Sat afternoon, only if the sky is clear when you reach Dong Van (about 2.5 h there and back, in before the 18:12 sunset); the passes fog at dusk. Cold and foggy in March. Rated 4.6 (9,331)", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Lung+Cu+Flag+Tower", "tags": []}, {"name": "Dong Van old quarter", "dur": "~2 h", "cost": "free", "note": "Sat 27, on arrival about 11:00", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Dong+Van+Old+Quarter", "tags": ["dongvan"]}, {"name": "Lung Khuy cave", "dur": "-", "cost": "fee not found", "note": "4.6 from only 48 reviews", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Lung+Khuy+Cave+Ha+Giang", "tags": []}, {"name": "Dong Van night market", "dur": "-", "cost": "-", "note": "Runs on lunar days 14-16, which are 21-23 Mar: none in your stay", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Dong+Van+Night+Market+Ha+Giang", "tags": []}], "tags": ["hagiangloop", "dongvan"], "extra": "<div class=\"note\"><b>The police.</b> About 48 of 58 self-riders who wrote about this loop in 2024-26 were stopped, about 8 in 10. The real rate is lower, because people who were fined post more. Of the 40 stopped riders with a known result, 11 paid nothing; the rest mostly paid VND 1.5-3M, typically 2M (about EUR 69). The legal fine without a motorcycle licence is 2-4M up to 125 cc and 6-8M above, so stay on a 125. One bike means one fine, shared by two. A pre-paid fine through the shop or a signed note covered later checkpoints in several accounts. Ride sober: the worst account, about 8M, followed beer at lunch.</div>"}, {"id": "hanoi2", "cls": "zh", "name": "Sunday night bus, Ha Giang to Ninh Binh", "short": "Night bus", "dates": "Sun 28 Mar", "nights": "night bus", "from_": "2027-03-28", "to": "2027-03-29", "avail": "bike back 15:30, bus leaves 22:00 or 23:00", "fit": "No Hanoi night here: you lie down in a cabin and wake up in Ninh Binh on Monday morning. A EUR 10 Faithien room in Ha Giang by day for a shower, bags and rest before the bus (skip it if the bike shop offers a free shower and bag storage).", "legs": [{"leg": "Sun 28 night bus to Ninh Binh", "how": "G8 23:00, single cabin, ends at the Tam Coc boat station 07:20, EUR 26, free cancellation, rated 4.5: no taxi at the end, so this is the pick (one July 2026 review of a G8 combo ticket had a change in Hanoi: check it says direct). Sao Viet 22:00, upper single cabin EUR 20, other cabins from EUR 23, rated 4.4, ends at Dong Gung bus station, Ninh Binh, 07:00. Both are lying-down cabins. Read for a December Sunday; March is not on sale. <a href=\"https://12go.asia/en/travel/ha-giang/ninh-binh?date=2027-03-28\" target=\"_blank\" rel=\"noopener\">12go, Ha Giang to Ninh Binh</a>", "note": "<span class=\"nt\">March 2027 times not published yet</span>"}, {"leg": "Fallback if the ride runs late", "how": "if the bus fails: Faithien that night (about EUR 10), first morning bus, Ninh Binh loses Monday (still 2 paid nights)", "note": ""}], "sleep": [{"name": "Sun: Faithien Homestay, Ha Giang, a room booked for Sun night and used for the afternoon (shower, bags, rest); also the fallback bed", "price": "10 per room", "note": "Same room type as Thu. If the bike shop offers a free shower and bag storage, skip it", "link": "https://www.booking.com/hotel/vn/ha-giang-faithien-homestay.en-gb.html?checkin=2027-03-28&checkout=2027-03-29&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Ha+Giang+Faithien+Homestay+Ha+Giang", "primary": true}], "sleepnote": "Ask Mr Thong whether the bags can be dropped and an early room is possible on Mon 29 at about 07:30. If not, a Sun 28 night there is about EUR 16 a room (not in the total).", "menu": [], "tags": [], "extra": ""}, {"id": "ninhbinh", "cls": "zs", "name": "Ninh Binh (Tam Coc)", "short": "Ninh Binh", "dates": "Mon 29 - Wed 31 Mar", "nights": "2 nights", "from_": "2027-03-29", "to": "2027-03-31", "avail": "Monday from about 07:20 (nap, then the afternoon), Tuesday full day, Wednesday morning; the van leaves about 12:30", "fit": "The Do list is about 17 h against about 21 h available (Mon ~5 h, Tue ~11 h, Wed ~5 h). Two nights hold all of it: Tuesday just runs full. If the bus fails you lose Monday: drop the Bich Dong loop and Van Long first.", "legs": [{"leg": "Wed 31 to Hanoi", "how": "limousine van from Tam Coc about 12:30, at La Ava's about 15:00, EUR 6-8 each (reviews report some pickup and time mishaps, so confirm the pickup point). Fallback: Grab to Ninh Binh station for train SE18, arrives about 14:10, soft seat EUR 6-11. <a href=\"https://12go.asia/en/travel/ninh-binh/hanoi?date=2027-03-31\" target=\"_blank\" rel=\"noopener\">12go, Wed 31 Mar</a>", "note": "<span class=\"nt\">Timetable is November 2026: re-check for 31 Mar</span>"}], "sleep": [{"name": "Pick: Mr Thong Homestay, 100 m from the cave", "price": "31 per room for 2 nights", "note": "Rated 9.3 from 234", "link": "https://www.booking.com/hotel/vn/mr-thong-doi-2-tam-coc-motel.en-gb.html?checkin=2027-03-29&checkout=2027-03-31&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Mr+Thong+Homestay+Tam+Coc", "primary": true}, {"name": "Alternative: BamBoo Villa Homestay", "price": "about 31 per room for 2 nights (dates to re-read)", "note": "Rated 9.7 from 221", "link": "https://www.booking.com/hotel/vn/bamboo-villa-homestay.en-gb.html?checkin=2027-03-29&checkout=2027-03-31&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=BamBoo+Villa+Homestay+Tam+Coc", "primary": false}, {"name": "Airbnb: whole apartment, Tam Coc", "price": "about 25 per room for 2 nights (dates to re-read)", "note": "4.9 from 147 reviews; cancellation terms not read", "link": "https://www.airbnb.com/rooms/47259609?check_in=2027-03-29&check_out=2027-03-31&adults=2"}, {"name": "Airbnb: private room, Tam Coc", "price": "about 26 per room for 2 nights (dates to re-read)", "note": "4.91 from 95 reviews; cancellation terms not read", "link": "https://www.airbnb.com/rooms/44113019?check_in=2027-03-29&check_out=2027-03-31&adults=2"}], "sleepnote": "Sleep in Tam Coc, not in Ninh Binh city and not by Hang Mua. Airbnb has a whole apartment for about 25 for 2 nights (4.9 from 147, dates to re-read), 6 less than the pick; the pick stays for its dated free cancellation while the party size is open.", "menu": [{"name": "Bich Dong pagoda and cycle loop", "dur": "2-3 h", "cost": "free entry, parking VND 20k; bicycle often free at the guesthouse (or VND 40-100k)", "note": "Tam Coc, Bich Dong, Thung Nham road. Mon 29, 15:00 after the nap: the pagoda is open 07:30-17:00, the loop outside is for the golden hour (sunset 18:10). Bich Dong 4.4 (7,244)", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Bich+Dong+Pagoda+Ninh+Binh", "tags": []}, {"name": "Tam Coc boat", "dur": "1.5-2 h, 07:30", "cost": "VND 250k each at the official booth; agree a tip of 20-50k first", "note": "Only if you want a second boat: Trang An has the caves. Rated 4.5 (18,606); the side piers rate 3.0-3.5, avoid", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Tam+Coc+Ninh+Binh", "tags": ["tamcoc"]}, {"name": "Hang Mua viewpoint", "dur": "~2 h, about 500 steps", "cost": "VND 100k (EUR 3.5)", "note": "Tue 30 at sunset (18:10); start 17:00. Park in Tam Coc: parking touts near the cave", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Hang+Mua+Ninh+Binh", "tags": []}, {"name": "Cuc Phuong National Park", "dur": "~6 h with the ride (visit time a guess)", "cost": "VND 60k + VND 50k per primate or turtle programme", "note": "Tuesday alternative to Phat Diem: 75 min each way (60 km). A local says skip it; butterfly season is late April. Rated 4.5 (5,240)", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Cuc+Phuong+National+Park", "tags": ["cucphuong"]}, {"name": "Phat Diem stone cathedral", "dur": "about 1 h visit, 1 h ride each way", "cost": "free", "note": "Tue 30, 13:30, after Hoa Lu. Rated 4.7 (5,082)", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Phat+Diem+Cathedral", "tags": []}, {"name": "Van Long nature reserve", "dur": "~3 h in all, 45-90 min on the boat", "cost": "VND 100k (EUR 3.5)", "note": "Wed 31 07:30. Quiet, no vendors, langurs. Price unclear (VND 100k each or per boat): ask the kiosk", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Van+Long+Nature+Reserve", "tags": []}, {"name": "Hoa Lu, the old capital", "dur": "~1.5 h", "cost": "VND 20k", "note": "You said you want to see it. Tue 30 at 11:00, next to Trang An", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Hoa+Lu+Ancient+Capital", "tags": []}, {"name": "Bai Dinh pagoda", "dur": "~2.5 h", "cost": "electric car VND 100k", "note": "Rated 4.7 (36,253) but big, modern and crowded", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Bai+Dinh+Pagoda", "tags": []}, {"name": "Trang An by rowing boat", "dur": "~3 h: Route 1 at 07:00, 9 caves (2.5-3.5 h)", "cost": "VND 250k cash at the gate (one operator says 300k: budget 300k)", "note": "Tue 30 07:00; tour buses come 10:00-13:30. Rowed only. Rated 4.6 (15,556)", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Trang+An+Eco-Tourism+Complex+Ninh+Binh", "tags": ["trangan"]}, {"name": "Trang An self-paddle kayak", "dur": "~2-3 h, reported 5-8 km through two caves", "cost": "double VND 350-400k a boat (single 250-300k); the entry ticket may be extra", "note": "Ask at the gate at 07:00 whether the ticket is extra and what a kayak costs. The rowed boat stays the plan; this is for if rowing feels like less fun than paddling yourself", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Trang+An+Eco-Tourism+Complex+Ninh+Binh", "tags": []}, {"name": "Hoa Lu self-paddle boats", "dur": "1 h, 15:00-18:30", "cost": "about VND 80k each an hour", "note": "One report of small boats you paddle yourself at Hoa Lu Ancient Town. Not confirmed; ask when you are there. Clashes with Hang Mua on Tue 30: only if you drop it", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Hoa+Lu+Ancient+Capital", "tags": []}, {"name": "Thung Nham bird garden", "dur": "~2.5 h", "cost": "VND 150k with boat", "note": "-", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Thung+Nham+Bird+Garden", "tags": []}, {"name": "Scooter", "dur": "all stay", "cost": "VND 100-200k a day in two guides, 650k-1.35M in a third: ask the shop", "note": "Film it, cash deposit VND 1-2M, not the passport. One blog reports more police checks near Hang Mua in 2026", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Scooter+rental+Tam+Coc+Ninh+Binh", "tags": []}, {"name": "Private boat at Trang An", "dur": "-", "cost": "VND 800k-1M", "note": "Same as the VND 250k ticket", psody. Fri and Sat only, 20:00, 21:00 and 22:00", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Spectra+Marina+Bay+Sands+Singapore", "tags": []}, {"name": "GuruWalk free tour", "dur": "~3 h", "cost": "pay what you want, a tip of S$30-50 is the guideline", "note": "Chinatown, Little India, Kampong Glam; 4.96 from 225 reviews. Only if a guide has a slot on Saturday after 16:00", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Chinatown+Singapore", "tags": []}, {"name": "Pulau Ubin", "dur": "~5-6 h", "cost": "bumboat S$4-5 one way each, bike about S$10-20 (prices differ); bring S$30 cash each, there is no ATM on the island", "note": "Sunday. MRT and bus to Changi Point, about 1 h from Kampong Glam; leave 09:30, back about 16:00, then eat at Changi Village Hawker Centre by the jetty", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Pulau+Ubin+Singapore", "tags": []}, {"name": "Changi Village Hawker Centre", "dur": "~1 h", "cost": "cheap meals", "note": "Sun 4, after Ubin; a 5 min walk from the Changi Point jetty. Rated 4.3 on Maps", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Changi+Village+Hawker+Centre+Singapore", "tags": []}, {"name": "Southern Ridges: Mount Faber to Henderson Waves", "dur": "1.5-2 h", "cost": "free", "note": "Mon 08:30-11:00, before the heat (or after 16:30). Rain cancels it", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Henderson+Waves", "tags": []}, {"name": "Chinatown temples: Sri Mariamman and Buddha Tooth Relic", "dur": "~45 min", "cost": "free", "note": "Qingming falls around 4-5 Apr: expect busy temples", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Sri+Mariamman+Temple+Singapore", "tags": []}, {"name": "Kayak at Pasir Ris", "dur": "~2 h", "cost": "about S$12 an hour", "note": "Weekend from 10:00, weekdays from 15:00. Does not fit a 1.7-day stop", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=P
