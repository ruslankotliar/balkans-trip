abi", "how": "Scoot via Changi on one booking, 19 h 45 (6 h 15 wait airside)", "when": "Sun 14 Mar 10:00, lands Mon 15 11:45", "eur": 329, "status": "buy", "link": "https://www.google.com/travel/flights?q=One%20way%20flights%20from%20VIE%20to%20KBV%20on%202027-03-14&curr=EUR&hl=en"}, {"route": "Krabi to Hanoi", "how": "Thai AirAsia via Bangkok DMK, 6 h 40 (3 h 30 wait at DMK)", "when": "Wed 24 Mar 13:35, lands 20:15", "eur": 122, "status": "buy", "link": "https://www.google.com/travel/flights?q=One%20way%20flights%20from%20KBV%20to%20HAN%20on%202027-03-24&curr=EUR&hl=en"}, {"route": "Hanoi to Singapore", "how": "Scoot nonstop, 3 h 30 in the air; 06:00 taxi to 14:20 at Changi", "when": "Sat 3 Apr 09:50", "eur": 75, "status": "wait", "link": "https://www.google.com/travel/flights?q=One%20way%20flights%20from%20HAN%20to%20SIN%20on%202027-04-03&curr=EUR&hl=en"}, {"route": "Singapore to Vienna", "how": "Scoot nonstop, 12 h 10", "when": "Tue 6 Apr 02:45, home 08:55", "eur": 281, "status": "buy", "link": "https://www.google.com/travel/flights?q=One%20way%20flights%20from%20SIN%20to%20VIE%20on%202027-04-06&curr=EUR&hl=en"}], "otherdays": [["Fri 12 Mar out", "Qatar + Thai, 2 stops, 17 h 55", 550, "No Scoot. 221 more for nothing"], ["Sun 14 Mar out", "Scoot 19 h 45, lands Mon 15 at 11:45", 329, "The plan"], ["Mon 15 Mar out", "Qatar + Thai, 2 stops", 518, "No Scoot that day. Loses a day, 189 more"], ["Tue 16 Mar out", "Scoot 19 h 45", 329, "Loses an island day, saves nothing"], ["Tue 6 Apr back", "Scoot nonstop 02:45", 281, "Settled: Thu 8 ruled out"]], "flightsnote": "One adult, one way, cheapest fares read on 3 Nov 2026 (Krabi to Hanoi moves between 112 and 122: re-read it when you buy). An extra island day is about EUR 80 and an extra Singapore day EUR 110 (room share, food, one activity; estimate). No other airline to Krabi is cheaper: the nearest are Air Arabia to Phuket at 457 (13 h 55, adds a road leg) and Mon 15 Qatar + Thai at 518 (loses a day). The 10:00 out and the 02:45 home are the only Scoot times, so the early hours cannot be avoided.", "rooms": [{"stop": "Ao Nang", "prop": "Baan Thara Guesthouse", "room": "Budget Double or Twin, ensuite, AC, 19 m2", "dates": "15-18 Mar", "eur": 110, "cancel": "free until 13 Mar", "link": "https://www.booking.com/hotel/th/baan-thara-guesthouse-nopprarat-thara-beach-aonang-krabi.en-gb.html?checkin=2027-03-15&checkout=2027-03-18&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"stop": "Koh Mook", "prop": "Kookkai Bungalows (Booking: Mook Bamboo Bungalows)", "room": "Bungalow with Garden View, 24 m2, breakfast", "dates": "18-20 Mar", "eur": 64, "cancel": "free until 15 Mar", "link": "https://www.booking.com/hotel/th/kookkai-bungalows.en-gb.html?checkin=2027-03-18&checkout=2027-03-20&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"stop": "Koh Lanta", "prop": "Cat Bungalow", "room": "Standard Double with Fan, breakfast", "dates": "20-24 Mar", "eur": 80, "cancel": "free until 19 Mar", "link": "https://www.booking.com/hotel/th/cat-bungalow.en-gb.html?checkin=2027-03-20&checkout=2027-03-24&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"stop": "Hanoi", "prop": "La Ava's Home", "room": "Double Room, ensuite, AC, 25 m2", "dates": "24 Mar", "eur": 26, "cancel": "free until the day before", "link": "https://www.booking.com/hotel/vn/la-avas-home.en-gb.html?checkin=2027-03-24&checkout=2027-03-25&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"stop": "Hanoi", "prop": "La Ava's Home", "room": "Double Room, ensuite, AC, 25 m2", "dates": "2 Apr", "eur": 26, "cancel": "free until 1 Apr", "link": "https://www.booking.com/hotel/vn/la-avas-home.en-gb.html?checkin=2027-04-02&checkout=2027-04-03&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"stop": "Ha Giang", "prop": "Faithien Homestay", "room": "Double Room with Mountain View", "dates": "Thu 25 Mar", "eur": 10, "cancel": "free cancellation (cancel-by date shown at booking)", "link": "https://www.booking.com/hotel/vn/ha-giang-faithien-homestay.en-gb.html?checkin=2027-03-25&checkout=2027-03-26&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"stop": "Ha Giang", "prop": "Happy Homestay Du Gia", "room": "Double Room, breakfast", "dates": "Fri 26 Mar", "eur": 14, "cancel": "free cancellation (cancel-by date shown at booking)", "link": "https://www.booking.com/hotel/vn/happy-homestay-du-gia-yen-minh.en-gb.html?checkin=2027-03-26&checkout=2027-03-27&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"stop": "Ha Giang", "prop": "ToTo-Chan Hotel", "room": "Standard Double, breakfast", "dates": "Sat 27 Mar", "eur": 18, "cancel": "free cancellation (cancel-by date shown at booking)", "link": "https://www.booking.com/hotel/vn/toto-chan.en-gb.html?checkin=2027-03-27&checkout=2027-03-28&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"stop": "Ha Giang", "prop": "Xua Vu Homestay", "room": "Double with Garden View", "dates": "Sun 28 Mar", "eur": 17, "cancel": "free until 21 Mar", "link": "https://www.booking.com/hotel/vn/xua-vu-homestay.en-gb.html?checkin=2027-03-28&checkout=2027-03-29&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"stop": "Ha Giang", "prop": "Faithien Homestay", "room": "Double Room with Mountain View (booked for Mon night, used for the afternoon: shower, bags, rest; also the bed if the bus fails; skip it if the bike shop offers a free shower and bag storage)", "dates": "Mon 29 Mar", "eur": 10, "cancel": "read at booking", "link": "https://www.booking.com/hotel/vn/ha-giang-faithien-homestay.en-gb.html?checkin=2027-03-29&checkout=2027-03-30&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"stop": "Ninh Binh", "prop": "Mr Thong Homestay", "room": "King Room with Garden View, breakfast", "dates": "30 Mar-2 Apr", "eur": 47, "cancel": "free until 29 Mar", "link": "https://www.booking.com/hotel/vn/mr-thong-doi-2-tam-coc-motel.en-gb.html?checkin=2027-03-30&checkout=2027-04-02&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"stop": "Singapore", "prop": "Heritage Collection on Kampong Glam", "room": "Loft (Skylight)", "dates": "3-6 Apr", "eur": 349, "cancel": "non-refundable", "link": "https://www.booking.com/hotel/sg/heritage-collection-on-kg.en-gb.html?checkin=2027-04-03&checkout=2027-04-06&group_adults=2&no_rooms=1&selected_currency=EUR"}], "todo": [{"kind": "buy", "title": "Buy the firm flights", "body": "Vienna to Krabi Sun 14 Mar 329 and Krabi to Hanoi 122: EUR 451 each. Singapore to Vienna Tue 6 Apr 02:45 (281) for her now, and for you too unless you stay on after Singapore. Buy Vienna to Krabi as ONE Scoot booking through Changi and ask for both boarding passes at Vienna check-in: then Mon 15 Mar stays airside and you never enter Singapore (<a href=\"https://www.ica.gov.sg/information-and-e-services/entry-and-departure/entering-singapore/transit-through-singapore\" target=\"_blank\" rel=\"noopener\">ICA transit page</a>). Krabi to Hanoi moves between 112 and 122: re-read the fare when you buy. Hanoi to Singapore waits for the Friday or Saturday card below. Bags: 7 kg for the Thai AirAsia leg (cabin bag and personal item together), or the AirAsia Xtra Carry-On (14 kg, pre-booked; price at booking) instead of a checked bag.", "due": "now", "link": "https://www.google.com/travel/flights?q=One%20way%20flights%20from%20VIE%20to%20KBV%20on%202027-03-14&curr=EUR&hl=en", "linktext": "Open Google Flights"}, {"kind": "ask", "title": "Check your residence cards (yours and hers)", "body": "The date printed must run past Tue 6 Apr 2027. If it is the temporary-protection card: the EU extended that protection to 4 Mar 2028 (decision of 30 Jul 2026), but a card still printed 4 Mar 2027 needs renewing before Sun 14 Mar. Leaving Austria for 24 days does not end an existing protection status under the EU decision (it applies to people who keep the status continuously); if unsure, ask the BFA in writing. If your status is something else (work or study permit), check its date the same way.", "due": "now", "link": "https://eur-lex.europa.eu/eli/dec_impl/2026/1912/oj/eng", "linktext": "EU decision 2026/1912"}, {"kind": "decide", "title": "Hanoi to Singapore: Friday evening or Saturday morning", "body": "Sat 3 Apr 09:50 (EUR 75) is the default, but it breaks your rule that an afternoon or evening flight beats an early one. Fri 2 Apr 20:15, lands 00:35 (EUR 61): a whole Saturday in Singapore, a fourth Singapore bed, a shorter Hanoi evening, about EUR 31 more each in all. Saturday 16:15 is EUR 125. Scoot flies this route on 27, 29, 31 Mar and 1, 2, 3, 5 Apr only. If Scoot cancels, Saturday 16:15 (EUR 125) is the fallback; book the Singapore loft only after this flight.", "due": "before buying Hanoi to Singapore"}, {"kind": "decide", "title": "Ninh Binh 3 nights, or 2 + a Hanoi night", "body": "Mon 29 is the night bus straight to Ninh Binh. Still open: keep Ninh Binh 3 nights (the third day is Cuc Phuong or Phat Diem, not filler), or Ninh Binh 2 and a Hanoi night on Thu 1 Apr (food tour, clubs). The Hanoi night costs about EUR 10 more per room (+5 each); you sleep in Hanoi on Thu 1, so Fri 2 starts in Hanoi.", "due": "before booking rooms"}, {"kind": "decide", "title": "Hong Islands: group tour or private longtail", "body": "Group tour about EUR 34-37 each (68-74 for two). Private longtail THB 2,500-2,800 a boat plus park fee, about EUR 84-92 for two, your own pace. Fits Wed 17 instead of the climbing half day: back about 15:30, work 16:00-18:00, market after. The park fee (THB 300 each) may be extra.", "due": "before Wed 17 Mar"}, {"kind": "decide", "title": "Mook, Friday morning: Kradan and Ngai or the dugong boat", "body": "Kradan and Ngai snorkel 09:00-13:30, or the Libong dugong boat 08:00-10:30 (about a 1 in 3 chance, price from Mook unconfirmed). The cave is at 14:30 either way.", "due": "Thu evening 18 Mar"}, {"kind": "decide", "title": "Paid fishing trip on Lanta, yes or no", "body": "A resort boat is about THB 4,750 for two (6 h, a meal); a private longtail about USD 200 each; the village price at Saladan pier or Old Town is still to be asked.", "due": "by Sat 20 Mar"}, {"kind": "decide", "title": "Hanoi food tour: paid small group or free Hanoikids", "body": "Paid small group EUR 14-21 each, walk up the same day. Hanoikids is free student guides but needs booking ahead. Fri 2 Apr evening 18:30-21:30; the day plan holds this slot until you choose.", "due": "before Fri 2 Apr"}, {"kind": "decide", "title": "Your own flight home, and Vova", "body": "Singapore to Vienna (281) is settled for her. Yours waits only if you stay on after Singapore; then you still need an onward air ticket before Hanoi check-in on 3 Apr (entry on 3 Apr needs one within 96 hours). If Vova joins at Singapore, he needs his own onward ticket the same way.", "due": "before 3 Apr"}, {"kind": "ask", "title": "Genki Traveler in writing", "body": "Ask now: does it cover a 125 cc on Ha Giang roads without a motorcycle licence (it excludes unsupervised off-road), and evacuation from Ha Giang to Hanoi, and which home country applies? World Nomads and SafetyWing do not cover it. Ask ÖAMTC (Weltreise-Krankenschutz) the same in writing, including evacuation. Price: read at purchase.", "due": "before Sun 14 Mar (first scooter Tue 16 Mar)"}, {"kind": "book", "title": "Book the rooms; all but the Singapore loft have free cancellation", "body": "Do not book until you know whether friends join: the rooms are for two. See the Book tab for the twelve bookings and their cancel-by dates. Book Dong Van (Sat 27) first, it anchors the Sunday market. The Singapore loft is non-refundable: book it after the flights.", "due": "after the flights"}, {"kind": "do", "title": "Vietnam e-visa", "body": "evisa.gov.vn only (no agents), USD 25, name exactly as in the passport, apply about 3 weeks early. Pick Noi Bai as the entry AND the exit port, validity from 24 Mar to a few days after 3 Apr, and print it. Optional: the Vietnam pre-arrival declaration at prearrival.immigration.gov.vn.", "due": "by 28 Feb", "link": "https://evisa.gov.vn/", "linktext": "evisa.gov.vn"}, {"kind": "do", "title": "Travel doctor", "body": "Hepatitis A and rabies, 6+ weeks out.", "due": "by 31 Jan"}, {"kind": "do", "title": "Thailand TDAC and Singapore arrival card", "body": "Both free. Thai TDAC on tdac.immigration.go.th, Fri 12 or Sat 13 Mar (the arrival day counts and you fly Sun 14). SG Arrival Card on ica.gov.sg only, Thu 1 or Fri 2 Apr (do it Fri evening in Hanoi).", "due": "Fri 12-Sat 13 Mar; Thu 1-Fri 2 Apr"}], "ask": ["Two Ha Giang bike shops on WhatsApp before Thu 25: a 125 cc from Thu evening to Mon 15:30 (one bike each), a cash deposit instead of the passport, free bag storage, a free shower on Mon 29 afternoon (if yes, skip the Faithien room that night), and where the Sao Viet or G8 pickup is on Mon 29.", "Cat Bungalow: pier pickup on Sat 20, and a private car to Krabi airport on Wed 24 at 06:30 (price: about EUR 60 a car (EUR 30 each), 12go; the shared van's first run is 08:00).", "Kookkai Bungalows: the Emerald Cave boat time on Fri 19 Mar (low water is about 14:45) and the boatman's price for 14:30; agree both Friday boat times on Thu evening (Fri midday is prayer time); a village agent for the Mook to Lanta boat on Sat (11:00 or 14:00).", "Thai AirAsia in writing: is Krabi to Hanoi one Fly-Thru ticket, with bags and immigration handled at Bangkok? And what does the Xtra Carry-On (14 kg) cost?", "Mu Ko Lanta park HQ, +66 75 656 576: confirm the gate hours (16:30 or 17:30 is given).", "Mr Thong Homestay: bag drop and early check-in if you arrive off the night bus (about 07:00-08:30)."], "gaps": ["March 2027 times and fares: Mook to Lanta boat (11:00 and 14:00 on a November date), the Hanoi to Ha Giang bus (09:30), the night buses back (22:00, 23:00; arrival 07:00-08:30), the Ninh Binh to Hanoi trains (07:12, 08:18).", "Tides: low tide at Ao Nang on 15 Mar; the Emerald Cave boat time on 19 Mar is for Kookkai to confirm. Ao Nang beach has no pier, you may wade.", "Room types and prices were not all read for your dates: open each booking page again before paying.", "Opening hours: Lanta Muay Thai class times, Boulder Movement on Mon 5 Apr.", "Prices not found: fishing from the village, the dugong boat from Mook, the Van Long boat. Not agreed: Khao Mai Kaew entry (THB 200-300), Hong park fee (THB 300 each).", "Scooter prices for 110-160 cc only traveller accounts for Mook, Ninh Binh and Java, no shop quotes.", "Some place tags show no posts yet.", "The workation after Singapore (where, how long, with whom) is not decided."], "money": {"rows": [["Four flights", 807, "329 + 122 + 75 + 281. Krabi to Hanoi moves between 112 and 122: re-read it when you buy. Your 281 drops out if you stay on after Singapore"], ["Rooms, two sharing", 386, "771 for the twelve bookings (110 + 64 + 80 + 26 + 26 + 10 + 14 + 18 + 17 + 10 + 47 + 349), halved: 385.5, shown 386; Hanoi 2 nights, Mon 29 Faithien, Ninh Binh 3 nights (30 Mar-2 Apr)"], ["Boats, vans, buses, trains", 148, "estimate: Mook to Lanta at THB 540-600 (about 15), plus 16 for the private car on Wed 24 (EUR 30 each against about 14 for the shared van)"], ["Scooters and petrol", "95-110", "estimate: 11 bike days, one bike each (Ha Giang 4, Lanta 4, Krabi 1, Ninh Binh 2). Rentals 80-95 (Ha Giang EUR 10-12 a day, Lanta and Krabi THB 250, Ninh Binh VND 100-200k) plus petrol about 15. Two people on one bike would be about half the rental"], ["Food", "500-750", "estimate: Thailand 25-35 a day, Vietnam 15-25, Singapore 35-50"], ["Activities, every Do item", "217-296", "THB 5,650-7,720 + VND 790-970k + SGD 58-83 each, from the Do items on the days (Skyway S$14 and Kampong Glam about S$10 included); scooter rentals are in the row above. Not in it (your calls): Hong Islands group tour, net -6 to +13 against the climbing day it replaces; Hanoi paid food tour, net +11 to +18; fishing about +63 (resort boat split in two); the cooking class about +53. Without Koh Rok and the gym about 77-103 less"], ["Insurance, e-visa, permit, ATM, data, laundry", "116-253", "insurance 35-110, e-visa 22, Ha Giang permit 9, ATM 10-20, data 30-72, laundry 10-20"]], "total": "2269-2750", "note": "Not in it: vaccines (hep A + rabies about EUR 319 at German prices, if the travel doctor advises them), a Ha Giang fine (VND 2-3M if stopped), the Hong park fee if the tour leaves it out (THB 300 each, about +8), your open calls (Friday flight to Singapore +31, Hong Islands, food tour, fishing, Ninh Binh 2 nights + a Hanoi night about +5), staying on after Singapore (replaces the 281 flight home)."}, "info": [{"title": "Entry", "items": ["Thailand: 30 days visa-free for Ukrainian passports, plus the free TDAC card (tdac.immigration.go.th) on Fri 12 or Sat 13 Mar (the arrival day counts). Show proof of funds if asked and carry the printed Krabi to Hanoi ticket as the onward ticket.", "Vietnam: e-visa USD 25 on evisa.gov.vn only. Pick Noi Bai as entry AND exit, validity 24 Mar to a few days after 3 Apr, name exactly as in the passport, apply about 3 weeks early, print it. Optional: the pre-arrival declaration at prearrival.immigration.gov.vn.", "Singapore: Ukrainian passports need a visa, and this stay is covered by the 96-hour Visa-Free Transit Facility instead (Ukraine is on its list): a confirmed onward air ticket out within 96 hours (the Tue 6 Apr 02:45 flight, 60 h after landing) and the free SG Arrival Card on ica.gov.sg only, Thu 1-Fri 2 Apr. Print the Singapore to Vienna ticket and the hotel booking.", "Mon 15 Mar at Changi: book Vienna to Krabi as one Scoot booking and ask for both boarding passes at Vienna check-in. Stay airside and you never enter Singapore: no arrival card and no use of the 96-hour rule. Two separate tickets would force immigration. <a href=\"https://www.ica.gov.sg/information-and-e-services/entry-and-departure/entering-singapore/transit-through-singapore\" target=\"_blank\" rel=\"noopener\">ICA transit page</a>", "Carry printed: Krabi to Hanoi ticket, e-visa, Hanoi to Singapore and Singapore to Vienna tickets, hotel bookings. Thailand, Vietnam and Singapore expect 6 months of validity: yours must run to at least early Oct 2027.", "Fake paid sites exist for all three, charging USD 20-90."]}, {"title": "Scooters", "items": ["Shops rent without a licence or IDP in every account found. Give cash, not the passport: a shop held a passport and quoted THB 5,000 for scratches.", "Krabi and Lanta: few stops, fine THB 500-2,000. Ha Giang: about 13 of 16 self-riders stopped, VND 2M (EUR 65) is normal, budget 2-3M each.", "Insurance: nobody checks until a crash, then the policy is void. World Nomads and SafetyWing require the right licence class. Genki Traveler reportedly covers a light motorcycle without a licence: get it in writing."]}, {"title": "Phone and money", "items": ["Your Airalo Asialink eSIM lists Thailand, Vietnam and Singapore. Check the price and hotspot terms in the app. Backup: a Viettel SIM at Noi Bai baggage claim, about EUR 10, works in Ha Giang.", "Thai ATMs charge a flat THB 220-350 a withdrawal: take the maximum once and refuse the ATM conversion. Mook has one ATM that can run dry: withdraw once in Ao Nang on Mon 15 and bring enough for Mook (THB 6,000-8,000 for two).", "Take VND 5-8M from a VPBank ATM in Hanoi (Wed night or Thu morning). On the loop only Ha Giang town, Dong Van and Meo Vac have ATMs, none in Du Gia: top up in town on Thu."]}, {"title": "Pack and health", "items": ["Pack to 7 kg from day one: Thai AirAsia counts the cabin bag and personal item together and gate weighing is reported; the Xtra Carry-On (14 kg, pre-booked) is the alternative to a checked bag. Scoot allows 10 kg in two pieces. No tent: one backpack.", "Ha Giang in late March: nights under 10 C on 16-26% of days, smoke at Dong Van. Mask, warm layer, goggles, check the air index a week out.", "Vapes are banned in Thailand and Singapore. Travel doctor 6+ weeks out.", "Laundry: Lanta, 20-23 Mar. Rest: Mon 15 afternoon only."]}, {"title": "Arrivals and flights", "items": ["Krabi: shared van or bus (THB 100-150 each) or Grab, never a THB 1,600 hotel transfer.", "Noi Bai: never go with a driver who approaches you (550k asked for a 300k ride); Bus 86 or Grab in the app.", "The flight out on 14 Mar is covered by EU261: if it lands 3 h or more late you can claim compensation, up to EUR 600 each (check Regulation 261/2004 on EUR-Lex). The flight home from Singapore is not covered.", "Night buses: be at the pickup 30+ min early. Rentals: film the bike, cash deposit, never the passport.", "A hotel message on WhatsApp asking you to confirm your card after a booking is a scam."]}, {"title": "Time and light", "items": ["Thailand and Vietnam are 6 h ahead of Vienna until Sun 28 Mar, then 5 h. Singapore one hour more.", "Sunrise and sunset: Ao Nang 06:32 to 18:36, Ha Giang and Dong Van about 05:57 to 18:12, Hanoi about 05:55 to 18:10, Singapore 07:04 to 19:12.", "Work blocks (2-6 h): Tue 16 (morning), Wed 17, Fri 19, Tue 23 (KoHub), Tue 30. Not on the loop, travel days, Fri 2 or in Singapore. Wifi on Mook and in Ha Giang unconfirmed."]}, {"title": "Weather by stop", "items": ["Hanoi (24-25 Mar, 2-3 Apr): about the same rain on either set of dates.", "Ha Giang and Dong Van: wet either way, heavy rain on 43-47% of days. Dong Van nights fall under 12 C on about 13% of days in late March and early April.", "Ninh Binh (30 Mar-2 Apr): about the same as Hanoi.", "Singapore (3-6 Apr): heavy rain on 38-42% of days from 27 Mar, against 22% in mid-March. Keep a rain plan; the Southern Ridges and the Skyway shut in rain."]}]};
const $ = s => document.querySelector(s);
const ST = Object.fromEntries(T.stops.map(s => [s.id, s]));
const VERD = [['do', 'Do'], ['fine', 'Fine'], ['idea', 'Idea'], ['skip', 'Skip']];
const ICON = {
  now: '<path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/>',
  days: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  places: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  book: '<path d="M4 7h16v12H4zM8 7V5h8v2M4 12h16"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>'
};
const VIEWS = [['now', 'Now'], ['days', 'Days'], ['places', 'Places'], ['book', 'Book'], ['info', 'Info']];
let FRAMED = false; try { FRAMED = window.self !== window.top; } catch (e) { FRAMED = true; }
const show = { do: true, fine: true, idea: true, skip: false };

const A = (u, t, cls) => u ? `<a ${cls ? `class="${cls}" ` : ''}href="${u}" target="_blank" rel="noopener">${t}</a>` : '';
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const dnum = s => Math.round(new Date(s + 'T12:00:00').getTime() / 864e5);
const nightsOf = s => dnum(s.to) - dnum(s.from_);
const eur = n => 'EUR ' + n;
const short = s => s.short || s.name;
const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
const fmt = (s, o) => new Date(s + 'T12:00:00').toLocaleDateString('en-GB', o);
const qs = new URLSearchParams(location.search);
const today = () => qs.get('today') || iso(new Date());
const dayIdx = d => T.days.findIndex(x => x.date === d);
const flightOn = d => T.flights.find(f => f.when.startsWith(fmt(d, { weekday: 'short' }) + ' ' + fmt(d, { day: 'numeric' }) + ' '));

function see(it) {
  const l = [];
  if (it.link) l.push(A(it.link, 'Open'));
  if (it.map) l.push(A(it.map, 'Map'));
  (it.tags || []).forEach(t => l.push(A(`https://www.instagram.com/explore/tags/${t}/`, '#' + t)));
  (it.links || []).forEach(x => l.push(A(x.url, x.label)));
  return l.length ? `<div class="see">${l.join('')}</div>` : '';
}
const val = x => x && x !== '-' ? x : '';
function item(it) {
  const meta = [val(it.dur) && `<b>${it.dur}</b>`, val(it.cost)].filter(Boolean).join(' · ');
  return `<div class="it ${it.v}"><div class="t"><b>${it.name}</b><span class="pill ${it.v}">${VERD.find(v => v[0] === it.v)[1]}</span></div>
  ${meta ? `<div class="meta">${meta}</div>` : ''}${val(it.note) ? `<div class="note">${it.note}</div>` : ''}${see(it)}</div>`;
}
function mini(it) {
  return `<div class="mi"><b>${it.name}</b>${val(it.dur) ? `<span class="muted small"> · ${it.dur.split(/[:,(]/)[0]}</span>` : ''}${see(it)}</div>`;
}
function strip() {
  const st = T.stops.map(s => ({ s, n: Math.max(nightsOf(s), 1) }));
  return `<div class="strip">${st.map(x => `<a class="${x.s.cls}" style="flex:${x.n}" href="#places/${x.s.id}" title="${x.s.name}"></a>`).join('')}</div>
  <div class="striplab">${st.map(x => `<span style="flex:${x.n}">${x.n > 1 ? short(x.s) : ''}</span>`).join('')}</div>`;
}
function bedCard(x) {
  return `<div class="bed"><div class="n"><div class="lead">${x.name}</div><div class="note">${x.note}</div></div><div><span class="price">${eur(x.price)}</span><div class="acts">${A(x.link, 'Open', 'btn')}${A(x.map, 'Map', 'btn alt')}</div></div></div>`;
}
function sleepBlock(s) {
  const p = s.sleep.filter(x => x.primary), alt = s.sleep.filter(x => !x.primary);
  return `${p.length ? `<div class="card">${p.map(bedCard).join('<hr style="border:0;border-top:1px solid var(--line);margin:12px 0">')}</div>` : ''}
  ${alt.length ? `<details><summary>${alt.length} other ${alt.length > 1 ? 'options' : 'option'}</summary>${alt.map(x => `<div class="card">${bedCard(x)}</div>`).join('')}</details>` : ''}
  ${s.sleepnote ? `<p class="note">${s.sleepnote}</p>` : ''}`;
}
const legs = s => s.legs.length ? `<div class="card">${s.legs.map(l => `<div class="leg"><b>${l.leg}</b>${l.how}${val(l.note) ? `<div class="note">${l.note}</div>` : ''}</div>`).join('')}</div>` : '';
function todoCard(x) {
  return `<div class="card"><div style="display:flex;gap:8px;align-items:center"><span class="pill ${x.kind}">${x.kind}</span><span class="muted small">${x.due}</span></div><div class="lead">${x.title}</div><div class="small">${x.body}</div>${x.link ? `<div class="acts">${A(x.link, x.linktext || 'Open', 'btn alt')}</div>` : ''}</div>`;
}

/* ---------- views ---------- */
function vNow() {
  const t = today(), start = T.meta.start;
  if (t < start) {
    const n = dnum(start) - dnum(t), f = T.flights[0];
    return `<div class="card"><p class="kick">Before the trip</p><p class="big">${n} days</p><p class="small muted" style="margin:0">until ${f ? f.route + ', ' + f.when : fmt(start, { weekday: 'short', day: 'numeric', month: 'short' })}</p>${strip()}</div>
    <h3>Decide and do next</h3><div class="grid2">${T.todo.map(todoCard).join('')}</div>
    <p class="small"><a href="#day/${T.days[0].date}">Open day 1</a> · <a href="#days">All ${T.days.length} days</a></p>`;
  }
  if (dayIdx(t) < 0) return `<div class="card"><p class="lead">The trip is over.</p></div><p><a href="#days">All days</a></p>`;
  return vDay(t, true);
}
function vDay(date, isNow) {
  const i = dayIdx(date); if (i < 0) return vDays();
  const d = T.days[i], pv = T.days[i - 1], nx = T.days[i + 1], fl = flightOn(date);
  const mains = d.stops.map(id => ST[id]).filter(Boolean);
  const pager = `<div class="pager">${pv ? `<a href="#day/${pv.date}">&larr; ${pv.label}</a>` : '<span></span>'}${nx ? `<a href="#day/${nx.date}">${nx.label} &rarr;</a>` : '<span></span>'}</div>`;
  return `${isNow ? '' : `<a class="back" href="#days">&larr; All days</a>`}
  <div class="card ${d.cls} ${date === today() ? 'today' : ''}"><p class="kick">Day ${i + 1} of ${T.days.length}${date === today() ? ' · today' : ''}</p><p class="lead" style="font-size:1.55rem">${fmt(date, { weekday: 'long', day: 'numeric', month: 'long' })}</p>
    <div style="margin-top:6px"><i class="dd ${d.cls}"></i><b>${d.sleep}</b></div>
    ${d.bed ? `<div class="bed" style="margin-top:10px;align-items:center"><div class="n small">Tonight: <b>${d.bed}</b></div>${A(d.bedlink, 'Open booking', 'btn alt')}</div>` : ''}</div>
  <div class="card"><p class="kick">The move</p><div>${d.move}</div>${fl ? `<div style="margin-top:8px" class="small"><b>${fl.route}</b>, ${fl.how}. ${fl.when}. ${A(fl.link, 'Flights')}</div>` : ''}</div>
  ${mains.map(s => `${s.menu.some(m => m.v === 'do') ? `<h3>${short(s)}: the Do list</h3><div class="card mis">${s.menu.filter(m => m.v === 'do').map(mini).join('')}</div>` : ''}
    ${s.legs.length ? `<details><summary>Getting there and away: ${short(s)}</summary>${legs(s)}</details>` : ''}
    <p class="small"><a href="#places/${s.id}">${short(s)}: rooms, every option, notes &rarr;</a></p>`).join('')}
  ${pager}`;
}
function vDays() {
  const t = today();
  let html = `<h2>${T.days.length} days</h2>`, cur = null;
  T.days.forEach(d => {
    const key = d.stops[d.stops.length - 1] || d.date;
    if (key !== cur) {
      if (cur !== null) html += '</div>';
      const s = ST[d.stops[d.stops.length - 1]];
      html += `<div class="grp ${d.cls}"><b>${s ? short(s) : d.sleep}</b> <span class="muted small">${s ? s.nights : ''}</span></div><div class="card" style="padding-block:2px">`;
      cur = key;
    }
    html += `<a class="row ${d.date === t ? 'cur' : ''}" href="#day/${d.date}"><span class="d">${fmt(d.date, { day: 'numeric' })} ${fmt(d.date, { month: 'short' })}<small>${fmt(d.date, { weekday: 'short' })}</small></span><span class="b"><b>${d.sleep}</b><div class="mv">${d.move}</div>${d.bed ? `<div class="mv bedl">Bed: ${d.bed}</div>` : ''}</span><span class="go">&rsaquo;</span></a>`;
  });
  return html + '</div>';
}
function vPlaces() {
  return `<h2>Places</h2><div class="grid2">${T.stops.map(s => {
    const pick = s.sleep.find(x => x.primary), nd = s.menu.filter(m => m.v === 'do').length;
    return `<a class="card stopcard ${s.cls}" href="#places/${s.id}"><div class="lead">${s.name}<span>${s.nights}</span></div><div class="small muted">${s.dates}</div>
      <div class="small" style="margin-top:4px">${nd ? nd + ' to do' : 'Transit'}${pick ? ' · ' + pick.name.replace(/^Pick: /, '').split(/[,(]/)[0].trim() : ''}</div></a>`;
  }).join('')}</div>`;
}
function vStop(id) {
  const s = ST[id]; if (!s) return vPlaces();
  const i = T.stops.indexOf(s), pv = T.stops[i - 1], nx = T.stops[i + 1];
  const rows = s.menu.filter(m => show[m.v]);
  const counts = Object.fromEntries(VERD.map(v => [v[0], s.menu.filter(m => m.v === v[0]).length]));
  return `<a class="back" href="#places">&larr; All places</a>
  <h2 style="margin-top:8px"><i class="dd ${s.cls}"></i>${s.name}</h2><p class="muted small" style="margin-top:-4px">${s.dates} · ${s.nights}</p>
  <div class="card"><p class="kick">Time you have</p><div class="small">${s.avail}.</div><p class="kick" style="margin-top:10px">Does the length hold?</p><div class="small">${s.fit}</div>${see({ tags: s.tags })}</div>
  <h3>Days here</h3><div class="card" style="padding-block:2px">${T.days.filter(d => d.stops.includes(s.id)).map(d => `<a class="row" href="#day/${d.date}"><span class="d">${fmt(d.date, { day: 'numeric' })} ${fmt(d.date, { month: 'short' })}<small>${fmt(d.date, { weekday: 'short' })}</small></span><span class="b"><div>${d.move}</div>${d.bed ? `<div class="mv">Bed: ${d.bed}</div>` : ''}</span><span class="go">&rsaquo;</span></a>`).join('')}</div>
  ${s.menu.length ? `<h3>What to do</h3><div class="chips">${VERD.filter(v => counts[v[0]]).map(v => `<button class="chip" aria-pressed="${show[v[0]]}" data-f="${v[0]}">${v[1]} ${counts[v[0]]}</button>`).join('')}</div>
    <div class="grid2">${rows.map(item).join('') || '<p class="note">Nothing in this filter.</p>'}</div>` : ''}
  <h3>Where to sleep</h3>${sleepBlock(s)}
  ${s.legs.length ? `<h3>Getting there and away</h3>${legs(s)}` : ''}
  ${s.extra ? `<div class="card">${s.extra}</div>` : ''}
  <div class="pager">${pv ? `<a href="#places/${pv.id}">&larr; ${short(pv)}</a>` : '<span></span>'}${nx ? `<a href="#places/${nx.id}">${short(nx)} &rarr;</a>` : '<span></span>'}</div>`;
}
function vBook() {
  const m = T.money;
  const fl = T.flights.map(f => `<div class="card"><div style="display:flex;gap:8px;align-items:center"><span class="pill ${f.status}">${f.status === 'buy' ? 'buy now' : 'wait'}</span><span class="muted small">${f.when}</span></div><div class="bed"><div class="n"><div class="lead">${f.route}</div><div class="small muted">${f.how}</div></div><div><span class="price">${eur(f.eur)}</span><div class="acts">${A(f.link, 'Google Flights', 'btn alt')}</div></div></div></div>`).join('');
  const rooms = T.rooms.map(r => `<div class="card"><div class="bed"><div class="n"><div class="small muted">${r.stop} · ${r.dates}</div><div class="lead">${r.prop}</div><div class="small">${r.room}</div><div class="note">${r.cancel}</div></div><div><span class="price">${eur(r.eur)}</span><div class="acts">${A(r.link, 'Open', 'btn alt')}</div></div></div></div>`).join('');
  const od = `<div class="tw"><table><thead><tr><th>Day</th><th>Flight</th><th class="n">EUR</th><th>Effect</th></tr></thead><tbody>${T.otherdays.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="n">${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div><p class="note">${T.flightsnote}</p>`;
  return `<div class="card"><p class="kick">Cost per person</p><p class="big" style="font-size:2rem">EUR ${m.total}</p>
    <details><summary>What it is made of</summary><table><tbody>${m.rows.map(r => `<tr><td><b>${r[0]}</b><div class="note">${r[2]}</div></td><td class="n">${r[1]}</td></tr>`).join('')}</tbody></table><p class="note">${m.note}</p></details></div>
  <h2>Flights</h2><div class="grid2">${fl}</div><details><summary>Other days from Vienna and back</summary>${od}</details>
  <h2>Rooms</h2><p class="muted small" style="margin-top:-2px">Price for two for the stay. Book after the flights.</p><div class="grid2">${rooms}</div>`;
}
function vInfo() {
  return `<h2>Good to know</h2><div class="grid2">${T.info.map(g => `<div class="card"><p class="kick">${g.title}</p><ul class="tight">${g.items.map(x => `<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>
  <h2>Ask before you go</h2><div class="card"><ul class="tight">${T.ask.map(x => `<li>${x}</li>`).join('')}</ul></div>
  <h2>Not found yet</h2><div class="card"><ul class="tight">${T.gaps.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
}

/* ---------- routing: #now #days #day/2027-03-16 #places #places/aonang #book #info ---------- */
function route() {
  const [v, arg] = (location.hash.slice(1) || 'now').split('/');
  const view = v === 'day' ? 'days' : (VIEWS.some(x => x[0] === v) ? v : 'now');
  const html = v === 'day' ? vDay(arg) : v === 'places' && arg ? vStop(arg) : { now: vNow, days: vDays, places: vPlaces, book: vBook, info: vInfo }[view]();
  return { view, html };
}
function paint(keepScroll) {
  const r = route();
  $('#view').innerHTML = (r.view === 'now' ? `<header class="hd"><h1>${T.meta.title}</h1><p>${fmt(T.meta.start, { day: 'numeric', month: 'short' })} to ${fmt(T.meta.end, { day: 'numeric', month: 'short', year: 'numeric' })} · ${T.meta.who}</p></header>` : '') + r.html;
  document.querySelectorAll('[data-v]').forEach(a => a.setAttribute('aria-current', a.dataset.v === r.view ? 'page' : 'false'));
  const cur = (location.hash.match(/^#(?:places|day)\/(.+)/) || [])[1];
  document.querySelectorAll('.out a').forEach(a => a.setAttribute('aria-current', a.dataset.s && (a.dataset.s === cur || (ST[a.dataset.s] && cur >= ST[a.dataset.s].from_ && cur < ST[a.dataset.s].to)) ? 'page' : 'false'));
  if (!keepScroll) { window.scrollTo(0, 0); const c = document.querySelector('.row.cur'); if (c && r.view === 'days' && !location.hash.includes('/')) c.scrollIntoView({ block: 'center' }); }
}
document.addEventListener('click', e => {
  const f = e.target.closest('[data-f]'); if (f) { show[f.dataset.f] = !show[f.dataset.f]; paint(true); }
});
window.addEventListener('hashchange', () => paint(false));
(function init() {
  if (FRAMED) { document.body.classList.add('framed'); document.body.prepend($('#nav')); }
  const link = (v, l) => `<a href="#${v}" data-v="${v}">${svg(v)}<span>${l}</span></a>`;
  $('#nav').innerHTML = VIEWS.map(v => link(v[0], v[1])).join('');
  $('#side').innerHTML = `<h1>${T.meta.title}</h1><p>${fmt(T.meta.start, { day: 'numeric', month: 'short' })} to ${fmt(T.meta.end, { day: 'numeric', month: 'short', year: 'numeric' })}<br>${T.meta.who} · prices read ${T.meta.asof}</p>
    ${VIEWS.map(v => link(v[0], v[1])).join('')}
    <div class="out"><p class="kick" style="padding-left:10px">The route</p>${T.stops.map(s => `<a href="#places/${s.id}" data-s="${s.id}"><i class="dd ${s.cls}"></i>${short(s)}<small>${s.dates.replace(/ Mar| Apr/g, '').replace(/^(\w+ \d+) - (\w+ \d+)$/, '$1-$2')}</small></a>`).join('')}</div>`;
  paint(false);
})();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
