<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Islands and Vietnam Trip</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#f3f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1714" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="../icon-512.png"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@700;800&family=Source+Sans+3:wght@400;600;700&display=swap">
<style>
/* One page, five views (Now, Days, Places, Book, Info), hash routes so the back button works.
   Phone: tab bar at the bottom (top when framed, e.g. inside claude.ai). Desktop: sidebar with the trip outline.
   Colour marks the stop, never the content type. Data lives in the JSON at the bottom; this file only draws it. */
:root{--bg:#f3f6f4;--card:#ffffff;--fg:#14211d;--muted:#566862;--line:#d3ddd8;--soft:#e9efec;--link:#0b5f7a;--on:#fff;
--zt:#0b6e6e;--zh:#b23a3a;--zg:#a05a1c;--zs:#7a4fb8;--zx:#6b7a74;
--ok:#1f6b45;--okbg:#dff0e5;--warn:#8a5a0a;--warnbg:#f7ead0;--bad:#9b2f2f;--badbg:#f6dede;--idea:#4b2f86;--ideabg:#ece6f6;--fine:#3d5a73;--finebg:#e3ecf3;
--display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;--body:"Source Sans 3","Helvetica Neue",Arial,sans-serif;--bar:60px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1714;--card:#15231e;--fg:#e2ece8;--muted:#98ada5;--line:#2a3d35;--soft:#1b2d26;--link:#7fc4de;
--zt:#4fc3c3;--zh:#e07a6e;--zg:#e5a574;--zs:#b89af0;--zx:#8fa39a;--ok:#7bd1a0;--okbg:#17352a;--warn:#e8c07a;--warnbg:#3a2f16;--bad:#f0a0a0;--badbg:#3d2020;--idea:#cbbaf6;--ideabg:#2b2346;--fine:#a9c6dd;--finebg:#1f3040;--on:#0e1714;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1714;--card:#15231e;--fg:#e2ece8;--muted:#98ada5;--line:#2a3d35;--soft:#1b2d26;--link:#7fc4de;
--zt:#4fc3c3;--zh:#e07a6e;--zg:#e5a574;--zs:#b89af0;--zx:#8fa39a;--ok:#7bd1a0;--okbg:#17352a;--warn:#e8c07a;--warnbg:#3a2f16;--bad:#f0a0a0;--badbg:#3d2020;--idea:#cbbaf6;--ideabg:#2b2346;--fine:#a9c6dd;--finebg:#1f3040;--on:#0e1714;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);margin:0}
a{color:var(--link)}
button{font:inherit;color:inherit}
.shell{max-width:1240px;margin:0 auto}
main{padding:8px max(16px,env(safe-area-inset-right,0px)) calc(var(--bar) + 28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:820px;margin:0 auto}
.framed main{padding-bottom:40px}

/* nav: bottom bar on phone */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.framed .nav{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding:0}
.nav a{flex:1;min-width:0;height:var(--bar);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font:600 .74rem var(--body)}
.nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"]{color:var(--fg)}
.nav a[aria-current="page"] svg{stroke-width:2.4}
.framed .nav a{height:48px;flex-direction:row;gap:6px;font-size:.88rem}
.framed .nav a svg{width:18px;height:18px}
.side{display:none}

/* type */
.hd{padding:14px 0 6px}
.hd h1{font:800 1.5rem/1.1 var(--display);margin:0}
.hd p{margin:3px 0 0;color:var(--muted);font-size:.9rem}
h2{font:800 1.25rem/1.2 var(--display);margin:24px 0 8px;text-wrap:balance}
h3{font:700 .76rem var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.muted{color:var(--muted)}.small{font-size:.9rem}
.kick{font:700 .72rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.big{font:800 2.6rem/1 var(--display);margin:2px 0 4px}
.lead{font:700 1.1rem/1.25 var(--display);margin:2px 0 3px}
.note{color:var(--muted);font-size:.9rem;margin:3px 0}

/* blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.dd{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;flex:none;vertical-align:1px}
.zt{--z:var(--zt)}.zh{--z:var(--zh)}.zg{--z:var(--zg)}.zs{--z:var(--zs)}.zx{--z:var(--zx)}
.dd{background:var(--z)}
.strip{display:flex;gap:2px;margin:14px 0 2px}
.strip a{min-width:0;height:10px;border-radius:3px;background:var(--z)}
.striplab{display:flex;gap:2px;font-size:.7rem;color:var(--muted);line-height:1.1}
.striplab span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;min-height:40px;font:700 .92rem var(--body);background:var(--fg);color:var(--bg);text-decoration:none;border-radius:9px;padding:8px 14px}
.btn.alt{background:none;color:var(--link);border:1px solid var(--line)}
.pill{display:inline-block;font:700 .7rem var(--body);letter-spacing:.04em;padding:2px 8px;border-radius:99px;white-space:nowrap;text-transform:lowercase}
.pill.buy,.pill.do{background:var(--okbg);color:var(--ok)}.pill.decide{background:var(--warnbg);color:var(--warn)}.pill.ask,.pill.book,.pill.idea{background:var(--ideabg);color:var(--idea)}
.pill.wait,.pill.fine{background:var(--finebg);color:var(--fine)}.pill.skip{background:var(--badbg);color:var(--bad)}
.row{display:flex;gap:12px;align-items:center;min-height:56px;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.row:first-child{border-top:0}
.row .d{width:3.6em;flex:none;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.row .d small{display:block;font-weight:600;color:var(--muted);font-size:.78rem}
.row .b{min-width:0;flex:1}
.row .go{color:var(--muted);flex:none}
.row.cur{background:var(--soft);margin:0 -16px;padding-inline:16px;border-radius:8px}
.row .mv{color:var(--muted);font-size:.9rem;line-height:1.3}
.bedl{display:none}
.grp{border-left:4px solid var(--z);padding:2px 0 2px 14px;margin:18px 0 6px}
.grp b{font:800 1.05rem var(--display)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chip{flex:none;min-height:36px;font:600 .86rem var(--body);border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:6px 13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.it{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0}
.it.do{border-left-color:var(--ok)}.it.fine{border-left-color:var(--fine)}.it.idea{border-left-color:var(--idea)}.it.skip{border-left-color:var(--bad)}
.it .t{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.it .t b{font:700 1rem/1.25 var(--display)}
.meta{font-size:.9rem;margin:3px 0}
.meta b{font-weight:700}
.see{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.see a{font-size:.84rem;font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:5px 11px;color:var(--link)}
.mis{padding-block:4px}.mi{padding:10px 0;border-top:1px solid var(--line)}.mi:first-child{border-top:0}.mi .see{margin-top:5px}.mis .see a{padding:3px 10px}
.leg{padding:9px 0;border-top:1px solid var(--line)}.leg:first-child{border-top:0}
.leg b{display:block}
.bed{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.bed .n{min-width:0;flex:1 1 220px}
.price{font:800 1.25rem var(--display);font-variant-numeric:tabular-nums}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
details>summary{cursor:pointer;font-weight:700;padding:10px 0;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+";display:inline-block;width:1.2em;color:var(--muted)}
details[open]>summary::before{content:"\2212"}
table{border-collapse:collapse;width:100%;font-size:.92rem}
td,th{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-top:0}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
ul.tight{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.stopcard{display:block;text-decoration:none;color:inherit;border-left:5px solid var(--z)}
.stopcard .lead{display:flex;justify-content:space-between;gap:8px}
.stopcard .lead span{font:600 .85rem var(--body);color:var(--muted);white-space:nowrap}
.pager{display:flex;justify-content:space-between;gap:8px;margin:6px 0 4px}
.pager a{flex:1;text-decoration:none;font-weight:600;font-size:.9rem;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--card)}
.pager a:last-child{text-align:right}
.pager span{flex:1}
.back{display:inline-block;margin:10px 0 0;font-weight:600;text-decoration:none;font-size:.92rem}
.warn{background:var(--warnbg);color:var(--warn);border-radius:9px;padding:9px 12px;font-size:.92rem;margin:10px 0}
.today{border:2px solid var(--fg)}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}

/* desktop: sidebar with the trip outline, wider content */
@media (min-width:1000px){
  .shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;padding:0 24px}
  .nav{display:none}
  .side{display:block;position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 0 30px;border-right:1px solid var(--line);padding-right:18px}
  .side h1{font:800 1.3rem/1.1 var(--display);margin:0 0 3px}
  .side p{margin:0 0 14px;color:var(--muted);font-size:.86rem}
  .side a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--fg);padding:7px 10px;border-radius:8px;font-weight:600}
  .side a[aria-current="page"]{background:var(--soft)}
  .side a:hover{background:var(--soft)}
  .side a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .side .out{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  .side .out a{font-weight:400;font-size:.92rem;padding:5px 10px}
  .side .out a small{margin-left:auto;color:var(--muted);font-size:.8rem;white-space:nowrap}
  main{padding:18px 0 60px;max-width:900px;margin:0}
  .hd{display:none}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .grid2>.it,.grid2>.card{margin:6px 0}
  .row.cur{margin:0 -10px;padding-inline:10px}
  .bedl{display:block}
}
@media print{.nav,.side,.chips,.pager{display:none!important}main{padding:0;max-width:none}.card,.it{break-inside:avoid}details>summary::before{content:""}}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.side a{transition:background .12s}}
</style>
</head>

?api=1&query=Tiger+Cave+Temple+Krabi", "tags": ["tigercavetemple"]}, {"name": "Railay viewpoint and Princess Lagoon", "dur": "~3 h with the boat: 30 min up, 20-25 more to the lagoon with ropes and mud", "cost": "boat THB 100 each way", "note": "Do the lagoon near high water: about 16:00 on Tue 16. Muddy rope scramble, wear shoes. Phra Nang Cave Beach is on the same walk. Back on the last shared boat before 18:00", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Railay+Viewpoint+Krabi", "tags": []}, {"name": "Rock climbing, half day", "dur": "~4 h", "cost": "THB 900-1,500 each (EUR 24-40) at the school counter, not USD 48-55 on a booking site", "note": "Hot Rock 5.0 (479), Railay Rock Climbing Shop 4.9 (212), Real Rocks 4.8 (237). Ask the age of the bolts. Walk up to a school the evening before", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Hot+Rock+Climbing+School+Railay", "tags": []}, {"name": "Kayak to Poda and Phra Nang", "dur": "~3.5 h, about 1 h each way to Poda", "cost": "THB 600 each, half day", "note": "The other choice on Tue 16 morning instead of the work block. Be back for the 18:00 boat", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Phra+Nang+Cave+Beach+Railay", "tags": []}, {"name": "Ao Nang beach at sunset", "dur": "~1 h", "cost": "free", "note": "Walk from Ao Nang to Nopparat Thara; sunset 18:36 on 15 Mar", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Ao+Nang+Beach+Krabi", "tags": ["aonangbeach"]}, {"name": "Ao Nang Wednesday night market, Wed 17", "dur": "~2 h", "cost": "cheap meals", "note": "Wednesday 16:00-20:00. Krabi Town Walking Street is Fri-Sun, so it is not open while you are here", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Ao+Nang+Wednesday+Night+Market+Krabi", "tags": []}, {"name": "Krabi Town Walking Street", "dur": "-", "cost": "-", "note": "Runs Fri-Sun only: not in Mon 15 - Thu 18", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Krabi+Town+Walking+Street+Krabi", "tags": []}, {"name": "Emerald Pool and hot spring", "dur": "~5 h with ~1 h ride each way", "cost": "THB 400-650", "note": "Scooter or tour; open 08:30-16:30, go at opening, vans arrive later", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Emerald+Pool+Krabi", "tags": []}, {"name": "Hong Islands by longtail", "dur": "~7 h", "cost": "Group tour about EUR 34-37 each (68-74 for two). Private longtail THB 2,500-2,800 a boat + THB 300 park each (about EUR 84-92 for two)", "note": "For two the group tour is cheaper; the private boat wins from 3-4 people and gives your own pace. Your call. Fits Wed 17 instead of the climbing: back about 15:30, work 16:00-18:00, market after", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Hong+Islands+Krabi", "tags": ["hongisland"]}, {"name": "Ao Nang Landmark Night Market", "dur": "~1.5 h", "cost": "-", "note": "A tourist market, not a meal stop. The Wednesday night market on Wed 17 is the one to use", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Ao+Nang+Landmark+Night+Market", "tags": []}, {"name": "Tonsai at night", "dur": "2-3 h", "cost": "after 18:00 the shared boat waits for 8 people (~THB 150 each) or a private boat is THB 800-1,500", "note": "Not from this base unless you accept that cost", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Tonsai+Beach+Railay", "tags": ["tonsai"]}, {"name": "Jet ski", "dur": "-", "cost": "-", "note": "Damage-claim scam with the passport held", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Jet+ski+rental+Ao+Nang", "tags": []}, {"name": "Diving", "dur": "-", "cost": "THB 3,000-4,000 for two dives", "note": "Lanta is cheaper for Hin Daeng, which needs Advanced Open Water", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Dive+centre+Ao+Nang", "tags": []}, {"name": "Bioluminescence", "dur": "-", "cost": "-", "note": "Moon is waxing on 15-18 Mar, full on Mon 22: the glow is weak", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Bioluminescence+kayak+Krabi", "tags": []}], "tags": ["krabi", "tonsai", "hongisland"], "extra": ""}, {"id": "mook", "cls": "zt", "name": "Koh Mook", "short": "Koh Mook", "dates": "Thu 18 - Sat 20 Mar", "nights": "2 nights", "from_": "2027-03-18", "to": "2027-03-20", "avail": "1 full day (Fri), Thursday from about 13:00, Saturday morning until the 11:00 boat (the 14:00 gives the whole morning)", "fit": "Fri 19: Kradan and Ngai (or the dugong boat) in the morning, Emerald Cave 14:30-16:30, sunset at Charlie Beach. The bike, village and bar fill Thursday afternoon and Saturday morning. A third night repeats it (a 2025 traveller called it \"way too calm\"; 2-3 days is enough).", "legs": [{"leg": "Arrive from Ao Nang", "how": "shared van + longtail from Ao Nang, about 2.5-3 h, USD 19-23 each (about THB 1,300-1,550 for two). Fallback: Bundhaya 10:10 from Nopparat Thara, lands 13:20, EUR 41-51 each. The cave is not possible on Thursday either way", "note": "<span class=\"nt\">Book through the guesthouse on Wed</span>"}, {"leg": "Leave for Lanta (Sat 20)", "how": "Bundhaya (2.9 on Maps) / Satun Pakbara (3.4 on Maps) speedboat 11:00 or 14:00, THB 540-600 each (about EUR 15). Tigerline also runs it but has delay complaints. March 2027 times and fares unconfirmed; pier transfers on both islands unpriced. Book the evening before at a village agent and keep a 2-3 h buffer. Both rate low: ask the village agent which boat is running. Times and fares: <a href=\"https://12go.asia/en/travel/koh-mook/koh-lanta?date=2027-03-20\" target=\"_blank\" rel=\"noopener\">12go, Sat 20 Mar</a>", "note": "<span class=\"nt\">Ask Kookkai about the March boat times in December</span>"}], "sleep": [{"name": "Pick: Kookkai Bungalows (Booking now lists it as Mook Bamboo Bungalows)", "price": "64 per room for 2 nights with breakfast, 32 a night", "note": "free cancellation to 15 Mar", "link": "https://www.booking.com/hotel/th/kookkai-bungalows.en-gb.html?checkin=2027-03-18&checkout=2027-03-20&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Mook+Bamboo+Bungalows+Koh+Mook", "primary": true}, {"name": "Alternative: Koh Mook Bungalows", "price": "58 per room", "note": "Rated 8.8 from 492", "link": "https://www.booking.com/hotel/th/koh-mook-bungalows.en-gb.html?checkin=2027-03-18&checkout=2027-03-20&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Koh+Mook+Bungalows+Koh+Mook", "primary": false}], "sleepnote": "Airbnb has nothing real on Mook. One ATM on the island and it can run dry: bring THB 6,000-8,000 cash for two, withdrawn once in Ao Nang on Mon 15.", "menu": [{"name": "Emerald Cave", "dur": "~2 h, Fri 14:30-16:30", "cost": "private longtail THB 1,000-1,700 a boat + park fee THB 200 each (carry 400)", "note": "Not at sunrise: high water is about 09:00 on Fri 19 and floods the arch; low water is about 14:45 (tide table for Railay), so the 14:30 boat is at low water. Go in the afternoon, after the Lanta tours have left, with a torch and a life jacket. Kookkai confirms the boat time; ask the boatman the evening before.", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Tham+Morakot+Emerald+Cave+Ko+Mook+Trang", "tags": ["emeraldcave"]}, {"name": "Kradan and Ngai by longtail", "dur": "~4.5 h, Fri 09:00-13:30", "cost": "about THB 800 a boat (EUR 21) split between two; Ngai alone by scheduled boat THB 200-350", "note": "Snorkel off the beach: some of the best in Thailand. Alternative to the dugong boat. Tight before the 14:30 cave: ask for one boat doing both", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Koh+Kradan", "tags": []}, {"name": "Libong dugong boat", "dur": "2-3 h, Fri 08:00-10:30", "cost": "THB 1,000-2,000 from the Libong side; from Mook unconfirmed", "note": "At high tide, about a 1 in 3 chance. Alternative to Kradan and Ngai. Your call", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Koh+Libong", "tags": []}, {"name": "Sabai Beach jungle track", "dur": "~2 h: 40 min to the viewpoint, 20 to the beach, back", "cost": "free", "note": "Sat morning before the boat. Mud, mosquitoes, snakes: take a stick", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Sabai+Beach+Koh+Mook", "tags": ["kohmook"]}, {"name": "Bicycle round the island", "dur": "~2 h", "cost": "THB 100 a day (scooter THB 250)", "note": "Thursday afternoon. Quiet roads, cash only", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Koh+Mook", "tags": ["kohmook"]}, {"name": "Charlie Beach (Garnet Beach on Maps) sunset", "dur": "~1 h", "cost": "free", "note": "Sunset 18:33, then Mong Bar (it closes 20:00). Moto-taxi THB 50 from the village", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Charlie+Beach+Koh+Mook", "tags": []}, {"name": "The village", "dur": "~1 h", "cost": "free", "note": "Muslim village, cover up. Cash only", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Ban+Koh+Mook", "tags": ["kohmook"]}, {"name": "Mong Bar", "dur": "1 h evening, before 19:30", "cost": "beer from THB 50", "note": "Rated 4.8 (305). Maps shows it open 08:00-20:00 with no closure flag. Drink before or at sunset and leave by 19:30. Perfect Bar and Restaurant 4.6 (317), a restaurant with a bar, open 12:00-22:00, is the fallback. Halal places serve no alcohol.", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Mong+Bar+Koh+Mook", "tags": []}, {"name": "Cuttlefish snorkel", "dur": "-", "cost": "-", "note": "Visibility reported \"terrible\" at Mook; one reel only", "v": "idea", "map": "https://www.google.com/maps/search/?api=1&query=Cuttlefish+snorkel+Koh+Mook", "tags": []}], "tags": ["kohmook", "emeraldcave"], "extra": ""}, {"id": "lanta", "cls": "zt", "name": "Koh Lanta", "short": "Koh Lanta", "dates": "Sat 20 - Wed 24 Mar", "nights": "4 nights", "from_": "2027-03-20", "to": "2027-03-24", "avail": "3 full days, Saturday afternoon (~3 h); leave Wednesday 06:30", "fit": "The Do list is about 18 h against about 33 h available, so about 14 h stays free for the scooter, the beach and work. Four nights is the most the list supports.", "legs": [{"leg": "Arrive from Mook", "how": "Bundhaya (2.9 on Maps) / Satun Pakbara (3.4 on Maps) speedboat from Mook at 11:00 or 14:00, THB 540-600; lands Lanta early afternoon, then a songthaew or taxi to the room", "note": "<span class=\"nt\">Crossing time unconfirmed</span>"}, {"leg": "Leave Lanta (Wed 24)", "how": "Book a 06:30 PRIVATE car: about EUR 60 a car (EUR 30 each), 12go, booked ahead. The shared van is too late on a bad ferry day: its first run is 08:00, arriving 10:30, for a 13:35 flight. The airport is about 3 h away with the car ferry, so 09:30 there, 4 h before the flight; the ferry queue can add up to 2 h", "note": "<span class=\"nt\">Ferry queue not published</span>"}], "sleep": [{"name": "Pick: Cat Bungalow", "price": "80 per room for 4 nights, 20 a night, fan and breakfast", "note": "Rated 9.1 from 688, free cancellation to 19 Mar", "link": "https://www.booking.com/hotel/th/cat-bungalow.en-gb.html?checkin=2027-03-20&checkout=2027-03-24&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Cat+Bungalow+Koh+Lanta", "primary": true}, {"name": "Alternative: Thai House Beach Resort", "price": "85 per room", "note": "Rated 9.0 from 372", "link": "https://www.booking.com/hotel/th/thai-house-beach-resort-ko-lanta.en-gb.html?checkin=2027-03-20&checkout=2027-03-24&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Thai+House+Beach+Resort+Koh+Lanta", "primary": false}], "sleepnote": "Airbnb on Lanta is EUR 117-181 for 4 nights, so no cheaper. Lanta is spread out: the scooter is how you move (THB 250 a day).", "menu": [{"name": "Snorkel Koh Rok and Koh Haa", "dur": "~8 h, a full day", "cost": "THB 2,000-3,000 each + 400 park each (EUR 64-90)", "note": "Sun 21 (Mon 22 if the swell is up: then the cave and park move to Tue 23 09:00-13:00, Muay Thai drops and KoHub starts at 14:00). Walk in to 2-3 agencies in Saladan and ask if the park fee is included; never the hotel desk. Jellyfish possible until April. Tin Adventure 4.7 (270)", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Koh+Rok+Nok", "tags": ["kohrok"]}, {"name": "Old Town, then National Park and lighthouse", "dur": "~5 h: Old Town 1.5 h, park and lighthouse 3 h", "cost": "park THB 200 + 20 for a vehicle", "note": "Old Town in the morning or on Sat evening. Gate hours are 16:30 or 17:30, not confirmed (HQ +66 75 656 576): the park is a dead-end road, so be in by 13:00, lighthouse by 15:30, out by 16:30. Watch the sunset (about 18:35) from Long Beach, which faces west, not from the lighthouse. Old Town 4.4 (6,303)", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Mu+Ko+Lanta+National+Park", "tags": []}, {"name": "Khao Mai Kaew cave", "dur": "~2.5 h", "cost": "entry THB 200-300 (two prices seen) + local guide THB 30-50", "note": "Guide is required. Bring a headlamp. Also the rain backup", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Khao+Mai+Kaew+Cave+Koh+Lanta", "tags": []}, {"name": "Muay Thai gym lesson", "dur": "~1.5 h", "cost": "THB 500 each (EUR 13)", "note": "Nicha 4.9 (163), open 08:30-19:00; Lanta Muay Thai Complex 4.9 (127), open 07:00-20:00. Class times not found: ask on Mon", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Nicha+Muay+Thai+Koh+Lanta", "tags": []}, {"name": "Cooking class", "dur": "~4 h", "cost": "Time for Lime about THB 2,000 each (EUR 53)", "note": "Time for Lime is 4.9 on Maps. <a href=\"https://www.google.com/maps/search/?api=1&query=Cooking+with+Mon+Koh+Lanta\" target=\"_blank\" rel=\"noopener\">Cooking with Mon</a> is a separate school (5.0), price not found. Only if a Lanta evening is free; none is planned", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Time+for+Lime+Koh+Lanta", "tags": []}, {"name": "Beach volleyball on Long Beach ~16:00", "dur": "~1.5 h", "cost": "free", "note": "Locals play. A hand tennis group could not be confirmed", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Long+Beach+Koh+Lanta", "tags": []}, {"name": "Local markets: Old Town Sat, Klong Dao Mon, Klong Nin Tue", "dur": "~1.5 h each", "cost": "cheap meals", "note": "Sat 20 Old Town walking street (the street market opens 11:00), Mon 22 Klong Dao (from about noon, Maps says 15:00, to about 18:30: go after the park), Tue 23 Klong Nin (a morning market until about 12:00: eat at the roadside shops instead). The Saladan market day is not confirmed", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Klong+Nin+Beach+Koh+Lanta", "tags": []}, {"name": "Work at KoHub", "dur": "a work block", "cost": "day pass THB 400", "note": "Open Tue 09:00-17:30, fast wifi. Tue 23 afternoon (from 14:00 on a swell day). Backups: Peak Cafe 4.7 or Mem's Coffee Corner 4.9, both open from 08:00", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=KoHub+Koh+Lanta", "tags": []}, {"name": "Mangrove self-kayak, Thung Yee Peng", "dur": "2-3 h", "cost": "THB 400 per 2-person kayak", "note": "Flat mangrove water, not gorge water", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Thung+Yee+Peng+Koh+Lanta", "tags": []}, {"name": "Dive Hin Daeng and Hin Muang", "dur": "~8 h, a full day", "cost": "THB 4,330-4,700 + 600 park (EUR 130-140 with the park, 112-125 without)", "note": "Needs Advanced Open Water: skip unless certified. Rok and Haa is the snorkel day", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Hin+Daeng+Hin+Muang+dive+site", "tags": []}, {"name": "Night squid or fishing boat", "dur": "-", "cost": "hotels sell a boat from THB 4,750 for two", "note": "Ask boatmen at Saladan pier or in Old Town before paying a resort. A resort boat is THB 4,750 for two (6 h, a meal); a private longtail is about USD 200 each. Your call: yes or no", "v": "idea", "map": "https://www.google.com/maps/search/?api=1&query=Saladan+Pier+Koh+Lanta", "tags": []}, {"name": "Zipline", "dur": "-", "cost": "from THB 1,300", "note": "Tourist-priced", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Lanta+Zipline+Koh+Lanta", "tags": []}, {"name": "Muay Thai fight night", "dur": "-", "cost": "-", "note": "Both tourist stadiums rated 3.1 and 3.5: train instead", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Muay+Thai+stadium+Koh+Lanta", "tags": []}, {"name": "Elephant rides, jeep tours", "dur": "-", "cost": "-", "note": "Poor treatment; a jeep is THB 1,200 for what a scooter does", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Elephant+rides+Koh+Lanta", "tags": []}], "tags": ["kohrok"], "extra": ""}, {"id": "hanoi1", "cls": "zh", "name": "Hanoi, first night", "short": "Hanoi", "dates": "Wed 24 Mar", "nights": "1 night", "from_": "2027-03-24", "to": "2027-03-25", "avail": "arrive 20:15, in the room about 22:00; Thursday 06:30-09:00 before the 09:30 bus", "fit": "One evening hour. This night exists only because the flight lands after dark and the Ha Giang bus leaves in the morning.", "legs": [{"leg": "Noi Bai to the Old Quarter", "how": "Bus 86 VND 45k (EUR 1.5), 50-70 min, only if you are out of the airport by about 21:00 (last run between 21:00 and 22:15, not confirmed). Otherwise Grab VND 230-350k (EUR 8-12), booked in the app. Never go with a driver who approaches you: 550k was asked for a 300k ride", "note": "<span class=\"nt\">Last Bus 86 run unconfirmed</span>"}, {"leg": "Thu 25 to Ha Giang", "how": "Bang Phan day bus 09:30 from 156 Tran Quang Khai, arrives 15:30, EUR 12. The overnight sleeper (about 22:00-23:30, unconfirmed) arrives before the bike shop and room are ready. Operators: <a href=\"https://vexere.com/vi-VN/ve-xe-khach-tu-ha-noi-di-ha-giang-ha-giang-124t22171.html\" target=\"_blank\" rel=\"noopener\">Vexere route page</a> (25 Mar dates not on sale yet)", "note": "<span class=\"nt\">March 2027 time unconfirmed</span>"}], "sleep": [{"name": "Pick: La Ava's Home, Old Quarter (ensuite, AC, 25 m2)", "price": "26 per room a night; 52 for the two Hanoi nights", "note": "Rated 9.1 from 537", "link": "https://www.booking.com/hotel/vn/la-avas-home.en-gb.html?checkin=2027-03-24&checkout=2027-03-25&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=La+Ava%27s+Home+Hanoi", "primary": true}, {"name": "Alternative: Bamboo Homestay Old Quarter", "price": "27.50 per room a night (55 read for 2 nights)", "note": "Rated 9.3 from 320", "link": "https://www.booking.com/hotel/vn/bamboo-homestay-old-quarter.en-gb.html?checkin=2027-03-24&checkout=2027-03-25&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Bamboo+Homestay+Old+Quarter+Hanoi", "primary": false}, {"name": "Airbnb: private room with own bathroom, Old Quarter", "price": "21 per room (24 Mar), 22 (2 Apr)", "note": "4.94 from 84 reviews; cancellation terms not read", "link": "https://www.airbnb.com/rooms/1471793418276030267?check_in=2027-03-24&check_out=2027-03-25&adults=2"}], "sleepnote": "Same room for both Hanoi nights (24 Mar, 2 Apr). Skip The One Hostel (DJs until midnight). Airbnb is EUR 4-5 a night cheaper; the Booking pick stays because its free cancellation has a date and the party size is open.", "menu": [{"name": "Late bowl: Pho Ga Nguyet", "dur": "~45 min", "cost": "VND 50-70k", "note": "Open 06:30 to midnight, so fine at 22:00", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Pho+Ga+Nguyet+Hanoi", "tags": []}, {"name": "Thursday breakfast: Pho Gia Truyen Bat Dan", "dur": "~45 min", "cost": "-", "note": "Opens 06:00; go at 06:30. Cash only", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Pho+Gia+Truyen+Bat+Dan+Hanoi", "tags": []}], "tags": ["hanoifood"], "extra": ""}, {"id": "hagiang", "cls": "zg", "name": "Ha Giang loop", "short": "Ha Giang", "dates": "Thu 25 - Mon 29 Mar", "nights": "4 nights", "from_": "2027-03-25", "to": "2027-03-29", "avail": "Thu bus day (arrive 15:30), three riding days, Monday ride + night bus", "fit": "Four nights holds the whole loop: Du Gia family night, Dong Van for the Sunday market, Meo Vac as the last night. The route runs Du Gia first (against the tour flow); Monday returns via Dong Van, Yen Minh and Quan Ba. Fri is 3.5-4 h of riding, so leave at 06:45; Monday you are back about 14:30-15:00 and use the Faithien room for a shower, bags and a rest before the bus, unless the bike shop gives a free shower and bag storage.", "legs": [{"leg": "Thu 25 Hanoi to Ha Giang", "how": "Bang Phan day bus 09:30 from Hanoi (156 Tran Quang Khai), arrives 15:30, EUR 12. Pick the bike up Thursday evening after the bus (WhatsApp two shops beforehand: test ride, film it, cash deposit, free bag storage; ask about a free shower on Mon 29). Border permit about USD 10 through the shop: keep the receipt", "note": "<span class=\"nt\">March 2027 time unconfirmed</span>"}, {"leg": "Mon 29 Meo Vac back to Ha Giang town", "how": "ride 5.5-6.5 h via Dong Van, Yen Minh and Quan Ba (better tarmac than the Mau Due gravel, 20 min stops at the Twin Mountains and Tham Ma): leave Meo Vac at 08:00 and be back about 14:30-15:00, bike back 15:30", "note": "<span class=\"nt\">Real time not known</span>"}, {"leg": "Mon 29 evening, Ha Giang to Ninh Binh", "how": "night bus G8 23:00 or Sao Viet 22:00, arrive Tam Coc about 07:00-08:30, not confirmed (see the night bus card)", "note": "<span class=\"nt\">Return the bike before boarding</span>"}], "sleep": [{"name": "Thu: Ha Giang Faithien Homestay, double room with mountain view", "price": "10 per room", "note": "Rated 9.7 from 165", "link": "https://www.booking.com/hotel/vn/ha-giang-faithien-homestay.en-gb.html?checkin=2027-03-25&checkout=2027-03-26&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Ha+Giang+Faithien+Homestay+Ha+Giang", "primary": true}, {"name": "Thu alternative: HagiangGo, King Room with garden view, rents bikes", "price": "10 per room", "note": "Rated 9.3 from 543", "link": "https://www.booking.com/hotel/vn/hagianggo-hostel-motorbikes-rental-and-tour.en-gb.html?checkin=2027-03-25&checkout=2027-03-26&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=HagiangGo+Hostel+Ha+Giang", "primary": false}, {"name": "Fri: Happy Homestay Du Gia, double room with breakfast (dinner is a EUR 7 extra on the 23 rate)", "price": "14 per room", "note": "Free cancellation", "link": "https://www.booking.com/hotel/vn/happy-homestay-du-gia-yen-minh.en-gb.html?checkin=2027-03-26&checkout=2027-03-27&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Happy+Homestay+Du+Gia", "primary": true}, {"name": "Sat: ToTo-Chan Hotel, standard double with breakfast, Dong Van", "price": "18 per room", "note": "Standard double with breakfast", "link": "https://www.booking.com/hotel/vn/toto-chan.en-gb.html?checkin=2027-03-27&checkout=2027-03-28&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=ToTo-Chan+Hotel+Dong+Van", "primary": true}, {"name": "Sun: Xua Vu Homestay, double room with garden view, Meo Vac", "price": "17 per room", "note": "Breakfast EUR 1 extra", "link": "https://www.booking.com/hotel/vn/xua-vu-homestay.en-gb.html?checkin=2027-03-28&checkout=2027-03-29&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Xua+Vu+Homestay+Meo+Vac", "primary": true}, {"name": "Sat alternative (Airbnb): room in Dong Van", "price": "16 per room", "note": "5.0 from only 15 reviews; cancellation terms not read", "link": "https://www.airbnb.com/rooms/893991177587711327?check_in=2027-03-27&check_out=2027-03-28&adults=2"}, {"name": "Sun alternative (Airbnb): room in Meo Vac", "price": "15 per room", "note": "5.0 from only 17 reviews; cancellation terms not read", "link": "https://www.airbnb.com/rooms/1448687455585712722?check_in=2027-03-28&check_out=2027-03-29&adults=2"}], "sleepnote": "About EUR 59 for the four nights. No dorms: a volunteer found bed bugs in a Ha Giang dorm in March 2026. Check each room row at booking. Alternatives for night 1 (Ha Giang town): Ha Giang Hostel (9.9 from 287) or Ali Hostel (10 from 89), private rooms only. Cash: ATMs only in Ha Giang town, Dong Van and Meo Vac, none in Du Gia: withdraw in town on Thu. Airbnb: Ha Giang town and Du Gia have nothing cheaper with real reviews; Dong Van and Meo Vac have rooms EUR 2 cheaper with few reviews.", "menu": [{"name": "Self-ride the loop", "dur": "~15-18 h riding in all: Fri 3.5-4 h, Sat 4-4.5 h plus stops, Sun 2-3 h, Mon 5.5-6.5 h", "cost": "125 cc about EUR 10-12 a day (VND 290-345k) against EUR 198 for a 3-4 day tour with a driver; an easy rider costs about USD 40 a day", "note": "Cash deposit and a written receipt, never the passport (homestays and the police need it). A notarised copy is the other way. Since April 2026 the road is more closely watched after a tourist death, so line up two shops. Film the bike before and after", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Ha+Giang+Loop", "tags": ["hagiangloop"]}, {"name": "Dong Van Sunday market, Sun 28 Mar", "dur": "~2.5 h", "cost": "free", "note": "Be there at 06:30 (hours are given as 06:30-09:00 or 05:00-10:00), on the road 09:00, Ma Pi Leng to Meo Vac about 11:00-11:30. The Meo Vac market is also Sunday (04:00-16:00, busiest early morning) and larger: you arrive for the tail end", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Dong+Van+Market+Ha+Giang", "tags": ["dongvan"]}, {"name": "Ma Pi Leng pass", "dur": "~2 h riding and viewpoints, three times: Sat afternoon (Meo Vac to Dong Van), Sun morning (back, on the road by 09:00, vans come after) and Mon morning (Meo Vac to Dong Van)", "cost": "free", "note": "Rated 4.8 (816). Ridden three times; Sunday is the other way and in other light. The USD 68 skywalk trek is not needed", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Ma+Pi+Leng+Pass", "tags": []}, {"name": "Nho Que boat", "dur": "30 min-2 h, not confirmed", "cost": "VND 120-150k (EUR 4-5), shuttle VND 50-100k", "note": "Rated 4.8 (990). Take the kayak or half cruise; the party-music tour boats are the trap", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Nho+Que+River+Ha+Giang", "tags": []}, {"name": "Quan Ba, Heaven's Gate and Yen Minh (Monday ride back)", "dur": "ridden through, 20 min stops", "cost": "free", "note": "The gate itself is gone, only a sign; the road is the value. Monday on the way back, not Friday. The Quan Ba market is not on the menu: its day is not confirmed", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Quan+Ba+Heaven+Gate+Ha+Giang", "tags": []}, {"name": "Du Gia waterfall and family dinner", "dur": "~1.5 h + the Friday market and dinner", "cost": "fee not found", "note": "Friday market usually Fridays, ends about noon (not confirmed): leave Ha Giang 06:45. Cold water; one report says private, another too crowded", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Du+Gia+Waterfall+Ha+Giang", "tags": []}, {"name": "Lung Cu flag tower and village", "dur": "~2.5 h, a dead-end out and back, distance not sourced", "cost": "VND 30k (EUR 1)", "note": "Only if you reach Dong Van by 14:00 and the sky is clear (about 2.5 h there and back, in before the 18:12 sunset); the passes fog at dusk. Cold and foggy in March. Rated 4.6 (9,331)", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Lung+Cu+Flag+Tower", "tags": []}, {"name": "Dong Van old quarter", "dur": "~2 h", "cost": "free", "note": "Sat evening", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Dong+Van+Old+Quarter", "tags": ["dongvan"]}, {"name": "Lung Khuy cave", "dur": "-", "cost": "fee not found", "note": "4.6 from only 48 reviews", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Lung+Khuy+Cave+Ha+Giang", "tags": []}, {"name": "Dong Van night market", "dur": "-", "cost": "-", "note": "Runs on lunar days 14-16, which are 21-23 Mar: none in your stay", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Dong+Van+Night+Market+Ha+Giang", "tags": []}], "tags": ["hagiangloop", "dongvan"], "extra": "<div class=\"note\"><b>The police.</b> About 13 of 16 first-person self-riders on this loop were stopped; 2M VND (EUR 65) is the normal fine, the range is 0.5-4.5M, and 150 cc was fined more than 110 cc. Budget VND 2-3M each. A pre-paid fine through the shop or a signed note covered later checkpoints in several accounts. A valid 1968 IDP is not a shield.</div>"}, {"id": "hanoi2", "cls": "zh", "name": "Monday night bus, Ha Giang to Ninh Binh", "short": "Night bus", "dates": "Mon 29 Mar", "nights": "night bus", "from_": "2027-03-29", "to": "2027-03-30", "avail": "bike back 15:30, bus leaves 22:00 or 23:00", "fit": "No Hanoi night: you sleep on the bus and wake up in Ninh Binh on Tuesday morning. A EUR 10 Faithien room in Ha Giang by day for a shower, bags and rest before the bus (skip it if the bike shop offers a free shower and bag storage).", "legs": [{"leg": "Mon 29 night bus to Ninh Binh", "how": "Sao Viet 22:00, arrives about 07:00, EUR 18 (rated 4.4); G8 23:00, arrives about 07:20, EUR 22 (rated 4.5), free cancellation. Times as listed on 12go for 29 Mar 2027; the G8 may arrive as late as 08:30, so plan for 07:00-08:30 (not confirmed). Be at the pickup 30+ min early: one bus reportedly left early. Bang Phan 19:30 arrives 03:30 (EUR 16): too early, skip. <a href=\"https://12go.asia/en/travel/ha-giang/ninh-binh?date=2027-03-29\" target=\"_blank\" rel=\"noopener\">12go route page</a>", "note": "<span class=\"nt\">March 2027 times not published yet</span>"}, {"leg": "Fallback if the ride runs late", "how": "if the bus fails: Faithien that night (about EUR 10), first morning bus, Ninh Binh loses Tuesday (still 3 paid nights)", "note": ""}], "sleep": [{"name": "Mon: Faithien Homestay, Ha Giang, a room booked for Mon night and used for the afternoon (shower, bags, rest); also the fallback bed", "price": "10 per room", "note": "Same room type as Thu. If the bike shop offers a free shower and bag storage, skip it", "link": "https://www.booking.com/hotel/vn/ha-giang-faithien-homestay.en-gb.html?checkin=2027-03-29&checkout=2027-03-30&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Ha+Giang+Faithien+Homestay+Ha+Giang", "primary": true}], "sleepnote": "Ask Mr Thong whether the bags can be dropped about 07:30 and an early check-in is possible after the bus.", "menu": [], "tags": [], "extra": ""}, {"id": "ninhbinh", "cls": "zs", "name": "Ninh Binh (Tam Coc)", "short": "Ninh Binh", "dates": "Tue 30 Mar - Fri 2 Apr", "nights": "3 nights", "from_": "2027-03-30", "to": "2027-04-02", "avail": "Tuesday from about 07:00-08:30 (room from the afternoon, about 4 h), Wed and Thu full days; Friday you leave at 06:15 or 07:20 for the train, so no Friday morning", "fit": "The Do list is about 20 h against about 24 h available (Tue ~4 h, two days ~10 h each). The plan uses three nights (open: see the card): the third day is Cuc Phuong or Phat Diem and the pagodas, not filler. If Monday forces the fallback you lose Tuesday: drop the Bich Dong loop and Van Long first.", "legs": [{"leg": "Fri 2 back to Hanoi", "how": "train SE12 07:12 arrives 10:10, or SE20 08:18 arrives 11:10 (soft seat EUR 6-11); the later SE18 arrives 14:10, too late. Ninh Binh station is in town: Grab from Tam Coc 20 min before, so leave 06:15 or 07:20. Or a limousine van VND 150-270k. Be in Hanoi by noon. Trains and buses: <a href=\"https://12go.asia/en/travel/ninh-binh/hanoi?date=2027-04-02\" target=\"_blank\" rel=\"noopener\">12go, Fri 2 Apr</a>", "note": "<span class=\"nt\">Timetable is November 2026: re-check for 2 Apr</span>"}], "sleep": [{"name": "Pick: Mr Thong Homestay, 100 m from the cave", "price": "47 per room for 3 nights, about 16 a night", "note": "Rated 9.3 from 234", "link": "https://www.booking.com/hotel/vn/mr-thong-doi-2-tam-coc-motel.en-gb.html?checkin=2027-03-30&checkout=2027-04-02&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Mr+Thong+Homestay+Tam+Coc", "primary": true}, {"name": "Alternative: BamBoo Villa Homestay", "price": "47 per room for 3 nights", "note": "Rated 9.7 from 221", "link": "https://www.booking.com/hotel/vn/bamboo-villa-homestay.en-gb.html?checkin=2027-03-30&checkout=2027-04-02&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=BamBoo+Villa+Homestay+Tam+Coc", "primary": false}, {"name": "Airbnb: whole apartment, Tam Coc", "price": "38 per room for 3 nights", "note": "4.9 from 147 reviews; cancellation terms not read", "link": "https://www.airbnb.com/rooms/47259609?check_in=2027-03-30&check_out=2027-04-02&adults=2"}, {"name": "Airbnb: private room, Tam Coc", "price": "39 per room for 3 nights", "note": "4.91 from 95 reviews; cancellation terms not read", "link": "https://www.airbnb.com/rooms/44113019?check_in=2027-03-30&check_out=2027-04-02&adults=2"}], "sleepnote": "Sleep in Tam Coc, not in Ninh Binh city and not by Hang Mua. Airbnb has a whole apartment for 38 (4.9 from 147), 9 less than the pick; the pick stays for its dated free cancellation while the party size is open.", "menu": [{"name": "Bich Dong pagoda and cycle loop", "dur": "2-3 h", "cost": "free entry, parking VND 20k; bicycle often free at the guesthouse (or VND 40-100k)", "note": "Tam Coc, Bich Dong, Thung Nham road. Tue 30, 15:00 after the work block: the pagoda is open 07:30-17:00, the loop outside is for the golden hour (sunset 18:10). Bich Dong 4.4 (7,244)", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Bich+Dong+Pagoda+Ninh+Binh", "tags": []}, {"name": "Tam Coc boat", "dur": "1.5-2 h, 07:30", "cost": "VND 250k each at the official booth; agree a tip of 20-50k first", "note": "Only if you want a second boat: Trang An has the caves. Rated 4.5 (18,606); the side piers rate 3.0-3.5, avoid", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Tam+Coc+Ninh+Binh", "tags": ["tamcoc"]}, {"name": "Hang Mua viewpoint", "dur": "~2 h, about 500 steps", "cost": "VND 100k (EUR 3.5)", "note": "Wed 31 at sunset (18:10); arrive late afternoon. Park in Tam Coc: parking touts near the cave", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Hang+Mua+Ninh+Binh", "tags": []}, {"name": "Cuc Phuong National Park", "dur": "~6-7 h with the ride (a guess; distance not found)", "cost": "VND 60k + VND 50k per primate or turtle programme", "note": "Thursday option: full day, about 2 h ride each way (an estimate). Phat Diem is the half-day alternative. Rated 4.5 (5,240)", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Cuc+Phuong+National+Park", "tags": ["cucphuong"]}, {"name": "Phat Diem stone cathedral", "dur": "half day, 1 h ride each way", "cost": "free", "note": "Thursday alternative to Cuc Phuong. Rated 4.7 (5,082). Hours vary (one review says closed in the early afternoon): check it is open at 10:30", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Phat+Diem+Cathedral", "tags": []}, {"name": "Van Long nature reserve", "dur": "~3 h in all, 45-90 min on the boat", "cost": "VND 100k (EUR 3.5)", "note": "Thu 07:30. Quiet, no vendors, langurs. Price unclear (VND 100k each or per boat): ask the kiosk", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Van+Long+Nature+Reserve", "tags": []}, {"name": "Hoa Lu, the old capital", "dur": "~2 h", "cost": "VND 20k", "note": "You said you want to see it", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Hoa+Lu+Ancient+Capital", "tags": []}, {"name": "Bai Dinh pagoda", "dur": "~2.5 h", "cost": "electric car VND 100k", "note": "Rated 4.7 (36,253) but big, modern and crowded", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Bai+Dinh+Pagoda", "tags": []}, {"name": "Trang An by rowing boat", "dur": "~3 h: Route 1 at 07:00, 9 caves (2.5-3.5 h)", "cost": "VND 250k cash at the gate (one operator says 300k: budget 300k)", "note": "Wed 07:00; tour buses come 10:00-13:30. Rowed only. Rated 4.6 (15,556)", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Trang+An+Eco-Tourism+Complex+Ninh+Binh", "tags": ["trangan"]}, {"name": "Trang An self-paddle kayak", "dur": "~3 km loop from the wharf", "cost": "VND 250-400k", "note": "A separate loop with no caves. Your call, if rowing feels like less fun than paddling yourself", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Trang+An+Eco-Tourism+Complex+Ninh+Binh", "tags": []}, {"name": "Thung Nham bird garden", "dur": "~2.5 h", "cost": "VND 150k with boat", "note": "-", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Thung+Nham+Bird+Garden", "tags": []}, {"name": "Scooter", "dur": "all stay", "cost": "VND 100-200k a day in two guides, 650k-1.35M in a third: ask the shop", "note": "Film it, cash deposit VND 1-2M, not the passport. One blog reports more police checks near Hang Mua in 2026", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Scooter+rental+Tam+Coc+Ninh+Binh", "tags": []}, {"name": "Private boat at Trang An", "dur": "-", "cost": "VND 800k-1M", "note": "Same as the VND 250k ticket", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Trang+An+Eco-Tourism+Complex+Ninh+Binh", "tags": []}], "tags": ["ninhbinh", "tamcoc", "trangan"], "extra": ""}, {"id": "hanoi3", "cls": "zh", "name": "Hanoi, last night", "short": "Hanoi", "dates": "Fri 2 Apr", "nights": "1 night", "from_": "2027-04-02", "to": "2027-04-03", "avail": "arrive 10:10 (SE12) or 11:10 (SE20), in the city about 11:45, bed about 23:00, leave the room 06:00", "fit": "The day fits from the late-morning train to a 23:00 bed, but the night is short (about 6 h of sleep before the 06:00 taxi). A club instead of the food tour means bed after 01:00 and under 5 h of sleep. The Mausoleum is closed on Fridays.", "legs": [{"leg": "Sat 3 to Noi Bai", "how": "Pre-booked taxi about EUR 14 or Grab at 06:00; Bus 86 does not run that early", "note": "<span class=\"nt\">Flight 09:50, at Noi Bai about 06:45</span>"}], "sleep": [{"name": "Pick: La Ava's Home, the same room as 24 Mar", "price": "26 per room", "note": "Bag storage. Free cancellation until 1 Apr", "link": "https://www.booking.com/hotel/vn/la-avas-home.en-gb.html?checkin=2027-04-02&checkout=2027-04-03&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=La+Ava%27s+Home+Hanoi", "primary": true}], "sleepnote": "Same room for both Hanoi nights (24 Mar, 2 Apr).", "menu": [{"name": "Food crawl by yourself", "dur": "~3 h", "cost": "bun cha VND 40-60k (EUR 1.4-2.1) a bowl. A small-group food tour is EUR 14-21 each (walk up); free Hanoikids needs booking ahead. Your call", "note": "Fri 2 evening, after the bridge. Bun cha lunch about 12:00 the same day. Food tour or this crawl: your call", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Hanoi+Old+Quarter", "tags": ["hanoifood", "buncha"]}, {"name": "Weekend night market", "dur": "~2 h", "cost": "cash only", "note": "Fri-Sun roughly 18:00 to 23:00 or midnight, with the Hoan Kiem walking street from 19:00. Fri 2 Apr is the only night you are there for it", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Hanoi+Weekend+Night+Market", "tags": []}, {"name": "Long Bien bridge at sunset", "dur": "~1 h", "cost": "free", "note": "Sunset is 18:10; be on the bridge by 17:30", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Long+Bien+Bridge+Hanoi", "tags": []}, {"name": "Temple of Literature", "dur": "~1.5 h", "cost": "about VND 70k (EUR 2.4) at the gate; resellers charge more", "note": "Rated 4.6. Open 08:00-17:00, last entry 16:30, cash. Do it at 13:00", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Temple+of+Literature+Hanoi", "tags": []}, {"name": "Quan Su Pagoda", "dur": "20-30 min", "cost": "free", "note": "Active temple, 4.7 (3,464). Next to the route between the temple and the lake", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Quan+Su+Pagoda+Hanoi", "tags": []}, {"name": "Bia hoi and the Ta Hien corner", "dur": "~1.5 h", "cost": "VND 10-15k a beer", "note": "Pavement cleared about 23:00; the day ends at 23:00, so only if the walking street ends early", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Ta+Hien+Street+Hanoi", "tags": ["hanoifood"]}, {"name": "A club only, instead of the food tour", "dur": "1-2 h", "cost": "entry prices not found", "note": "In before midnight, then a 06:00 taxi leaves under 5 h of sleep. Unmute (169 Phuc Tan) 4.6, open Fri 19:00-05:00; Weeknd 4.7; 1900 Club Hanoi (1900 Le Theatre) 4.2; Binh Minh Jazz 4.5 is the calm option", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Unmute+Hanoi+169+Phuc+Tan", "tags": []}, {"name": "Language exchange", "dur": "~2 h", "cost": "free", "note": "Facebook page cshanoienglish, March dates not found; students also talk to anyone at the bottom end of Hoan Kiem Lake", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Hoan+Kiem+Lake+Hanoi", "tags": []}, {"name": "Tay Ho bars", "dur": "-", "cost": "-", "note": "Savage, Red River Tea Room and Hanoi Rock City are permanently closed, and Tay Ho late hours clash with police raids. Go to an Old Quarter club before midnight instead", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Tay+Ho+Hanoi", "tags": ["tayho"]}, {"name": "Cooking in a home, climbing gym", "dur": "-", "cost": "USD 40-95 / day pass not found", "note": "-", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Climbing+gym+Hanoi", "tags": []}, {"name": "Train street", "dur": "-", "cost": "-", "note": "Tours banned, cafes policed, service cut in March 2026", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Train+Street+Hanoi", "tags": []}, {"name": "Ho Chi Minh Mausoleum", "dur": "-", "cost": "-", "note": "Closed Mon and Fri: no slot in any Hanoi window", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Ho+Chi+Minh+Mausoleum", "tags": []}], "tags": ["hanoifood", "buncha", "tayho"], "extra": ""}, {"id": "sg", "cls": "zx", "name": "Singapore", "short": "Singapore", "dates": "Sat 3 - Tue 6 Apr", "nights": "3 nights", "from_": "2027-04-03", "to": "2027-04-06", "avail": "Saturday from about 15:30 (land 14:20), Sunday, Monday to about 22:30", "fit": "This is about 1.7 days, not 3. Saturday holds the check-in, Kampong Glam, dinner, Gardens by the Bay and the night out; Sunday is the one full day (Pulau Ubin); Monday the Southern Ridges, hawker crawl, temples, bouldering and dinner until 22:30. There is no Monday night out before a 02:45 flight.", "legs": [{"leg": "Sat 3 arrival", "how": "Changi MRT to Bugis about 40 min, about S$2 by contactless card, no pass; Grab S$25-40. Have the printed Singapore to Vienna ticket and the hotel booking ready for the 96-hour transit rule; the Hanoi counter may ask", "note": "<span class=\"nt\">SG Arrival Card free, Thu 1-Fri 2 Apr</span>"}, {"leg": "Mon 5 to Changi for 02:45", "how": "Leave the room by 22:30 (it is yours until the Tuesday checkout) and be on the MRT from Bugis by 23:00: the last Tanah Merah to Changi train is 23:50 (2026 timetable; 2027 closures not announced). Missed it: Grab S$34-55. Scoot is at Terminal 1: counters open 23:45 and close 60 min before the flight. No night bus. Bag storage at Changi SGD 6-11 a day", "note": "<span class=\"nt\">Last train: 2026 timetable</span>"}], "sleep": [{"name": "Pick: Heritage Collection on Kampong Glam, Loft (Skylight)", "price": "349 per room for 3 nights, 116 a night", "note": "Rated 9.4 from 381, non-refundable", "link": "https://www.booking.com/hotel/sg/heritage-collection-on-kg.en-gb.html?checkin=2027-04-03&checkout=2027-04-06&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Heritage+Collection+on+Kampong+Glam+Singapore", "primary": true}, {"name": "Cheaper in the same hotel: Studio (No Window)", "price": "302 per room", "note": "no window, and the other 302 room is next to a bar", "link": "https://www.booking.com/hotel/sg/heritage-collection-on-kg.en-gb.html?checkin=2027-04-03&checkout=2027-04-06&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Heritage+Collection+on+Kampong+Glam+Singapore", "primary": false}, {"name": "Cheaper elsewhere: BLANC INN, queen room with shared bathroom", "price": "218 per room", "note": "Rated 8.1 from 312", "link": "https://www.booking.com/hotel/sg/blanc-inn-singapore.en-gb.html?checkin=2027-04-03&checkout=2027-04-06&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=BLANC+INN+Singapore", "primary": false}, {"name": "Alternative: Hotel Mi Rochor, superior twin", "price": "349 per room", "note": "Rated 8.3 from 7,145", "link": "https://www.booking.com/hotel/sg/mi-rochor.en-gb.html?checkin=2027-04-03&checkout=2027-04-06&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Hotel+Mi+Rochor+Singapore", "primary": false}, {"name": "Airbnb: Check Inn Hotel, Lavender", "price": "267 per room for 3 nights", "note": "4.56 from 57 reviews; room type, window and cancellation not read", "link": "https://www.airbnb.com/rooms/1517064583213705389?check_in=2027-04-03&check_out=2027-04-06&adults=2"}], "sleepnote": "No cheap area exists in Singapore. The cheapest unit on a booking site is often not what it looks like: the capsule hotels list a single bed (Jyu Capsule's double capsule is EUR 639 for 3 nights), and the 302 at Heritage is a room without a window. Airbnb lists only hotels here; Check Inn Hotel is 267, but its room was not read.", "menu": [{"name": "Hawker crawl: Hong Lim, Chinatown Complex, Maxwell", "dur": "2-3 h, any lunch", "cost": "about S$25-35 each; a hawker tour is EUR 62-89. Tian Tian at Maxwell S$5-6; the Jewel branch charges S$11", "note": "Do it yourself, Mon 11:00. Maxwell 4.4 (24,310), Chinatown Complex 4.2 (9,054)", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Maxwell+Food+Centre+Singapore", "tags": []}, {"name": "Kampong Glam: Haji Lane, Zam Zam murtabak, Sultan Mosque from outside", "dur": "~1.5 h", "cost": "free + about S$10", "note": "The hotel base; Saturday evening, from outside only. Visitors are let into the mosque 10:00-12:00 and 14:00-16:00 (closed Fri), and arrival on Saturday is too late. Mosque 4.7 (14,219)", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Sultan+Mosque+Singapore", "tags": []}, {"name": "Gardens by the Bay: Garden Rhapsody", "dur": "~1 h", "cost": "free; OCBC Skyway S$14", "note": "Shows 19:45 and 20:45 (not confirmed). The Skyway shuts in rain", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Gardens+by+the+Bay+Supertree+Grove", "tags": []}, {"name": "GuruWalk free tour", "dur": "~3 h", "cost": "pay what you want, a tip of S$30-50 is the guideline", "note": "Chinatown, Little India, Kampong Glam; 4.96 from 225 reviews. Only if a guide has a slot on Saturday after 16:00", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Chinatown+Singapore", "tags": []}, {"name": "Pulau Ubin", "dur": "~5-6 h", "cost": "bumboat S$4, bike about S$10-20 (prices differ)", "note": "Sunday. MRT and bus to Changi Point, about 1 h from Kampong Glam; leave 09:30, back about 16:00", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Pulau+Ubin+Singapore", "tags": []}, {"name": "Southern Ridges: Mount Faber to Henderson Waves", "dur": "1.5-2 h", "cost": "free", "note": "Before 11:00 or after 16:30. Rain cancels it", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Henderson+Waves", "tags": []}, {"name": "Chinatown temples: Sri Mariamman and Buddha Tooth Relic", "dur": "~45 min", "cost": "free", "note": "Qingming falls around 4-5 Apr: expect busy temples", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Sri+Mariamman+Temple+Singapore", "tags": []}, {"name": "Kayak at Pasir Ris", "dur": "~2 h", "cost": "about S$12 an hour", "note": "Weekend from 10:00, weekdays from 15:00. Does not fit a 1.7-day stop", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Pasir+Ris+Beach+Singapore", "tags": []}, {"name": "Bouldering at Boulder Movement Bugis, Mon 17:30-19:30", "dur": "~2 h", "cost": "S$20 off-peak, S$35 peak (EUR 14-24); buy in the app", "note": "Rain-proof, social. The evening session opens 17:30 on a normal weekday; check the Monday hours in the app", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Boulder+Movement+Bugis+Singapore", "tags": []}, {"name": "Little India and Tekka Centre", "dur": "~1.5 h", "cost": "meal S$8-15", "note": "Monday dinner, after bouldering", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Tekka+Centre+Singapore", "tags": []}, {"name": "Futsal on a public court", "dur": "~1.5 h", "cost": "S$19.50-39 per court-hour for non-citizens", "note": "Strangers join public courts", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Public+futsal+court+Singapore", "tags": []}, {"name": "Nights out, Sat 3", "dur": "-", "cost": "Zouk men S$30 online with a drink (in before midnight; collared shirt, long trousers, closed shoes). Ce La Vi S$38 with a drink (entry cut-off not confirmed)", "note": "Zouk lists events Wed-Sat only, so Sat 3 is the club night. Ce La Vi beats the SkyPark deck at S$32 with no drink; its entry cut-off is not confirmed. Smoke & Mirrors is closed. Ladies' free nights do not apply", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Zouk+Singapore", "tags": []}, {"name": "Night out, Sun", "dur": "-", "cost": "Swee Choon dim sum to 02:00 (hours not confirmed); Bae's Cocktail Club is free on Mon 22:00-03:00, which clashes with your flight", "note": "Weekday nightlife is thin. No drinking in public 22:30-07:00", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Swee+Choon+Tim+Sum+Restaurant+Singapore", "tags": []}, {"name": "Sentosa", "dur": "-", "cost": "luge S$33-36, AltitudeX (formerly iFly) S$89-109; prices not confirmed", "note": "Pricey for what it is", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Sentosa+Singapore", "tags": []}, {"name": "Newton, Lau Pa Sat, Boat Quay, Clarke Quay, Kranji, Haw Par Villa", "dur": "-", "cost": "-", "note": "Traps, closed on your days, or partly closed since Dec 2025 (Haw Par Villa; Smoke & Mirrors is closed for good). Zouk is the one Clarke Quay exception", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Newton+Food+Centre+Singapore", "tags": []}], "tags": ["singaporefood", "pulauubin"], "extra": ""}], "days": [{"date": "2027-03-14", "label": "Sun 14 Mar", "sleep": "On the plane", "cls": "zx", "move": "Vienna 10:00, Scoot via Changi on one booking, 19 h 45 in all (lands Krabi Mon 11:45). Ask for both boarding passes at Vienna check-in; at Changi (arrive 04:40, 6 h 15 wait) stay airside, do not clear immigration (if you only got the first pass, the Transfer desk airside has the second). Pack to 7 kg for the Thai AirAsia leg on 24 Mar, or add the Xtra Carry-On.", "stops": [], "bed": null, "bedlink": null}, {"date": "2027-03-15", "label": "Mon 15", "sleep": "Ao Nang", "cls": "zt", "move": "Land Krabi 11:45. Shared van or bus to Ao Nang THB 100-150 each (not the THB 1,600 hotel transfer). Withdraw cash once, in Ao Nang: the maximum, refuse the currency conversion, enough for Mook (THB 6,000-8,000 for two). Check in and rest (about 27 h awake, so rest is the plan), walk the beach to Nopparat Thara for sunset 18:36, early bed.", "stops": ["aonang"], "bed": "Baan Thara Guesthouse", "bedlink": "https://www.booking.com/hotel/th/baan-thara-guesthouse-nopprarat-thara-beach-aonang-krabi.en-gb.html?checkin=2027-03-15&checkout=2027-03-18&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-16", "label": "Tue 16", "sleep": "Ao Nang", "cls": "zt", "move": "06:30 Tiger Cave Temple, 1,260 steps, 2-3 h (scooter 25 min: rent it Mon 15 afternoon and keep it to Tue 09:30; cash deposit, not the passport), breakfast. 09:30-13:30: work 10:00-12:30, or the Poda kayak instead (THB 600, about 3.5 h). 13:30 longtail to Railay (THB 100): viewpoint, then Princess Lagoon and Phra Nang for high water about 16:00, last shared boat back before 18:00. Ask a climbing school about Wed.", "stops": ["aonang"], "bed": "Baan Thara Guesthouse", "bedlink": "https://www.booking.com/hotel/th/baan-thara-guesthouse-nopprarat-thara-beach-aonang-krabi.en-gb.html?checkin=2027-03-15&checkout=2027-03-18&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-17", "label": "Wed 17", "sleep": "Ao Nang", "cls": "zt", "move": "09:00 longtail to Railay: climbing half day (THB 900-1,500 each, about 4 h). Back by 14:00, lunch, work 14:30-16:30. From 16:45 the Ao Nang Wednesday night market for dinner (it runs 16:00-20:00). Hong Islands 08:30-15:30 instead (your call): work 16:00-18:00, market after.", "stops": ["aonang"], "bed": "Baan Thara Guesthouse", "bedlink": "https://www.booking.com/hotel/th/baan-thara-guesthouse-nopprarat-thara-beach-aonang-krabi.en-gb.html?checkin=2027-03-15&checkout=2027-03-18&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-18", "label": "Thu 18", "sleep": "Koh Mook", "cls": "zt", "move": "Pack and leave Ao Nang between 06:15 and 09:30 (confirm the time on Wed; the 09:30 gets you to Mook by about 13:00). Shared van plus longtail to Mook (USD 19-23 each, book via the guesthouse on Wed; dearer option: Bundhaya 10:10, lands 13:20). On Mook: bicycle round the island and the village, Charlie Beach sunset 18:33, then a drink at Mong Bar before 19:30 (it closes 20:00; check it is open, or go to Perfect Bar and Restaurant, open 12:00-22:00).", "stops": ["aonang", "mook"], "bed": "Kookkai Bungalows", "bedlink": "https://www.booking.com/hotel/th/kookkai-bungalows.en-gb.html?checkin=2027-03-18&checkout=2027-03-20&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-19", "label": "Fri 19", "sleep": "Koh Mook", "cls": "zt", "move": "09:00 Kradan and Ngai by longtail, snorkel off the beach, back 13:30 (or the 08:00 dugong boat, your call). 14:30-16:30 Emerald Cave by private longtail (THB 1,000-1,700 a boat, park THB 200 each): high water is about 09:00 and floods the arch, low water about 14:45 (tide table for Railay), so the 14:30 boat is at low water; Kookkai confirms the boat time. Fri midday is prayer time on Mook: agree both boat times with the boatman on Thu evening. Sunset 18:33, book Sat's boat at a village agent, work 20:00-22:00.", "stops": ["mook"], "bed": "Kookkai Bungalows", "bedlink": "https://www.booking.com/hotel/th/kookkai-bungalows.en-gb.html?checkin=2027-03-18&checkout=2027-03-20&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-20", "label": "Sat 20", "sleep": "Koh Lanta", "cls": "zt", "move": "07:30 Sabai Beach jungle track (2 h, muddy), breakfast. Speedboat Mook to Lanta 11:00 (or 14:00), THB 540-600. On Lanta: check in, rent a scooter, ask 2-3 Saladan agencies about Koh Rok for Sun, then the Old Town Saturday walking street in the evening. The ride back is about 25 km in the dark: go slowly, or leave by 21:00.", "stops": ["mook", "lanta"], "bed": "Cat Bungalow", "bedlink": "https://www.booking.com/hotel/th/cat-bungalow.en-gb.html?checkin=2027-03-20&checkout=2027-03-24&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-21", "label": "Sun 21", "sleep": "Koh Lanta", "cls": "zt", "move": "08:00 Koh Rok and Koh Haa speedboat day from Saladan (7-9 h, THB 2,000-3,000 each + park 400 each), back about 16:30. If the swell is up, Koh Rok goes to Mon 22, the cave and park move to Tue 23 09:00-13:00, the Muay Thai lesson drops and KoHub starts at 14:00. Sunset on Long Beach 18:35.", "stops": ["lanta"], "bed": "Cat Bungalow", "bedlink": "https://www.booking.com/hotel/th/cat-bungalow.en-gb.html?checkin=2027-03-20&checkout=2027-03-24&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-22", "label": "Mon 22", "sleep": "Koh Lanta", "cls": "zt", "move": "(Swell day on Sun 21: Koh Rok moves here and these two move to Tue 23.) 08:30 Khao Mai Kaew cave with guide and headlamp (2 h). 13:00 Mu Ko Lanta National Park: nature loop, lighthouse by 15:30, out before the gate shuts (16:30 or 17:30, not confirmed). Klong Dao Monday market from about noon (Maps says 15:00) to about 18:30: after the park is the time that fits. Sunset on Long Beach 18:35 under the full moon, then iRie Bar's Monday bands from 20:00 (check it is open).", "stops": ["lanta"], "bed": "Cat Bungalow", "bedlink": "https://www.booking.com/hotel/th/cat-bungalow.en-gb.html?checkin=2027-03-20&checkout=2027-03-24&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-23", "label": "Tue 23", "sleep": "Koh Lanta", "cls": "zt", "move": "Muay Thai group lesson about 08:30 (1.5 h; ask the gym for the time on Mon). Work 12:30-17:30 at KoHub (day pass THB 400, open 09:00-17:30). On a swell day (see Sun 21) the cave and park take 09:00-13:00 instead, there is no Muay Thai and KoHub starts at 14:00. 18:00 dinner at the roadside food shops by Klong Nin (the Tuesday market there is a morning market), laundry, pack: the pickup is 06:30.", "stops": ["lanta"], "bed": "Cat Bungalow", "bedlink": "https://www.booking.com/hotel/th/cat-bungalow.en-gb.html?checkin=2027-03-20&checkout=2027-03-24&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-24", "label": "Wed 24", "sleep": "Hanoi", "cls": "zh", "move": "06:30 private car to Krabi airport (about EUR 60 a car, EUR 30 each, 12go, booked ahead; there about 09:30, the ferry queue can add up to 2 h). Thai AirAsia 13:35 via Bangkok DMK on one booking (confirm it is one Fly-Thru ticket: see ask), 7 kg incl. the personal item, lands Hanoi 20:15. Noi Bai: Bus 86 only if out by 21:00, else Grab in the app, never an approaching driver. In the room about 22:00, one late bowl at Pho Ga Nguyet near La Ava's (open to midnight), bed 23:00.", "stops": ["lanta", "hanoi1"], "bed": "La Ava's Home, Hanoi", "bedlink": "https://www.booking.com/hotel/vn/la-avas-home.en-gb.html?checkin=2027-03-24&checkout=2027-03-25&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-25", "label": "Thu 25", "sleep": "Ha Giang town", "cls": "zg", "move": "06:30 pho breakfast at Bat Dan (opens 06:00), VND 5-8M from a VPBank ATM. 09:30 Bang Phan day bus from 156 Tran Quang Khai to Ha Giang, arrives 15:30 (EUR 12). In town: pick up the bike this evening (test ride, film it, cash deposit), border permit about USD 10 (keep the receipt), cash from an ATM (none in Du Gia), dinner in town, early night.", "stops": ["hagiang"], "bed": "Ha Giang Faithien Homestay", "bedlink": "https://www.booking.com/hotel/vn/ha-giang-faithien-homestay.en-gb.html?checkin=2027-03-25&checkout=2027-03-26&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-26", "label": "Fri 26", "sleep": "Du Gia", "cls": "zg", "move": "Leave Ha Giang 06:45 on the direct road (QL34 then DT176, about 70 km; the last stretch on DT176 is rough). Plan 3.5-4 h, in Du Gia about 10:30; the Friday market is usually Fridays and ends about noon (not confirmed). Du Gia waterfall (cold, 1.5 h), then rest by choice after the ride, family dinner at Happy Homestay.", "stops": ["hagiang"], "bed": "Happy Homestay Du Gia", "bedlink": "https://www.booking.com/hotel/vn/happy-homestay-du-gia-yen-minh.en-gb.html?checkin=2027-03-26&checkout=2027-03-27&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-27", "label": "Sat 27", "sleep": "Dong Van", "cls": "zg", "move": "Leave Du Gia 08:00: the Mau Due road (DT182, the worst surface, 2.5-3 h) to Meo Vac, then Ma Pi Leng to Dong Van, about 100 km, 4-4.5 h plus stops, in before dusk (sunset 18:12; heavy rain makes it the risk). Ma Pi Leng is ridden this afternoon, again on Sunday morning (the other way, other light) and a third time on Monday. Lung Cu only if you reach Dong Van by 14:00 and the sky is clear (about 2.5 h there and back, in before the 18:12 sunset). Dong Van old quarter in the evening, cash at the ATM, early bed: the market is 06:30.", "stops": ["hagiang"], "bed": "ToTo-Chan Hotel, Dong Van", "bedlink": "https://www.booking.com/hotel/vn/toto-chan.en-gb.html?checkin=2027-03-27&checkout=2027-03-28&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-28", "label": "Sun 28", "sleep": "Meo Vac", "cls": "zg", "move": "06:30 Dong Van Sunday market, on the road 09:00, Ma Pi Leng, Meo Vac about 11:00-11:30. The Meo Vac market is Sunday, 04:00-16:00 and busiest early morning, so you see the tail end. Then Nho Que river by kayak (1 h, VND 120-150k). One toast of corn wine at most: you ride Monday.", "stops": ["hagiang"], "bed": "Xua Vu Homestay, Meo Vac", "bedlink": "https://www.booking.com/hotel/vn/xua-vu-homestay.en-gb.html?checkin=2027-03-28&checkout=2027-03-29&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-29", "label": "Mon 29", "sleep": "Night bus", "cls": "zh", "move": "Leave Meo Vac 08:00 and ride back via Dong Van, Yen Minh and Quan Ba (5.5-6.5 h, 20 min stops), in Ha Giang about 14:30-15:00, bike back 15:30. Faithien Homestay: a EUR 10 room booked for Mon night, used for the afternoon (shower, bags, rest); also the bed if the bus fails. If the bike shop offers a free shower and bag storage, skip it (ask with the bike). Dinner in town. At the pickup 30+ min early for Sao Viet 22:00 or G8 23:00, the night bus straight to Ninh Binh. If the bus fails: Faithien that night, first morning bus.", "stops": ["hagiang", "hanoi2"], "bed": "Night bus to Ninh Binh (a Faithien room in Ha Giang by day: shower, bags, rest)", "bedlink": "https://www.booking.com/hotel/vn/ha-giang-faithien-homestay.en-gb.html?checkin=2027-03-29&checkout=2027-03-30&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-30", "label": "Tue 30", "sleep": "Ninh Binh (Tam Coc)", "cls": "zs", "move": "Off the night bus in Tam Coc about 07:00-08:30 (not confirmed): bag drop and early check-in (ask Mr Thong before), breakfast, sleep. Work 12:00-14:30 (homestay wifi or Brick Coffee Shop). 15:00 Bich Dong pagoda (open until 17:00), then the Tam Coc to Thung Nham cycle loop until sunset (18:10), village noodles, pick up Wednesday's scooter this evening, early bed.", "stops": ["ninhbinh"], "bed": "Mr Thong Homestay, Tam Coc", "bedlink": "https://www.booking.com/hotel/vn/mr-thong-doi-2-tam-coc-motel.en-gb.html?checkin=2027-03-30&checkout=2027-04-02&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-31", "label": "Wed 31", "sleep": "Ninh Binh (Tam Coc)", "cls": "zs", "move": "07:00 Trang An rowed boat, Route 1 (2.5-3.5 h, 9 caves, VND 250k, budget 300k; tour buses come 10:00-13:30). 11:30 lunch, then Hoa Lu old capital by scooter (1.5-2 h, VND 20k). 16:30 Hang Mua (about 500 steps, VND 100k, park in Tam Coc) for sunset at 18:10.", "stops": ["ninhbinh"], "bed": "Mr Thong Homestay, Tam Coc", "bedlink": "https://www.booking.com/hotel/vn/mr-thong-doi-2-tam-coc-motel.en-gb.html?checkin=2027-03-30&checkout=2027-04-02&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-04-01", "label": "Thu 1 Apr", "sleep": "Ninh Binh (Tam Coc)", "cls": "zs", "move": "07:30 Van Long bamboo rowboat (45-90 min, quiet, langurs). Then your pick: Phat Diem stone cathedral (half day, 1 h ride; check it is open at 10:30) or Cuc Phuong National Park (full day, VND 60k, about 2 h each way, an estimate; leave 07:00 and skip Van Long). Back by 17:30, last-night dinner in Tam Coc; pack for a 06:15 or 07:20 start.", "stops": ["ninhbinh"], "bed": "Mr Thong Homestay, Tam Coc", "bedlink": "https://www.booking.com/hotel/vn/mr-thong-doi-2-tam-coc-motel.en-gb.html?checkin=2027-03-30&checkout=2027-04-02&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-04-02", "label": "Fri 2", "sleep": "Hanoi", "cls": "zh", "move": "Grab to Ninh Binh station: train SE12 07:12 (leave Tam Coc 06:15, arrive 10:10) or SE20 08:18 (leave 07:20, arrive 11:10). Bags at La Ava's, bun cha lunch about 12:00, Temple of Literature 13:00, then the afternoon free for Quan Su Pagoda, Hoan Kiem Lake and the Old Quarter. Long Bien bridge 17:30 for sunset 18:10, food tour 18:30-21:30 (paid small group, Hanoikids or a crawl by yourself: open), walking street, bed 23:00.", "stops": ["ninhbinh", "hanoi3"], "bed": "La Ava's Home, Hanoi", "bedlink": "https://www.booking.com/hotel/vn/la-avas-home.en-gb.html?checkin=2027-04-02&checkout=2027-04-03&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-04-03", "label": "Sat 3", "sleep": "Singapore", "cls": "zx", "move": "06:00 taxi (about EUR 14, booked the day before) or Grab to Noi Bai (there about 06:45), Scoot 09:50, Changi 14:20 (printed Singapore to Vienna ticket and hotel ready). MRT to Bugis, check in 15:30. Kampong Glam: Haji Lane, Zam Zam murtabak, the Sultan Mosque from outside (inside it is open 10:00-12:00 and 14:00-16:00, closed Fri; arrival is too late for it). Garden Rhapsody 19:45 or 20:45, then the club night: Zouk (in before midnight) or Ce La Vi (entry cut-off not confirmed).", "stops": ["sg"], "bed": "Heritage Collection, Kampong Glam", "bedlink": "https://www.booking.com/hotel/sg/heritage-collection-on-kg.en-gb.html?checkin=2027-04-03&checkout=2027-04-06&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-04-04", "label": "Sun 4", "sleep": "Singapore", "cls": "zx", "move": "09:30 to Changi Point (after a club night), bumboat to Pulau Ubin (S$4), bike round the island, back by about 16:00 for a hawker meal. Evening: Haji Lane bars or a Geylang supper (hours unconfirmed). No drinking in public 22:30-07:00.", "stops": ["sg"], "bed": "Heritage Collection, Kampong Glam", "bedlink": "https://www.booking.com/hotel/sg/heritage-collection-on-kg.en-gb.html?checkin=2027-04-03&checkout=2027-04-06&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-04-05", "label": "Mon 5", "sleep": "Singapore", "cls": "zx", "move": "08:30 Southern Ridges, Mount Faber to Henderson Waves (leave the hotel 07:45; done before 11:00). 11:00 hawker crawl Hong Lim, Chinatown Complex, Maxwell, then the Chinatown temples. Back at the room about 15:00 for a shower and a rest. 17:30-19:30 bouldering at Boulder Movement Bugis (S$20 off-peak), then Little India and Tekka dinner, then pack. Leave the room by 22:30 (it is yours until the Tuesday checkout), on the MRT from Bugis by 23:00 (last Tanah Merah to Changi train 23:50), Scoot counters open 23:45 at Terminal 1.", "stops": ["sg"], "bed": "Heritage Collection, Kampong Glam", "bedlink": "https://www.booking.com/hotel/sg/heritage-collection-on-kg.en-gb.html?checkin=2027-04-03&checkout=2027-04-06&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-04-06", "label": "Tue 6 Apr", "sleep": "On the plane", "cls": "zx", "move": "Flight 02:45 from Changi Terminal 1, home 08:55. Not covered by EU261, unlike the flight out.", "stops": [], "bed": null, "bedlink": null}], "flights": [{"route": "Vienna to Kr
