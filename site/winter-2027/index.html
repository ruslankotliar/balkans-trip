/?api=1&query=Zouk+Singapore", "tags": []}, {"name": "Night out, Sun", "dur": "-", "cost": "Swee Choon dim sum to 02:00 (hours not confirmed); Bae's Cocktail Club is free on Mon 22:00-03:00, which clashes with your flight", "note": "Weekday nightlife is thin. No drinking in public 22:30-07:00", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Swee+Choon+Tim+Sum+Restaurant+Singapore", "tags": []}, {"name": "Sentosa", "dur": "-", "cost": "luge S$33-36, AltitudeX (formerly iFly) S$89-109; prices not confirmed", "note": "Pricey for what it is", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Sentosa+Singapore", "tags": []}, {"name": "Newton, Lau Pa Sat, Boat Quay, Clarke Quay, Kranji, Haw Par Villa", "dur": "-", "cost": "-", "note": "Traps, closed on your days, or partly closed since Dec 2025 (Haw Par Villa; Smoke & Mirrors is closed for good). Zouk is the one Clarke Quay exception", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Newton+Food+Centre+Singapore", "tags": []}], "tags": ["singaporefood", "pulauubin"], "extra": ""}], "days": [{"date": "2027-03-14", "label": "Sun 14 Mar", "sleep": "On the plane", "cls": "zx", "move": "Vienna 10:00, Scoot via Changi on one booking, 19 h 45 in all (lands Krabi Mon 11:45). Ask for both boarding passes at Vienna check-in; at Changi (arrive 04:40, 6 h 15 wait) stay airside, do not clear immigration, and sleep in the free Snooze Lounge (Terminal 1, transit level 3, open 24 h): eye mask, earplugs, alarm 09:30. If you only got the first pass, the Transfer desk airside has the second. Pack to 7 kg for the Thai AirAsia leg on 24 Mar, or add the Xtra Carry-On.", "stops": [], "bed": null, "bedlink": null}, {"date": "2027-03-15", "label": "Mon 15", "sleep": "Ao Nang", "cls": "zt", "move": "Land Krabi 11:45. Shared van or bus to Ao Nang THB 100-150 each (not the THB 1,600 hotel transfer). Withdraw cash once, in Ao Nang, at an AEON ATM if you find one (fee THB 150 against 220-250): the maximum, refuse the currency conversion, enough for Mook (THB 6,000-8,000 for two). Check in and rest (about 27 h awake, so rest is the plan), walk the beach to Nopparat Thara for sunset 18:36, dinner at Ko Dam Kitchen (open to 22:30, dishes about THB 70-80), early bed; Khao Yum Nai Baan is the breakfast.", "stops": ["aonang"], "bed": "Baan Thara Guesthouse", "bedlink": "https://www.booking.com/hotel/th/baan-thara-guesthouse-nopprarat-thara-beach-aonang-krabi.en-gb.html?checkin=2027-03-15&checkout=2027-03-18&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-16", "label": "Tue 16", "sleep": "Ao Nang", "cls": "zt", "move": "06:30 Tiger Cave Temple, 1,260 steps, 2-3 h (scooter 25 min: rent it Mon 15 afternoon and keep it to Tue 09:30; cash deposit, not the passport), breakfast. 09:30-13:30 a paddle: Klong Root self-paddle (THB 300 per 2-seat kayak, 1-1.5 h) or the Poda kayak (THB 600 each, about 3.5 h). 13:30 longtail to Railay (THB 100): viewpoint, then Princess Lagoon and Phra Nang for high water about 16:00, last shared boat back before 18:00. Ask a climbing school about Wed.", "stops": ["aonang"], "bed": "Baan Thara Guesthouse", "bedlink": "https://www.booking.com/hotel/th/baan-thara-guesthouse-nopprarat-thara-beach-aonang-krabi.en-gb.html?checkin=2027-03-15&checkout=2027-03-18&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-17", "label": "Wed 17", "sleep": "Ao Nang", "cls": "zt", "move": "09:00 longtail to Railay: climbing half day (THB 900-1,500 each, about 4 h). Back by 14:00, lunch, swim and rest. From 16:45 the Ao Nang Wednesday night market for dinner (it runs 16:00-20:00). Hong Islands 08:30-15:30 instead (your call; ask at the Ao Nang ticket booth for a shared boat, one report of THB 300 return, unconfirmed): market after.", "stops": ["aonang"], "bed": "Baan Thara Guesthouse", "bedlink": "https://www.booking.com/hotel/th/baan-thara-guesthouse-nopprarat-thara-beach-aonang-krabi.en-gb.html?checkin=2027-03-15&checkout=2027-03-18&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-18", "label": "Thu 18", "sleep": "Koh Mook", "cls": "zt", "move": "Jijie van plus boat at 07:30 (pickup about 07:00; confirm the time and pickup with the guesthouse on Wed), on Mook 12:30, about EUR 21 each. Later and dearer: Satun Pakbara 08:35, lands 11:20, EUR 43; Bundhaya 10:10, lands 13:20, EUR 51. The early boat leaves the whole afternoon on Mook: lunch, a bicycle round the island and the village, Charlie Beach sunset 18:33, then a drink at Mong Bar before 19:30 (it closes 20:00; check it is open, or go to Perfect Bar and Restaurant, open 12:00-22:00).", "stops": ["aonang", "mook"], "bed": "Kookkai Bungalows", "bedlink": "https://www.booking.com/hotel/th/kookkai-bungalows.en-gb.html?checkin=2027-03-18&checkout=2027-03-20&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-19", "label": "Fri 19", "sleep": "Koh Mook", "cls": "zt", "move": "Optional first: the dugong boat with a spotter from Mook, about 07:30-09:30 (ask Kookkai on Thu for the price). 10:00 Kradan and Ngai by longtail, snorkel off the beach, back 13:30. 14:30-16:30 Emerald Cave by private longtail (THB 1,000-1,700 a boat, park THB 200 each): high water is about 09:00 and floods the arch, low water about 14:45 (tide table for Railay), so the 14:30 boat is at low water; Kookkai confirms the boat time. Fri midday is prayer time on Mook: agree both boat times with the boatman on Thu evening. Sunset 18:33, book Sat's boat at a village agent, dinner in the village.", "stops": ["mook"], "bed": "Kookkai Bungalows", "bedlink": "https://www.booking.com/hotel/th/kookkai-bungalows.en-gb.html?checkin=2027-03-18&checkout=2027-03-20&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-20", "label": "Sat 20", "sleep": "Koh Lanta", "cls": "zt", "move": "07:30 Sabai Beach jungle track (2 h, muddy), breakfast. Speedboat Mook to Lanta 11:00 (Bundhaya EUR 24; Satun Pakbara 10:45, EUR 26-28 on 12go; a village agent may be cheaper, THB 540-600 reported). On Lanta: check in, rent a scooter, ask 2-3 Saladan agencies about Koh Rok for Sun, then the Old Town Saturday walking street in the evening. The ride back is about 25 km in the dark: go slowly, or leave by 21:00.", "stops": ["mook", "lanta"], "bed": "Cat Bungalow", "bedlink": "https://www.booking.com/hotel/th/cat-bungalow.en-gb.html?checkin=2027-03-20&checkout=2027-03-24&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-21", "label": "Sun 21", "sleep": "Koh Lanta", "cls": "zt", "move": "08:00 Koh Rok and Koh Haa speedboat day from Saladan (7-9 h, THB 1,600-3,000 each + park 400 each; listings show THB 1,595-1,700, ask if the park is included), back about 16:30. If the swell is up, Koh Rok goes to Mon 22, the cave and park move to Tue 23 09:00-13:00, and the Muay Thai lesson drops. Sunset on Long Beach 18:35.", "stops": ["lanta"], "bed": "Cat Bungalow", "bedlink": "https://www.booking.com/hotel/th/cat-bungalow.en-gb.html?checkin=2027-03-20&checkout=2027-03-24&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-22", "label": "Mon 22", "sleep": "Koh Lanta", "cls": "zt", "move": "(Swell day on Sun 21: Koh Rok moves here and these two move to Tue 23.) 08:30 Khao Mai Kaew cave with guide and headlamp (2 h). 13:00 Mu Ko Lanta National Park: nature loop, lighthouse by 15:30, out before the gate shuts (16:30 or 17:30, not confirmed). Klong Dao Monday market from about noon (Maps says 15:00) to about 18:30: after the park is the time that fits. Sunset on Long Beach 18:35 under the full moon, then iRie Bar's Monday bands from 20:00 (check it is open).", "stops": ["lanta"], "bed": "Cat Bungalow", "bedlink": "https://www.booking.com/hotel/th/cat-bungalow.en-gb.html?checkin=2027-03-20&checkout=2027-03-24&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-23", "label": "Tue 23", "sleep": "Koh Lanta", "cls": "zt", "move": "Muay Thai group lesson about 08:30 (1.5 h; ask the gym for the time on Mon). 11:00 mangrove self-kayak at Thung Yee Peng (THB 400 per 2-person kayak, 2-3 h), lunch. 16:00 beach volleyball with the locals on Long Beach (free), sunset 18:35. On a swell day (see Sun 21) the cave and park take 09:00-13:00 instead, with no Muay Thai and no kayak. 19:00 dinner at the roadside food shops by Klong Nin (the Tuesday market there is a morning market), laundry, pack: the van pickup is about 07:00 (confirm it with Cat Bungalow).", "stops": ["lanta"], "bed": "Cat Bungalow", "bedlink": "https://www.booking.com/hotel/th/cat-bungalow.en-gb.html?checkin=2027-03-20&checkout=2027-03-24&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-24", "label": "Wed 24", "sleep": "Night bus", "cls": "zh", "move": "07:00 Jijie shared van to Krabi airport (EUR 11 each on 12go, free cancellation; confirm the hotel pickup with Cat Bungalow). There about 09:30; the ferry queue can add up to 2 h, and the 06:00 run (lands 08:30) gives more buffer. A private SUV (about EUR 60 a car) is the fallback only. Thai AirAsia 13:35 via Bangkok DMK on one booking (confirm it is one Fly-Thru ticket: see ask), 7 kg incl. the personal item, lands Hanoi 20:15. If you miss the flight, the same flight on Thu 25 is EUR 144. Noi Bai: dinner at the airport, message Sao Viet when you have the bags, night bus 23:45 from the airport (lying-down cabin, EUR 18-20; ask for a lower double), Ha Giang 05:45. If the flight is so late that the bus is gone: Grab to a Hanoi room and the 09:30 day bus; then Du Gia drops and Friday rides straight to Meo Vac.", "stops": ["lanta", "hanoi1"], "bed": "Night bus to Ha Giang (lying-down cabin), then Faithien from 06:00 (booked Wed night)", "bedlink": "https://www.booking.com/hotel/vn/ha-giang-faithien-homestay.en-gb.html?checkin=2027-03-24&checkout=2027-03-25&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-25", "label": "Thu 25", "sleep": "Du Gia", "cls": "zg", "move": "05:45 Ha Giang off the bus, Grab to Faithien, sleep until about 09:00, breakfast. Before you ride: VND 5-8M from a VPBank ATM (none in Du Gia), bike at 09:30: Hung Cuong first, HagiangGo second, a semi-automatic 125 cc for the two of you (engine braking on the descents), not through Klook; test ride two-up, film it, cash deposit, and ask whether the shop bills per 24 h. Border permit about USD 10 (keep the receipt). Km0 marker on the way out. Leave about 10:30 on the direct road (QL34 then DT176, about 70 km; the last stretch is rough), 3.5-4 h, in Du Gia about 14:30. Too tired after the bus: sleep longer, the road is short enough to leave by 12:00. Du Gia waterfall (cold, 1.5 h), family dinner at Happy Homestay.", "stops": ["hagiang"], "bed": "Happy Homestay Du Gia", "bedlink": "https://www.booking.com/hotel/vn/happy-homestay-du-gia-yen-minh.en-gb.html?checkin=2027-03-25&checkout=2027-03-26&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-26", "label": "Fri 26", "sleep": "Meo Vac", "cls": "zg", "move": "Du Gia Friday market from about 07:30 (usually Fridays, over by noon; not confirmed). Leave about 09:00: the Mau Due road (DT182, the worst surface) to Meo Vac, about 60 km, 2.5-3 h, in by about 12:30 (heavy rain makes it the risk). Lunch, then the Nho Que river by kayak in the afternoon (1 h, VND 120-150k). Meo Vac old streets, cash at the ATM.", "stops": ["hagiang"], "bed": "Xua Vu Homestay, Meo Vac", "bedlink": "https://www.booking.com/hotel/vn/xua-vu-homestay.en-gb.html?checkin=2027-03-26&checkout=2027-03-27&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-27", "label": "Sat 27", "sleep": "Dong Van", "cls": "zg", "move": "Ma Pi Leng in the morning light, ridden once, to Dong Van about 10:30-11:00, the old quarter. Lung Cu in the afternoon only if the sky is clear (about 2.5 h there and back, in before the 18:12 sunset). One toast of corn wine at most: you ride Sunday.", "stops": ["hagiang"], "bed": "ToTo-Chan Hotel, Dong Van", "bedlink": "https://www.booking.com/hotel/vn/toto-chan.en-gb.html?checkin=2027-03-27&checkout=2027-03-28&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-28", "label": "Sun 28", "sleep": "Night bus", "cls": "zh", "move": "07:00-09:00 Dong Van Sunday market at its peak, right where you slept. Leave about 09:15 and ride back via Yen Minh and Quan Ba (about 133 km, 20 min stops), in Ha Giang about 15:00, bike back 15:30. Faithien Homestay: a EUR 10 room booked for Sun night, used for the afternoon (shower, bags, rest); also the bed if the bus fails. If the bike shop offers a free shower and bag storage, skip it (ask with the bike). Dinner in town. At the pickup 30+ min early for G8 23:00, which ends at Tam Coc, or Sao Viet 22:00, which ends at Dong Gung bus station in Ninh Binh. Both are lying-down cabins. If the bus fails: Faithien that night, first morning bus.", "stops": ["hagiang", "hanoi2"], "bed": "Night bus to Ninh Binh (a Faithien room in Ha Giang by day: shower, bags, rest)", "bedlink": "https://www.booking.com/hotel/vn/ha-giang-faithien-homestay.en-gb.html?checkin=2027-03-28&checkout=2027-03-29&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-29", "label": "Mon 29", "sleep": "Ninh Binh (Tam Coc)", "cls": "zs", "move": "Off the night bus at Tam Coc about 07:20 (G8), or Dong Gung station about 07:00 (Sao Viet, then a short taxi). Bag drop and early room (ask Mr Thong before), breakfast, sleep until about 11:00. Lunch, pick up the scooter. 15:00 Bich Dong pagoda (open until 17:00), then the Tam Coc to Thung Nham loop until sunset (18:10), village noodles, early bed.", "stops": ["ninhbinh"], "bed": "Mr Thong Homestay, Tam Coc", "bedlink": "https://www.booking.com/hotel/vn/mr-thong-doi-2-tam-coc-motel.en-gb.html?checkin=2027-03-29&checkout=2027-03-31&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-30", "label": "Tue 30", "sleep": "Ninh Binh (Tam Coc)", "cls": "zs", "move": "07:00 Trang An rowed boat, Route 1 (2.5-3.5 h, 9 caves, VND 250k, budget 300k; tour buses come 10:00-13:30). At the gate ask whether the entry ticket is extra and what a kayak costs. 11:00 Hoa Lu old capital next door (1.5 h, VND 20k), lunch. 13:30 ride to Phat Diem stone cathedral (1 h each way). 17:00 Hang Mua (about 500 steps, VND 100k, park in Tam Coc) for sunset at 18:10.", "stops": ["ninhbinh"], "bed": "Mr Thong Homestay, Tam Coc", "bedlink": "https://www.booking.com/hotel/vn/mr-thong-doi-2-tam-coc-motel.en-gb.html?checkin=2027-03-29&checkout=2027-03-31&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-03-31", "label": "Wed 31", "sleep": "Hanoi", "cls": "zh", "move": "07:30 Van Long bamboo rowboat (45-90 min, quiet, langurs), back and pack. Limousine van from Tam Coc about 12:30 (EUR 6-8 each on 12go; confirm the pickup point), bags at La Ava's about 15:00. 15:30 egg coffee at Cafe Dinh. 17:15 Grab to Tan Mai field for B&B FC, the Wednesday 7-a-side at 18:00 (first game free, food and bia hoi with the team after; message them first, this is one organiser's post from Aug 2026; she can play, watch or skip it). Plan B: Temple of Literature night programme 18:00-22:00, Wed, Sat and Sun only, VND 199-299k. Bed about 22:30.", "stops": ["ninhbinh", "hanoi3"], "bed": "La Ava's Home, Hanoi", "bedlink": "https://www.booking.com/hotel/vn/la-avas-home.en-gb.html?checkin=2027-03-31&checkout=2027-04-03&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-04-01", "label": "Thu 1 Apr", "sleep": "Hanoi", "cls": "zh", "move": "06:45 pho at Pho Gia Truyen, 07:15 queue for the Ho Chi Minh Mausoleum (free; opens 07:30 from 1 Apr, Thursday is the day it works: closed Mon and Fri; knees and shoulders covered; 20 min inside, the point is Ba Dinh). 09:45 Imperial Citadel of Thang Long, the old capital (UNESCO). 12:00 banh cuon or bun dau at Co Hoa, rest. 14:30 bus 47 from Long Bien to Bat Trang pottery village (about VND 10k, 45-60 min), a hands-on workshop (VND 50-150k; skip the showroom strip). 16:45 bus back, Long Bien bridge for sunset 18:11. 19:00 cha ca at Thang Long, 21:00 Binh Minh Jazz (live from 21:00 every night, cover about VND 100-150k). Bed 22:30.", "stops": ["hanoi3"], "bed": "La Ava's Home, Hanoi", "bedlink": "https://www.booking.com/hotel/vn/la-avas-home.en-gb.html?checkin=2027-03-31&checkout=2027-04-03&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-04-02", "label": "Fri 2", "sleep": "Hanoi", "cls": "zh", "move": "05:00 Long Bien market, the end of the night trade (closed shoes; porters come first), sunrise 05:49 on the bridge. 06:15 Hoan Kiem Lake: tai chi, aerobics, da cau and badminton on the pavement. 07:00 bun rieu at 11 Hang Bac, nap until 09:45. 10:00 Temple of Literature (VND 70k) and Quan Su Pagoda. 12:00 Bun Cha Ta. 13:30 Vietnam Museum of Ethnology (VND 40k), then Tran Quoc Pagoda and West Lake to sunset, Grab back. 19:00 Hoan Kiem walking street and the night market, eat on the way (food tour instead if you chose one). 21:30 bia hoi at Bia Hoi Doi Moi, away from Ta Hien. SG Arrival Card tonight. Bed 23:00.", "stops": ["hanoi3"], "bed": "La Ava's Home, Hanoi", "bedlink": "https://www.booking.com/hotel/vn/la-avas-home.en-gb.html?checkin=2027-03-31&checkout=2027-04-03&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-04-03", "label": "Sat 3", "sleep": "Singapore", "cls": "zx", "move": "06:30 taxi (about EUR 14, booked the day before) or Grab, 28 km to Noi Bai (there about 07:15), Scoot 09:50, Changi 14:20 (printed Singapore to Vienna ticket and hotel ready). MRT to Bugis, check in 15:30. 16:00 Haji Lane and the Sultan Mosque from outside (inside it is open 10:00-12:00 and 14:00-16:00, closed Fri: arrival is too late). 17:30 Maxwell for Tian Tian chicken rice (closed Mondays; open to 20:00 or sold out). 19:45 Garden Rhapsody, 21:00 Spectra (free), then the club night: Zouk from 22:30 (in before midnight) or Ce La Vi (entry cut-off not confirmed).", "stops": ["sg"], "bed": "Heritage Collection, Kampong Glam", "bedlink": "https://www.booking.com/hotel/sg/heritage-collection-on-kg.en-gb.html?checkin=2027-04-03&checkout=2027-04-06&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-04-04", "label": "Sun 4", "sleep": "Singapore", "cls": "zx", "move": "09:30 to Changi Point (after a club night), bumboat to Pulau Ubin (S$4-5 one way each), bike round the island. Take S$30 cash each: there is no ATM on the island. Back by about 16:00, then eat at Changi Village Hawker Centre by the jetty. Evening: Haji Lane bars or a Geylang supper (hours unconfirmed). No drinking in public 22:30-07:00.", "stops": ["sg"], "bed": "Heritage Collection, Kampong Glam", "bedlink": "https://www.booking.com/hotel/sg/heritage-collection-on-kg.en-gb.html?checkin=2027-04-03&checkout=2027-04-06&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-04-05", "label": "Mon 5", "sleep": "Singapore", "cls": "zx", "move": "08:30 Southern Ridges, Mount Faber to Henderson Waves (leave the hotel 07:45; done before 11:00). 11:00 hawker stop at Hong Lim and one Maxwell stall, about 1.5 h (Tian Tian and several Chinatown Complex stalls are shut on Mondays), then the Chinatown temples. 14:30-16:30 bouldering at Boulder Movement Bugis at the S$20 off-peak rate (one guide gives the off-peak hours as weekdays 11:00-16:30; first-timers reported free shoes). Shower and pack at the hotel (the room is yours until the Tuesday checkout). 17:30 Tekka Centre or Zam Zam for dinner, bags on. MRT to Changi 19:30, Jewel Rain Vortex show 21:00 (free; 20:00 also), then Terminal 1: Scoot counters open 23:45.", "stops": ["sg"], "bed": "Heritage Collection, Kampong Glam", "bedlink": "https://www.booking.com/hotel/sg/heritage-collection-on-kg.en-gb.html?checkin=2027-04-03&checkout=2027-04-06&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"date": "2027-04-06", "label": "Tue 6 Apr", "sleep": "On the plane", "cls": "zx", "move": "Flight 02:45 from Changi Terminal 1, home 08:55. Not covered by EU261, unlike the flight out.", "stops": [], "bed": null, "bedlink": null}], "flights": [{"route": "Vienna to Krabi", "how": "Scoot via Changi on one booking, 19 h 45 (6 h 15 wait airside)", "when": "Sun 14 Mar 10:00, lands Mon 15 11:45", "eur": 329, "status": "buy", "link": "https://www.google.com/travel/flights?q=One%20way%20flights%20from%20VIE%20to%20KBV%20on%202027-03-14&curr=EUR&hl=en"}, {"route": "Krabi to Hanoi", "how": "Thai AirAsia via Bangkok DMK, 6 h 40 (3 h 30 wait at DMK)", "when": "Wed 24 Mar 13:35, lands 20:15", "eur": 112, "status": "buy", "link": "https://www.google.com/travel/flights?q=One%20way%20flights%20from%20KBV%20to%20HAN%20on%202027-03-24&curr=EUR&hl=en"}, {"route": "Hanoi to Singapore", "how": "Scoot nonstop, 3 h 30 in the air; 06:30 taxi to 14:20 at Changi", "when": "Sat 3 Apr 09:50", "eur": 75, "status": "buy", "link": "https://www.google.com/travel/flights?q=One%20way%20flights%20from%20HAN%20to%20SIN%20on%202027-04-03&curr=EUR&hl=en"}, {"route": "Singapore to Vienna", "how": "Scoot nonstop, 12 h 10", "when": "Tue 6 Apr 02:45, home 08:55", "eur": 280, "status": "buy", "link": "https://www.google.com/travel/flights?q=One%20way%20flights%20from%20SIN%20to%20VIE%20on%202027-04-06&curr=EUR&hl=en"}], "otherdays": [["Fri 12 Mar out", "Qatar + Thai, 2 stops, 17 h 55", 550, "No Scoot. 221 more for nothing"], ["Sun 14 Mar out", "Scoot 19 h 45, lands Mon 15 at 11:45", 329, "The plan"], ["Mon 15 Mar out", "Qatar + Thai, 2 stops", 518, "No Scoot that day. Loses a day, 189 more"], ["Tue 16 Mar out", "Scoot 19 h 45", 329, "Loses an island day, saves nothing"], ["Tue 6 Apr back", "Scoot nonstop 02:45", 280, "Settled: Thu 8 ruled out"]], "flightsnote": "One adult, one way, cheapest fares read on 3-4 Nov 2026 (Krabi to Hanoi showed 122 on 3 Nov and 112 on 4 Nov: re-read it when you buy). An extra island day is about EUR 80 and an extra Singapore day EUR 110 (room share, food, one activity; estimate). No other airline to Krabi is cheaper: the nearest are Air Arabia to Phuket at 457 (13 h 55, adds a road leg) and Mon 15 Qatar + Thai at 518 (loses a day). The 10:00 out and the 02:45 home are the only Scoot times, so the early hours cannot be avoided.", "rooms": [{"stop": "Ao Nang", "prop": "Baan Thara Guesthouse", "room": "Budget Double or Twin, ensuite, AC, 19 m2", "dates": "15-18 Mar", "eur": 110, "cancel": "free until 13 Mar", "link": "https://www.booking.com/hotel/th/baan-thara-guesthouse-nopprarat-thara-beach-aonang-krabi.en-gb.html?checkin=2027-03-15&checkout=2027-03-18&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"stop": "Koh Mook", "prop": "Kookkai Bungalows (Booking: Mook Bamboo Bungalows)", "room": "Bungalow with Garden View, 24 m2, breakfast", "dates": "18-20 Mar", "eur": 64, "cancel": "free until 15 Mar", "link": "https://www.booking.com/hotel/th/kookkai-bungalows.en-gb.html?checkin=2027-03-18&checkout=2027-03-20&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"stop": "Koh Lanta", "prop": "Cat Bungalow", "room": "Standard Double with Fan, breakfast", "dates": "20-24 Mar", "eur": 80, "cancel": "free until 19 Mar", "link": "https://www.booking.com/hotel/th/cat-bungalow.en-gb.html?checkin=2027-03-20&checkout=2027-03-24&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"stop": "Ha Giang", "prop": "Faithien Homestay", "room": "Double Room with Mountain View", "dates": "Wed 24 Mar", "eur": 10, "cancel": "free until 22 Mar", "link": "https://www.booking.com/hotel/vn/ha-giang-faithien-homestay.en-gb.html?checkin=2027-03-24&checkout=2027-03-25&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"stop": "Ha Giang", "prop": "Happy Homestay Du Gia", "room": "Double Room, breakfast", "dates": "Thu 25 Mar", "eur": 14, "cancel": "free until 23 Mar", "link": "https://www.booking.com/hotel/vn/happy-homestay-du-gia-yen-minh.en-gb.html?checkin=2027-03-25&checkout=2027-03-26&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"stop": "Ha Giang", "prop": "Xua Vu Homestay", "room": "Double with Garden View", "dates": "Fri 26 Mar", "eur": 17, "cancel": "free until 18 Mar", "link": "https://www.booking.com/hotel/vn/xua-vu-homestay.en-gb.html?checkin=2027-03-26&checkout=2027-03-27&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"stop": "Ha Giang", "prop": "ToTo-Chan Hotel", "room": "Standard Double, breakfast", "dates": "Sat 27 Mar", "eur": 15, "cancel": "free until 24 Mar", "link": "https://www.booking.com/hotel/vn/toto-chan.en-gb.html?checkin=2027-03-27&checkout=2027-03-28&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"stop": "Ha Giang", "prop": "Faithien Homestay", "room": "Double Room with Mountain View (booked for Mon night, used for the afternoon: shower, bags, rest; also the bed if the bus fails; skip it if the bike shop offers a free shower and bag storage)", "dates": "Sun 28 Mar", "eur": 10, "cancel": "free until 26 Mar", "link": "https://www.booking.com/hotel/vn/ha-giang-faithien-homestay.en-gb.html?checkin=2027-03-28&checkout=2027-03-29&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"stop": "Ninh Binh", "prop": "Mr Thong Homestay", "room": "King Room with Garden View, breakfast", "dates": "29-31 Mar", "eur": 31, "cancel": "free until 27 Mar", "link": "https://www.booking.com/hotel/vn/mr-thong-doi-2-tam-coc-motel.en-gb.html?checkin=2027-03-29&checkout=2027-03-31&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"stop": "Hanoi", "prop": "La Ava's Home", "room": "Deluxe Double Room, ensuite, 28 m2", "dates": "31 Mar-3 Apr (3 nights)", "eur": 87, "cancel": "free until 29 Mar", "link": "https://www.booking.com/hotel/vn/la-avas-home.en-gb.html?checkin=2027-03-31&checkout=2027-04-03&group_adults=2&no_rooms=1&selected_currency=EUR"}, {"stop": "Singapore", "prop": "Heritage Collection on Kampong Glam", "room": "Loft (Skylight)", "dates": "3-6 Apr", "eur": 349, "cancel": "non-refundable", "link": "https://www.booking.com/hotel/sg/heritage-collection-on-kg.en-gb.html?checkin=2027-04-03&checkout=2027-04-06&group_adults=2&no_rooms=1&selected_currency=EUR"}], "todo": [{"kind": "buy", "title": "Buy the firm flights", "body": "Vienna to Krabi Sun 14 Mar 329, Krabi to Hanoi 112 and Hanoi to Singapore Sat 3 Apr 09:50 75: EUR 516 each. Singapore to Vienna Tue 6 Apr 02:45 (280) for her now, and for you too unless you stay on after Singapore. Buy Vienna to Krabi as ONE Scoot booking through Changi and ask for both boarding passes at Vienna check-in: then Mon 15 Mar stays airside and you never enter Singapore (<a href=\"https://www.ica.gov.sg/information-and-e-services/entry-and-departure/entering-singapore/transit-through-singapore\" target=\"_blank\" rel=\"noopener\">ICA transit page</a>). Krabi to Hanoi showed 122 on 3 Nov and 112 on 4 Nov: re-read the fare when you buy. If Scoot cancels the Hanoi flight, Vietnam Airlines Sat 10:50 (EUR 96 on 4 Nov) is the fallback. Bags: 7 kg for the Thai AirAsia leg (cabin bag and personal item together), or the AirAsia Xtra Carry-On (14 kg, pre-booked; price at booking) instead of a checked bag.", "due": "now", "link": "https://www.google.com/travel/flights?q=One%20way%20flights%20from%20VIE%20to%20KBV%20on%202027-03-14&curr=EUR&hl=en", "linktext": "Open Google Flights"}, {"kind": "ask", "title": "Check your residence cards (yours and hers)", "body": "The date printed must run past Tue 6 Apr 2027. If it is the temporary-protection card: the EU extended that protection to 4 Mar 2028 (decision of 30 Jul 2026), but a card still printed 4 Mar 2027 needs renewing before Sun 14 Mar. Leaving Austria for 24 days does not end an existing protection status under the EU decision (it applies to people who keep the status continuously); if unsure, ask the BFA in writing. If your status is something else (work or study permit), check its date the same way.", "due": "now", "link": "https://eur-lex.europa.eu/eli/dec_impl/2026/1912/oj/eng", "linktext": "EU decision 2026/1912"}, {"kind": "decide", "title": "Hong Islands: group tour or private longtail", "body": "Group tour about EUR 34-37 each (68-74 for two). Private longtail THB 2,500-2,800 a boat plus park fee, about EUR 84-92 for two, your own pace. Ask at the Ao Nang ticket booth for a shared boat (one report of THB 300 return, unconfirmed). Fits Wed 17 instead of the climbing half day: back about 15:30, market after. The park fee (THB 300 each) may be extra.", "due": "before Wed 17 Mar"}, {"kind": "decide", "title": "Mook, Friday morning: add the dugong boat before Kradan and Ngai?", "body": "The dugong boat with a spotter (about 07:30-09:30) can go before Kradan and Ngai at 10:00, not instead of it. A March 2024 trip report found dugongs off Mook now (3 and 4 seen). Price: ask Kookkai on Thu evening. The cave is at 14:30 either way.", "due": "Thu evening 18 Mar"}, {"kind": "decide", "title": "Paid fishing trip on Lanta, yes or no", "body": "A resort boat is about THB 4,750 for two (6 h, a meal); a private longtail about USD 200 each; the village price at Saladan pier or Old Town is still to be asked.", "due": "by Sat 20 Mar"}, {"kind": "decide", "title": "Hanoi food tour: paid small group or free Hanoikids", "body": "Paid small group EUR 14-21 each, walk up the same day. Hanoikids is free student guides but needs booking ahead. The day plan holds Thu 1 evening (cha ca, jazz) and Fri 2 evening without one; a tour takes either.", "due": "before Thu 1 Apr"}, {"kind": "decide", "title": "Your own flight home, and Vova", "body": "Singapore to Vienna (280) is settled for her. Yours waits only if you stay on after Singapore; then you still need an onward air ticket before Hanoi check-in on 3 Apr (entry on 3 Apr needs one within 96 hours). If Vova joins at Singapore, he needs his own onward ticket the same way.", "due": "before 3 Apr"}, {"kind": "ask", "title": "Insurance: Genki, ÖAMTC or PrivatBank, in writing", "body": "Ask all three now: does it cover a 125 cc on Ha Giang roads without a motorcycle licence, and evacuation from Ha Giang to Hanoi, and which home country applies? World Nomads and SafetyWing do not cover it. Genki excludes unsupervised off-road. PrivatBank's <a href=\"https://privatbank.ua/strakhuvannia/turystychne\" target=\"_blank\" rel=\"noopener\">travel policy in Privat24</a> (insurer ETS, EUR 30,000-75,000) counts scooters as active tourism, so take a +S programme (Classic+S or Gold+S). Its accident part excludes riding without the right licence, the medical part has no such line, but it can refuse for an illegal act, so ask ETS that exact question. Also ask whether a policy starting outside Ukraine is accepted, and note evacuation needs the assistance company's written approval first. The price shows only in your login. Khrystyna rides pillion, so the licence line does not touch her. Price: read at purchase.", "due": "before Sun 14 Mar (first scooter Mon 15 Mar)"}, {"kind": "ask", "title": "Ask ICA about the 96-hour transit rule before buying the Singapore loft", "body": "Use the ICA enquiry form (ask.gov.sg/ica) to confirm that the 96-hour Visa-Free Transit Facility applies to a Ukrainian passport on a 60 h stay. The officer decides at the border, and the loft is non-refundable.", "due": "before booking the Singapore loft"}, {"kind": "book", "title": "Book the rooms; all but the Singapore loft have free cancellation", "body": "Do not book until you know whether friends join: the rooms are for two. See the Book tab for the 11 bookings and their cancel-by dates. Book Dong Van (Sat 27) first, it anchors the Sunday market. The Singapore loft is non-refundable: book it after the flights.", "due": "after the flights"}, {"kind": "do", "title": "Vietnam e-visa", "body": "evisa.gov.vn only (no agents), USD 25, name exactly as in the passport, apply about 3 weeks early. Pick Noi Bai as the entry AND the exit port, validity from 24 Mar to a few days after 3 Apr, and print it. Optional: the Vietnam pre-arrival declaration at prearrival.immigration.gov.vn.", "due": "by 28 Feb", "link": "https://evisa.gov.vn/", "linktext": "evisa.gov.vn"}, {"kind": "do", "title": "Travel doctor", "body": "Hepatitis A and rabies, 6+ weeks out.", "due": "by 31 Jan"}, {"kind": "do", "title": "Thailand TDAC and Singapore arrival card", "body": "Both free. Thai TDAC on tdac.immigration.go.th, Fri 12 or Sat 13 Mar (the arrival day counts and you fly Sun 14). SG Arrival Card on ica.gov.sg only, Thu 1 or Fri 2 Apr (do it Fri evening in Hanoi).", "due": "Fri 12-Sat 13 Mar; Thu 1-Fri 2 Apr"}], "ask": ["Two Ha Giang bike shops on WhatsApp before Thu 25, Hung Cuong first and HagiangGo second: a semi-automatic 125 cc from Thu 09:30 to Sun 15:30 (one bike, two-up) and whether the shop bills per 24 h, a cash deposit instead of the passport, free bag storage, a free shower on Sun 28 afternoon (if yes, skip the Faithien room that night), a pre-paid fine option, who comes if the bike breaks, and where the Sao Viet or G8 pickup is on Sun 28.", "Cat Bungalow: pier pickup on Sat 20, and whether the Jijie van (07:00 on 12go) collects at the bungalow on Wed 24 (the hotel pickup is not stated; fallback: a private SUV, about EUR 60 a car).", "Kookkai Bungalows: the Emerald Cave boat time on Fri 19 Mar (low water is about 14:45) and the boatman's price for 14:30; agree both Friday boat times on Thu evening (Fri midday is prayer time); a village agent for the Mook to Lanta boat on Sat (11:00 or 14:00).", "Thai AirAsia in writing: is Krabi to Hanoi one Fly-Thru ticket, with bags and immigration handled at Bangkok? And what does the Xtra Carry-On (14 kg) cost?", "Mu Ko Lanta park HQ, +66 75 656 576: confirm the gate hours (16:30 or 17:30 is given).", "Mr Thong Homestay: bag drop and an early room on Mon 29 at about 07:30 if you arrive off the night bus (about 07:20). If not, a Sun 28 night there is about EUR 16 a room (not in the total).", "Faithien Homestay: you arrive about 06:00 on Thu 25 off the night bus (booked Wed 24): straight to the room for a nap until 09:00?", "B&B FC on r/hanoi: is the Wednesday 18:00 game at Tan Mai on for Wed 31 Mar, and can two visitors join?"], "gaps": ["March 2027 times and fares: Mook to Lanta boat (11:00 and 14:00 on a November date), the Hanoi to Ha Giang bus (09:30), the night buses back (22:00, 23:00; arrival 07:00-07:20), the Tam Coc to Hanoi limousine van (about 12:30) and the SE18 train as fallback (arrives about 14:10), the Jijie van pickups at Ao Nang (07:00) and Lanta (07:00).", "Tides: low tide at Ao Nang on 15 Mar; the Emerald Cave boat time on 19 Mar is for Kookkai to confirm. Ao Nang beach has no pier, you may wade.", "Room types and prices were not all read for your dates: open each booking page again before paying.", "Opening hours: Lanta Muay Thai class times, the Boulder Movement off-peak hours on Mon 5 Apr (one guide says weekdays 11:00-16:30).", "Prices not found: fishing from the village, the dugong boat from Mook, the Van Long boat. Not agreed: Khao Mai Kaew entry (THB 200-300), Hong park fee (THB 300 each).", "Scooter prices for 110-160 cc only traveller accounts for Mook, Ninh Binh and Java, no shop quotes.", "Some place tags show no posts yet.", "The workation after Singapore (where, how long, with whom) is not decided."], "money": {"rows": [["Four flights", 796, "329 + 112 + 75 + 280. Krabi to Hanoi showed 122 on 3 Nov and 112 on 4 Nov: re-read it when you buy. Your 280 drops out if you stay on after Singapore"], ["Rooms, two sharing", 394, "787 for the 11 bookings (110 + 64 + 80 + 10 + 14 + 17 + 15 + 10 + 31 + 87 + 349), halved: 393.5; Faithien Wed 24 and Sun 28, Ninh Binh 2 nights, Hanoi 3 nights"], ["Boats, vans, buses, trains", "118-129", "estimate, each: Krabi airport to Ao Nang van 3-4, Wed 17 Railay boat 5 (Tue's is in Activities), Ao Nang to Mook van + boat 21, Mook to Lanta 24 (a village agent may be cheaper), Lanta to the airport van 11, Wed 24 night bus 18-20, Sun 28 night bus 20-26, Tam Coc to Hanoi van on Wed 31 6-8, Noi Bai taxi 7, Changi to Bugis MRT 3. Short rides in towns are not priced"], ["Scooters and petrol", "48-56", "estimate, each: 11 bike days, one bike shared by two (Ha Giang 4, Lanta 4, Krabi 1, Ninh Binh 2). Half of rentals 80-95 (Ha Giang EUR 10-12 a day, Lanta and Krabi THB 250, Ninh Binh VND 100-200k) plus half of petrol about 15"], ["Food", "500-750", "estimate: Thailand 25-35 a day, Vietnam 15-25, Singapore 35-50"], ["Activities, every Do item", "206-289", "THB 5,050-7,520 + VND 1,020-1,300k + SGD 52-64 each, from the Do items on the days (Skyway S$14 included; the gym at the S$20 off-peak rate; Ubin bumboat return and a bike); scooter rentals are in the row above and food stops in Food. Not in it (your calls): Hong Islands group tour, net -6 to +13 against the climbing day it replaces; Hanoi paid food tour, net +11 to +18; fishing about +63 (resort boat split in two); the cooking class about +53. Without Koh Rok and the gym about 67-104 less"], ["Insurance, e-visa, permit, ATM, data, laundry", "116-253", "insurance 35-110, e-visa 22, Ha Giang permit 9, ATM 10-20, data 30-72, laundry 10-20"], ["Ha Giang police fine", "0-52", "VND 0-3M for the one bike, split by two. About 8 in 10 who posted were stopped, 11 of 40 stopped riders paid nothing; ask the shop about a pre-paid fine"]], "total": "2178-2719", "note": "Not in it: vaccines (hep A + rabies about EUR 319 at German prices, if the travel doctor advises them), the Hong park fee if the tour leaves it out (THB 300 each, about +8), your open calls (Hong Islands, food tour, fishing), staying on after Singapore (replaces the 280 flight home), the Vienna airport transfer and the AirAsia Xtra Carry-On (prices unknown), a short taxi from Ninh Binh city to Tam Coc after the night bus (price not checked), and a Sun 28 night at Mr Thong for an early room (about 16 a room). The Ha Giang fine is in the total at its top end. A Hanoi room on Wed 24 (about 26) only if the night bus is missed."}, "info": [{"title": "Entry", "items": ["Thailand: 30 days visa-free for Ukrainian passports, plus the free TDAC card (tdac.immigration.go.th) on Fri 12 or Sat 13 Mar (the arrival day counts). Show proof of funds if asked and carry the printed Krabi to Hanoi ticket as the onward ticket.", "Vietnam: e-visa USD 25 on evisa.gov.vn only. Pick Noi Bai as entry AND exit, validity 24 Mar to a few days after 3 Apr, name exactly as in the passport, apply about 3 weeks early, print it. Optional: the pre-arrival declaration at prearrival.immigration.gov.vn.", "Singapore: Ukrainian passports need a visa, and this stay is covered by the 96-hour Visa-Free Transit Facility instead (Ukraine is on its list): a confirmed onward air ticket out within 96 hours (the Tue 6 Apr 02:45 flight, 60 h after landing) and the free SG Arrival Card on ica.gov.sg only, Thu 1-Fri 2 Apr. Print the Singapore to Vienna ticket and the hotel booking.", "Mon 15 Mar at Changi: book Vienna to Krabi as one Scoot booking and ask for both boarding passes at Vienna check-in. Stay airside and you never enter Singapore: no arrival card and no use of the 96-hour rule. Two separate tickets would force immigration. <a href=\"https://www.ica.gov.sg/information-and-e-services/entry-and-departure/entering-singapore/transit-through-singapore\" target=\"_blank\" rel=\"noopener\">ICA transit page</a>", "Carry printed: Krabi to Hanoi ticket, e-visa, Hanoi to Singapore and Singapore to Vienna tickets, hotel bookings. Thailand, Vietnam and Singapore expect 6 months of validity: yours must run to at least early Oct 2027.", "Fake paid sites exist for all three, charging USD 20-90."]}, {"title": "Scooters", "items": ["Shops rent without a licence or IDP in every account found. Give cash, not the passport: a shop held a passport and quoted THB 5,000 for scratches.", "Krabi and Lanta: few stops, fine THB 500-2,000. Ha Giang: about 8 in 10 self-riders who posted were stopped, VND 2M (about EUR 69) is the usual payment, budget 2-3M for the bike.", "Insurance: nobody checks until a crash, then the policy is void. World Nomads and SafetyWing require the right licence class. Genki Traveler reportedly covers a light motorcycle without a licence: get it in writing."]}, {"title": "Phone and money", "items": ["Your Airalo Asialink eSIM lists Thailand, Vietnam and Singapore. Check the price and hotspot terms in the app. Backup: a Viettel SIM at Noi Bai baggage claim, about EUR 10, works in Ha Giang.", "Thai ATMs charge a flat THB 220-350 a withdrawal (AEON ATMs THB 150): take the maximum once and refuse the ATM conversion. Mook has one ATM that can run dry: withdraw once in Ao Nang on Mon 15 and bring enough for Mook (THB 6,000-8,000 for two).", "Take VND 5-8M from a VPBank ATM in Ha Giang town on Thu morning. On the loop only Ha Giang town, Dong Van and Meo Vac have ATMs, none in Du Gia."]}, {"title": "Pack and health", "items": ["Pack to 7 kg from day one: Thai AirAsia counts the cabin bag and personal item together and gate weighing is reported; the Xtra Carry-On (14 kg, pre-booked) is the alternative to a checked bag. Scoot allows 10 kg in two pieces. No tent: one backpack.", "Ha Giang in late March: nights under 10 C on 16-26% of days, smoke at Dong Van. Mask, warm layer, goggles, check the air index a week out.", "Vapes are banned in Thailand and Singapore. Travel doctor 6+ weeks out.", "Laundry: Lanta, 20-23 Mar. Rest: Mon 15 afternoon only."]}, {"title": "Arrivals and flights", "items": ["Krabi: shared van or bus (THB 100-150 each) or Grab, never a THB 1,600 hotel transfer.", "Noi Bai: never go with a driver who approaches you (550k asked for a 300k ride). Wed 24 you leave on the Sao Viet bus from the airport itself; Grab in the app only if the bus is missed.", "The flight out on 14 Mar is covered by EU261: if it lands 3 h or more late you can claim compensation, up to EUR 600 each (check Regulation 261/2004 on EUR-Lex). The flight home from Singapore is not covered.", "Night buses: be at the pickup 30+ min early. Rentals: film the bike, cash deposit, never the passport.", "A hotel message on WhatsApp asking you to confirm your card after a booking is a scam."]}, {"title": "Time and light", "items": ["Thailand and Vietnam are 6 h ahead of Vienna until Sun 28 Mar, then 5 h. Singapore one hour more.", "Sunrise and sunset: Ao Nang 06:32 to 18:36, Ha Giang and Dong Van about 05:57 to 18:12, Hanoi about 05:55 to 18:10, Singapore 07:04 to 19:12.", "Work: not planned yet. Blocks get placed once the route is final."]}, {"title": "Weather by stop", "items": ["Hanoi (24-25 Mar, 2-3 Apr): about the same rain on either set of dates.", "Ha Giang and Dong Van: wet either way, heavy rain on 43-47% of days. Dong Van nights fall under 12 C on about 13% of days in late March and early April.", "Ninh Binh (29-31 Mar): about the same as Hanoi.", "Singapore (3-6 Apr): heavy rain on 38-42% of days from 27 Mar, against 22% in mid-March. Keep a rain plan; the Southern Ridges and the Skyway shut in rain."]}]};
const $ = s => document.querySelector(s);
const ST = Object.fromEntries(T.stops.map(s => [s.id, s]));
const VERD = [['do', 'Do'], ['fine', 'Fine'], ['idea', 'Idea'], ['skip', 'Skip']];
const ICON = {
  now: '<path d="M12 7v5l3 2"/><circle cx="12" cy="12" r="9"/>',
  days: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/>',
  places: '<path d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/>',
  book: '<path d="M4 7h16v12H4zM8 7V5h8v2M4 12h16"/>',
  info: '<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>'
};
const VIEWS = [['now', 'Now'], ['days', 'Days'], ['places', 'Places'], ['book', 'Book'], ['info', 'Info']];
let FRAMED = false; try { FRAMED = window.self !== window.top; } catch (e) { FRAMED = true; }
const show = { do: true, fine: true, idea: true, skip: false };

const A = (u, t, cls) => u ? `<a ${cls ? `class="${cls}" ` : ''}href="${u}" target="_blank" rel="noopener">${t}</a>` : '';
const iso = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const dnum = s => Math.round(new Date(s + 'T12:00:00').getTime() / 864e5);
const nightsOf = s => dnum(s.to) - dnum(s.from_);
const eur = n => 'EUR ' + n;
const short = s => s.short || s.name;
const svg = k => `<svg viewBox="0 0 24 24" aria-hidden="true">${ICON[k]}</svg>`;
const fmt = (s, o) => new Date(s + 'T12:00:00').toLocaleDateString('en-GB', o);
const qs = new URLSearchParams(location.search);
const today = () => qs.get('today') || iso(new Date());
const dayIdx = d => T.days.findIndex(x => x.date === d);
const flightOn = d => T.flights.find(f => f.when.startsWith(fmt(d, { weekday: 'short' }) + ' ' + fmt(d, { day: 'numeric' }) + ' '));

function see(it) {
  const l = [];
  if (it.link) l.push(A(it.link, 'Open'));
  if (it.map) l.push(A(it.map, 'Map'));
  (it.tags || []).forEach(t => l.push(A(`https://www.instagram.com/explore/tags/${t}/`, '#' + t)));
  (it.links || []).forEach(x => l.push(A(x.url, x.label)));
  return l.length ? `<div class="see">${l.join('')}</div>` : '';
}
const val = x => x && x !== '-' ? x : '';
function item(it) {
  const meta = [val(it.dur) && `<b>${it.dur}</b>`, val(it.cost)].filter(Boolean).join(' · ');
  return `<div class="it ${it.v}"><div class="t"><b>${it.name}</b><span class="pill ${it.v}">${VERD.find(v => v[0] === it.v)[1]}</span></div>
  ${meta ? `<div class="meta">${meta}</div>` : ''}${val(it.note) ? `<div class="note">${it.note}</div>` : ''}${see(it)}</div>`;
}
function mini(it) {
  return `<div class="mi"><b>${it.name}</b>${val(it.dur) ? `<span class="muted small"> · ${it.dur.split(/[:,(]/)[0]}</span>` : ''}${see(it)}</div>`;
}
function strip() {
  const st = T.stops.map(s => ({ s, n: Math.max(nightsOf(s), 1) }));
  return `<div class="strip">${st.map(x => `<a class="${x.s.cls}" style="flex:${x.n}" href="#places/${x.s.id}" title="${x.s.name}"></a>`).join('')}</div>
  <div class="striplab">${st.map(x => `<span style="flex:${x.n}">${x.n > 1 ? short(x.s) : ''}</span>`).join('')}</div>`;
}
function bedCard(x) {
  return `<div class="bed"><div class="n"><div class="lead">${x.name}</div><div class="note">${x.note}</div></div><div><span class="price">${eur(x.price)}</span><div class="acts">${A(x.link, 'Open', 'btn')}${A(x.map, 'Map', 'btn alt')}</div></div></div>`;
}
function sleepBlock(s) {
  const p = s.sleep.filter(x => x.primary), alt = s.sleep.filter(x => !x.primary);
  return `${p.length ? `<div class="card">${p.map(bedCard).join('<hr style="border:0;border-top:1px solid var(--line);margin:12px 0">')}</div>` : ''}
  ${alt.length ? `<details><summary>${alt.length} other ${alt.length > 1 ? 'options' : 'option'}</summary>${alt.map(x => `<div class="card">${bedCard(x)}</div>`).join('')}</details>` : ''}
  ${s.sleepnote ? `<p class="note">${s.sleepnote}</p>` : ''}`;
}
const legs = s => s.legs.length ? `<div class="card">${s.legs.map(l => `<div class="leg"><b>${l.leg}</b>${l.how}${val(l.note) ? `<div class="note">${l.note}</div>` : ''}</div>`).join('')}</div>` : '';
function todoCard(x) {
  return `<div class="card"><div style="display:flex;gap:8px;align-items:center"><span class="pill ${x.kind}">${x.kind}</span><span class="muted small">${x.due}</span></div><div class="lead">${x.title}</div><div class="small">${x.body}</div>${x.link ? `<div class="acts">${A(x.link, x.linktext || 'Open', 'btn alt')}</div>` : ''}</div>`;
}

/* ---------- views ---------- */
function vNow() {
  const t = today(), start = T.meta.start;
  if (t < start) {
    const n = dnum(start) - dnum(t), f = T.flights[0];
    return `<div class="card"><p class="kick">Before the trip</p><p class="big">${n} days</p><p class="small muted" style="margin:0">until ${f ? f.route + ', ' + f.when : fmt(start, { weekday: 'short', day: 'numeric', month: 'short' })}</p>${strip()}</div>
    <h3>Decide and do next</h3><div class="grid2">${T.todo.map(todoCard).join('')}</div>
    <p class="small"><a href="#day/${T.days[0].date}">Open day 1</a> · <a href="#days">All ${T.days.length} days</a></p>`;
  }
  if (dayIdx(t) < 0) return `<div class="card"><p class="lead">The trip is over.</p></div><p><a href="#days">All days</a></p>`;
  return vDay(t, true);
}
function vDay(date, isNow) {
  const i = dayIdx(date); if (i < 0) return vDays();
  const d = T.days[i], pv = T.days[i - 1], nx = T.days[i + 1], fl = flightOn(date);
  const mains = d.stops.map(id => ST[id]).filter(Boolean);
  const pager = `<div class="pager">${pv ? `<a href="#day/${pv.date}">&larr; ${pv.label}</a>` : '<span></span>'}${nx ? `<a href="#day/${nx.date}">${nx.label} &rarr;</a>` : '<span></span>'}</div>`;
  return `${isNow ? '' : `<a class="back" href="#days">&larr; All days</a>`}
  <div class="card ${d.cls} ${date === today() ? 'today' : ''}"><p class="kick">Day ${i + 1} of ${T.days.length}${date === today() ? ' · today' : ''}</p><p class="lead" style="font-size:1.55rem">${fmt(date, { weekday: 'long', day: 'numeric', month: 'long' })}</p>
    <div style="margin-top:6px"><i class="dd ${d.cls}"></i><b>${d.sleep}</b></div>
    ${d.bed ? `<div class="bed" style="margin-top:10px;align-items:center"><div class="n small">Tonight: <b>${d.bed}</b></div>${A(d.bedlink, 'Open booking', 'btn alt')}</div>` : ''}</div>
  <div class="card"><p class="kick">The move</p><div>${d.move}</div>${fl ? `<div style="margin-top:8px" class="small"><b>${fl.route}</b>, ${fl.how}. ${fl.when}. ${A(fl.link, 'Flights')}</div>` : ''}</div>
  ${mains.map(s => `${s.menu.some(m => m.v === 'do') ? `<h3>${short(s)}: the Do list</h3><div class="card mis">${s.menu.filter(m => m.v === 'do').map(mini).join('')}</div>` : ''}
    ${s.legs.length ? `<details><summary>Getting there and away: ${short(s)}</summary>${legs(s)}</details>` : ''}
    <p class="small"><a href="#places/${s.id}">${short(s)}: rooms, every option, notes &rarr;</a></p>`).join('')}
  ${pager}`;
}
function vDays() {
  const t = today();
  let html = `<h2>${T.days.length} days</h2>`, cur = null;
  T.days.forEach(d => {
    const key = d.stops[d.stops.length - 1] || d.date;
    if (key !== cur) {
      if (cur !== null) html += '</div>';
      const s = ST[d.stops[d.stops.length - 1]];
      html += `<div class="grp ${d.cls}"><b>${s ? short(s) : d.sleep}</b> <span class="muted small">${s ? s.nights : ''}</span></div><div class="card" style="padding-block:2px">`;
      cur = key;
    }
    html += `<a class="row ${d.date === t ? 'cur' : ''}" href="#day/${d.date}"><span class="d">${fmt(d.date, { day: 'numeric' })} ${fmt(d.date, { month: 'short' })}<small>${fmt(d.date, { weekday: 'short' })}</small></span><span class="b"><b>${d.sleep}</b><div class="mv">${d.move}</div>${d.bed ? `<div class="mv bedl">Bed: ${d.bed}</div>` : ''}</span><span class="go">&rsaquo;</span></a>`;
  });
  return html + '</div>';
}
function vPlaces() {
  return `<h2>Places</h2><div class="grid2">${T.stops.map(s => {
    const pick = s.sleep.find(x => x.primary), nd = s.menu.filter(m => m.v === 'do').length;
    return `<a class="card stopcard ${s.cls}" href="#places/${s.id}"><div class="lead">${s.name}<span>${s.nights}</span></div><div class="small muted">${s.dates}</div>
      <div class="small" style="margin-top:4px">${nd ? nd + ' to do' : 'Transit'}${pick ? ' · ' + pick.name.replace(/^Pick: /, '').split(/[,(]/)[0].trim() : ''}</div></a>`;
  }).join('')}</div>`;
}
function vStop(id) {
  const s = ST[id]; if (!s) return vPlaces();
  const i = T.stops.indexOf(s), pv = T.stops[i - 1], nx = T.stops[i + 1];
  const rows = s.menu.filter(m => show[m.v]);
  const counts = Object.fromEntries(VERD.map(v => [v[0], s.menu.filter(m => m.v === v[0]).length]));
  return `<a class="back" href="#places">&larr; All places</a>
  <h2 style="margin-top:8px"><i class="dd ${s.cls}"></i>${s.name}</h2><p class="muted small" style="margin-top:-4px">${s.dates} · ${s.nights}</p>
  <div class="card"><p class="kick">Time you have</p><div class="small">${s.avail}.</div><p class="kick" style="margin-top:10px">Does the length hold?</p><div class="small">${s.fit}</div>${see({ tags: s.tags })}</div>
  <h3>Days here</h3><div class="card" style="padding-block:2px">${T.days.filter(d => d.stops.includes(s.id)).map(d => `<a class="row" href="#day/${d.date}"><span class="d">${fmt(d.date, { day: 'numeric' })} ${fmt(d.date, { month: 'short' })}<small>${fmt(d.date, { weekday: 'short' })}</small></span><span class="b"><div>${d.move}</div>${d.bed ? `<div class="mv">Bed: ${d.bed}</div>` : ''}</span><span class="go">&rsaquo;</span></a>`).join('')}</div>
  ${s.menu.length ? `<h3>What to do</h3><div class="chips">${VERD.filter(v => counts[v[0]]).map(v => `<button class="chip" aria-pressed="${show[v[0]]}" data-f="${v[0]}">${v[1]} ${counts[v[0]]}</button>`).join('')}</div>
    <div class="grid2">${rows.map(item).join('') || '<p class="note">Nothing in this filter.</p>'}</div>` : ''}
  <h3>Where to sleep</h3>${sleepBlock(s)}
  ${s.legs.length ? `<h3>Getting there and away</h3>${legs(s)}` : ''}
  ${s.extra ? `<div class="card">${s.extra}</div>` : ''}
  <div class="pager">${pv ? `<a href="#places/${pv.id}">&larr; ${short(pv)}</a>` : '<span></span>'}${nx ? `<a href="#places/${nx.id}">${short(nx)} &rarr;</a>` : '<span></span>'}</div>`;
}
function vBook() {
  const m = T.money;
  const fl = T.flights.map(f => `<div class="card"><div style="display:flex;gap:8px;align-items:center"><span class="pill ${f.status}">${f.status === 'buy' ? 'buy now' : 'wait'}</span><span class="muted small">${f.when}</span></div><div class="bed"><div class="n"><div class="lead">${f.route}</div><div class="small muted">${f.how}</div></div><div><span class="price">${eur(f.eur)}</span><div class="acts">${A(f.link, 'Google Flights', 'btn alt')}</div></div></div></div>`).join('');
  const rooms = T.rooms.map(r => `<div class="card"><div class="bed"><div class="n"><div class="small muted">${r.stop} · ${r.dates}</div><div class="lead">${r.prop}</div><div class="small">${r.room}</div><div class="note">${r.cancel}</div></div><div><span class="price">${eur(r.eur)}</span><div class="acts">${A(r.link, 'Open', 'btn alt')}</div></div></div></div>`).join('');
  const od = `<div class="tw"><table><thead><tr><th>Day</th><th>Flight</th><th class="n">EUR</th><th>Effect</th></tr></thead><tbody>${T.otherdays.map(r => `<tr><td>${r[0]}</td><td>${r[1]}</td><td class="n">${r[2]}</td><td>${r[3]}</td></tr>`).join('')}</tbody></table></div><p class="note">${T.flightsnote}</p>`;
  return `<div class="card"><p class="kick">Cost per person</p><p class="big" style="font-size:2rem">EUR ${m.total}</p>
    <details><summary>What it is made of</summary><table><tbody>${m.rows.map(r => `<tr><td><b>${r[0]}</b><div class="note">${r[2]}</div></td><td class="n">${r[1]}</td></tr>`).join('')}</tbody></table><p class="note">${m.note}</p></details></div>
  <h2>Flights</h2><div class="grid2">${fl}</div><details><summary>Other days from Vienna and back</summary>${od}</details>
  <h2>Rooms</h2><p class="muted small" style="margin-top:-2px">Price for two for the stay. Book after the flights.</p><div class="grid2">${rooms}</div>`;
}
function vInfo() {
  return `<h2>Good to know</h2><div class="grid2">${T.info.map(g => `<div class="card"><p class="kick">${g.title}</p><ul class="tight">${g.items.map(x => `<li>${x}</li>`).join('')}</ul></div>`).join('')}</div>
  <h2>Ask before you go</h2><div class="card"><ul class="tight">${T.ask.map(x => `<li>${x}</li>`).join('')}</ul></div>
  <h2>Not found yet</h2><div class="card"><ul class="tight">${T.gaps.map(x => `<li>${x}</li>`).join('')}</ul></div>`;
}

/* ---------- routing: #now #days #day/2027-03-16 #places #places/aonang #book #info ---------- */
function route() {
  const [v, arg] = (location.hash.slice(1) || 'now').split('/');
  const view = v === 'day' ? 'days' : (VIEWS.some(x => x[0] === v) ? v : 'now');
  const html = v === 'day' ? vDay(arg) : v === 'places' && arg ? vStop(arg) : { now: vNow, days: vDays, places: vPlaces, book: vBook, info: vInfo }[view]();
  return { view, html };
}
function paint(keepScroll) {
  const r = route();
  $('#view').innerHTML = (r.view === 'now' ? `<header class="hd"><h1>${T.meta.title}</h1><p>${fmt(T.meta.start, { day: 'numeric', month: 'short' })} to ${fmt(T.meta.end, { day: 'numeric', month: 'short', year: 'numeric' })} · ${T.meta.who}</p></header>` : '') + r.html;
  document.querySelectorAll('[data-v]').forEach(a => a.setAttribute('aria-current', a.dataset.v === r.view ? 'page' : 'false'));
  const cur = (location.hash.match(/^#(?:places|day)\/(.+)/) || [])[1];
  document.querySelectorAll('.out a').forEach(a => a.setAttribute('aria-current', a.dataset.s && (a.dataset.s === cur || (ST[a.dataset.s] && cur >= ST[a.dataset.s].from_ && cur < ST[a.dataset.s].to)) ? 'page' : 'false'));
  if (!keepScroll) { window.scrollTo(0, 0); const c = document.querySelector('.row.cur'); if (c && r.view === 'days' && !location.hash.includes('/')) c.scrollIntoView({ block: 'center' }); }
}
document.addEventListener('click', e => {
  const f = e.target.closest('[data-f]'); if (f) { show[f.dataset.f] = !show[f.dataset.f]; paint(true); }
});
window.addEventListener('hashchange', () => paint(false));
(function init() {
  if (FRAMED) { document.body.classList.add('framed'); document.body.prepend($('#nav')); }
  const link = (v, l) => `<a href="#${v}" data-v="${v}">${svg(v)}<span>${l}</span></a>`;
  $('#nav').innerHTML = VIEWS.map(v => link(v[0], v[1])).join('');
  $('#side').innerHTML = `<h1>${T.meta.title}</h1><p>${fmt(T.meta.start, { day: 'numeric', month: 'short' })} to ${fmt(T.meta.end, { day: 'numeric', month: 'short', year: 'numeric' })}<br>${T.meta.who} · prices read ${T.meta.asof}</p>
    ${VIEWS.map(v => link(v[0], v[1])).join('')}
    <div class="out"><p class="kick" style="padding-left:10px">The route</p>${T.stops.map(s => `<a href="#places/${s.id}" data-s="${s.id}"><i class="dd ${s.cls}"></i>${short(s)}<small>${s.dates.replace(/ Mar| Apr/g, '').replace(/^(\w+ \d+) - (\w+ \d+)$/, '$1-$2')}</small></a>`).join('')}</div>`;
  paint(false);
})();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js');
</script>
