<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Islands and Vietnam Trip</title>

<meta name="theme-color" content="#f3f6f4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e1714" media="(prefers-color-scheme: dark)">
<meta name="robots" content="noindex"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="../icon-512.png"><meta name="apple-mobile-web-app-capable" content="yes">

<style>
/* One page, five views (Now, Days, Places, Book, Info), hash routes so the back button works.
   Phone: tab bar at the bottom (top when framed, e.g. inside claude.ai). Desktop: sidebar with the trip outline.
   Colour marks the stop, never the content type. Data lives in the JSON at the bottom; this file only draws it. */
:root{--bg:#f3f6f4;--card:#ffffff;--fg:#14211d;--muted:#566862;--line:#d3ddd8;--soft:#e9efec;--link:#0b5f7a;--on:#fff;
--zt:#0b6e6e;--zh:#b23a3a;--zg:#a05a1c;--zs:#7a4fb8;--zx:#6b7a74;
--ok:#1f6b45;--okbg:#dff0e5;--warn:#8a5a0a;--warnbg:#f7ead0;--bad:#9b2f2f;--badbg:#f6dede;--idea:#4b2f86;--ideabg:#ece6f6;--fine:#3d5a73;--finebg:#e3ecf3;
--display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;--body:"Source Sans 3","Helvetica Neue",Arial,sans-serif;--bar:60px}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e1714;--card:#15231e;--fg:#e2ece8;--muted:#98ada5;--line:#2a3d35;--soft:#1b2d26;--link:#7fc4de;
--zt:#4fc3c3;--zh:#e07a6e;--zg:#e5a574;--zs:#b89af0;--zx:#8fa39a;--ok:#7bd1a0;--okbg:#17352a;--warn:#e8c07a;--warnbg:#3a2f16;--bad:#f0a0a0;--badbg:#3d2020;--idea:#cbbaf6;--ideabg:#2b2346;--fine:#a9c6dd;--finebg:#1f3040;--on:#0e1714;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0e1714;--card:#15231e;--fg:#e2ece8;--muted:#98ada5;--line:#2a3d35;--soft:#1b2d26;--link:#7fc4de;
--zt:#4fc3c3;--zh:#e07a6e;--zg:#e5a574;--zs:#b89af0;--zx:#8fa39a;--ok:#7bd1a0;--okbg:#17352a;--warn:#e8c07a;--warnbg:#3a2f16;--bad:#f0a0a0;--badbg:#3d2020;--idea:#cbbaf6;--ideabg:#2b2346;--fine:#a9c6dd;--finebg:#1f3040;--on:#0e1714;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.45 var(--body);margin:0}
a{color:var(--link)}
button{font:inherit;color:inherit}
.shell{max-width:1240px;margin:0 auto}
main{padding:8px max(16px,env(safe-area-inset-right,0px)) calc(var(--bar) + 28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:820px;margin:0 auto}
.framed main{padding-bottom:40px}

/* nav: bottom bar on phone */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.framed .nav{position:sticky;top:0;bottom:auto;border-top:0;border-bottom:1px solid var(--line);padding:0}
.nav a{flex:1;min-width:0;height:var(--bar);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;text-decoration:none;color:var(--muted);font:600 .74rem var(--body)}
.nav a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.nav a[aria-current="page"]{color:var(--fg)}
.nav a[aria-current="page"] svg{stroke-width:2.4}
.framed .nav a{height:48px;flex-direction:row;gap:6px;font-size:.88rem}
.framed .nav a svg{width:18px;height:18px}
.side{display:none}

/* type */
.hd{padding:14px 0 6px}
.hd h1{font:800 1.5rem/1.1 var(--display);margin:0}
.hd p{margin:3px 0 0;color:var(--muted);font-size:.9rem}
h2{font:800 1.25rem/1.2 var(--display);margin:24px 0 8px;text-wrap:balance}
h3{font:700 .76rem var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}
.muted{color:var(--muted)}.small{font-size:.9rem}
.kick{font:700 .72rem var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 4px}
.big{font:800 2.6rem/1 var(--display);margin:2px 0 4px}
.lead{font:700 1.1rem/1.25 var(--display);margin:2px 0 3px}
.note{color:var(--muted);font-size:.9rem;margin:3px 0}

/* blocks */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:10px 0}
.dd{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:7px;flex:none;vertical-align:1px}
.zt{--z:var(--zt)}.zh{--z:var(--zh)}.zg{--z:var(--zg)}.zs{--z:var(--zs)}.zx{--z:var(--zx)}
.dd{background:var(--z)}
.strip{display:flex;gap:2px;margin:14px 0 2px}
.strip a{min-width:0;height:10px;border-radius:3px;background:var(--z)}
.striplab{display:flex;gap:2px;font-size:.7rem;color:var(--muted);line-height:1.1}
.striplab span{min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.btn{display:inline-flex;align-items:center;min-height:40px;font:700 .92rem var(--body);background:var(--fg);color:var(--bg);text-decoration:none;border-radius:9px;padding:8px 14px}
.btn.alt{background:none;color:var(--link);border:1px solid var(--line)}
.pill{display:inline-block;font:700 .7rem var(--body);letter-spacing:.04em;padding:2px 8px;border-radius:99px;white-space:nowrap;text-transform:lowercase}
.pill.buy,.pill.do{background:var(--okbg);color:var(--ok)}.pill.decide{background:var(--warnbg);color:var(--warn)}.pill.ask,.pill.book,.pill.idea{background:var(--ideabg);color:var(--idea)}
.pill.wait,.pill.fine{background:var(--finebg);color:var(--fine)}.pill.skip{background:var(--badbg);color:var(--bad)}
.row{display:flex;gap:12px;align-items:center;min-height:56px;padding:9px 0;border-top:1px solid var(--line);text-decoration:none;color:inherit}
.row:first-child{border-top:0}
.row .d{width:3.6em;flex:none;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
.row .d small{display:block;font-weight:600;color:var(--muted);font-size:.78rem}
.row .b{min-width:0;flex:1}
.row .go{color:var(--muted);flex:none}
.row.cur{background:var(--soft);margin:0 -16px;padding-inline:16px;border-radius:8px}
.row .mv{color:var(--muted);font-size:.9rem;line-height:1.3}
.bedl{display:none}
.grp{border-left:4px solid var(--z);padding:2px 0 2px 14px;margin:18px 0 6px}
.grp b{font:800 1.05rem var(--display)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none}
.chip{flex:none;min-height:36px;font:600 .86rem var(--body);border:1px solid var(--line);background:var(--card);color:var(--fg);border-radius:99px;padding:6px 13px;cursor:pointer;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.it{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--line);border-radius:10px;padding:11px 13px;margin:8px 0}
.it.do{border-left-color:var(--ok)}.it.fine{border-left-color:var(--fine)}.it.idea{border-left-color:var(--idea)}.it.skip{border-left-color:var(--bad)}
.it .t{display:flex;gap:8px;align-items:baseline;justify-content:space-between}
.it .t b{font:700 1rem/1.25 var(--display)}
.meta{font-size:.9rem;margin:3px 0}
.meta b{font-weight:700}
.see{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.see a{font-size:.84rem;font-weight:600;text-decoration:none;border:1px solid var(--line);border-radius:99px;padding:5px 11px;color:var(--link)}
.mis{padding-block:4px}.mi{padding:10px 0;border-top:1px solid var(--line)}.mi:first-child{border-top:0}.mi .see{margin-top:5px}.mis .see a{padding:3px 10px}
.leg{padding:9px 0;border-top:1px solid var(--line)}.leg:first-child{border-top:0}
.leg b{display:block}
.bed{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.bed .n{min-width:0;flex:1 1 220px}
.price{font:800 1.25rem var(--display);font-variant-numeric:tabular-nums}
.acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
details>summary{cursor:pointer;font-weight:700;padding:10px 0;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::before{content:"+";display:inline-block;width:1.2em;color:var(--muted)}
details[open]>summary::before{content:"\2212"}
table{border-collapse:collapse;width:100%;font-size:.92rem}
td,th{padding:8px 6px;border-top:1px solid var(--line);vertical-align:top;text-align:left}
th{font-size:.72rem;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);border-top:0}
td.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tw{overflow-x:auto}
ul.tight{margin:4px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.stopcard{display:block;text-decoration:none;color:inherit;border-left:5px solid var(--z)}
.stopcard .lead{display:flex;justify-content:space-between;gap:8px}
.stopcard .lead span{font:600 .85rem var(--body);color:var(--muted);white-space:nowrap}
.pager{display:flex;justify-content:space-between;gap:8px;margin:6px 0 4px}
.pager a{flex:1;text-decoration:none;font-weight:600;font-size:.9rem;border:1px solid var(--line);border-radius:9px;padding:9px 12px;background:var(--card)}
.pager a:last-child{text-align:right}
.pager span{flex:1}
.back{display:inline-block;margin:10px 0 0;font-weight:600;text-decoration:none;font-size:.92rem}
.warn{background:var(--warnbg);color:var(--warn);border-radius:9px;padding:9px 12px;font-size:.92rem;margin:10px 0}
.today{border:2px solid var(--fg)}
:focus-visible{outline:2px solid var(--link);outline-offset:2px}

/* desktop: sidebar with the trip outline, wider content */
@media (min-width:1000px){
  .shell{display:grid;grid-template-columns:270px minmax(0,1fr);gap:24px;padding:0 24px}
  .nav{display:none}
  .side{display:block;position:sticky;top:0;height:100vh;overflow-y:auto;padding:22px 0 30px;border-right:1px solid var(--line);padding-right:18px}
  .side h1{font:800 1.3rem/1.1 var(--display);margin:0 0 3px}
  .side p{margin:0 0 14px;color:var(--muted);font-size:.86rem}
  .side a{display:flex;align-items:center;gap:8px;text-decoration:none;color:var(--fg);padding:7px 10px;border-radius:8px;font-weight:600}
  .side a[aria-current="page"]{background:var(--soft)}
  .side a:hover{background:var(--soft)}
  .side a svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .side .out{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
  .side .out a{font-weight:400;font-size:.92rem;padding:5px 10px}
  .side .out a small{margin-left:auto;color:var(--muted);font-size:.8rem;white-space:nowrap}
  main{padding:18px 0 60px;max-width:900px;margin:0}
  .hd{display:none}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
  .grid2>.it,.grid2>.card{margin:6px 0}
  .row.cur{margin:0 -10px;padding-inline:10px}
  .bedl{display:block}
}
@media print{.nav,.side,.chips,.pager{display:none!important}main{padding:0;max-width:none}.card,.it{break-inside:avoid}details>summary::before{content:""}}
@media (prefers-reduced-motion:no-preference){.chip,.btn,.side a{transition:background .12s}}
</style>
</head>

 {"name": "Rock climbing, half day", "dur": "~4 h", "cost": "THB 900-1,500 (EUR 24-40) at the school counter, not USD 48-55 on a booking site", "note": "Hot Rock 5.0 (479), Railay Rock Climbing Shop 4.9 (212), Real Rocks 4.8 (237). Ask the age of the bolts", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Hot+Rock+Climbing+School+Railay", "tags": []}, {"name": "Kayak to Poda and Phra Nang", "dur": "~3.5 h, about 1 h each way to Poda", "cost": "THB 600 half day", "note": "Be back for the 18:00 boat", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Phra+Nang+Cave+Beach+Railay", "tags": []}, {"name": "Ao Nang beach at sunset", "dur": "~1 h", "cost": "free", "note": "Evening", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Ao+Nang+Beach+Krabi", "tags": ["aonangbeach"]}, {"name": "Emerald Pool and hot spring", "dur": "~5 h with ~1 h ride each way", "cost": "THB 400-650", "note": "Scooter or tour; go at opening, vans arrive later", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Emerald+Pool+Krabi", "tags": []}, {"name": "Hong Islands by longtail", "dur": "~7 h", "cost": "THB 2,500-2,800 a boat for 4-6 + THB 300 park each (USD 42-44 each on listings)", "note": "Only with 4 or more people", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Hong+Islands+Krabi", "tags": ["hongisland"]}, {"name": "Ao Nang Landmark Night Market", "dur": "~1.5 h", "cost": "hours not found", "note": "Unknown", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Ao+Nang+Landmark+Night+Market", "tags": []}, {"name": "Tonsai at night", "dur": "2-3 h", "cost": "after 18:00 the shared boat waits for 8 people (~THB 150 each) or a private boat is THB 800-1,500", "note": "Not from this base unless you accept that cost", "v": "skip", "map": "https://www.google.com/maps/search/?api=1&query=Tonsai+Beach+Railay", "tags": ["tonsai"]}, {"name": "Jet ski", "dur": "-", "cost": "-", "note": "Damage-claim scam with the passport held", "v": "skip", "map": null, "tags": []}, {"name": "Diving", "dur": "-", "cost": "THB 3,000-4,000 for two dives", "note": "Lanta is cheaper for Hin Daeng", "v": "skip", "map": null, "tags": []}, {"name": "Bioluminescence", "dur": "-", "cost": "-", "note": "Moon is waxing on 15-18 Mar, full on Mon 22: the glow is weak", "v": "skip", "map": null, "tags": []}], "tags": ["krabi", "tonsai", "hongisland"], "extra": ""}, {"id": "mook", "cls": "zt", "name": "Koh Mook", "short": "Koh Mook", "dates": "Thu 18 - Sat 20 Mar", "nights": "2 nights", "from_": "2027-03-18", "to": "2027-03-20", "avail": "1 full day, Thursday afternoon (~4 h), Saturday morning (~2 h)", "fit": "One full day is all Mook holds: pick one main item for Friday (the cave, or the Kradan and Ngai boat, or the track) and let the bike, village and bar fill Thursday afternoon and Saturday morning. A third night repeats it (Reddit 2025: \"way too calm\", 2-3 days enough).", "legs": [{"leg": "Arrive from Ao Nang", "how": "taxi + longtail about 2.5 h, THB 1,600 for two. The boat Railay to Mook (THB 1,970 each) costs more and needs a Railay start", "note": "<span class=\"nt\">Price from one 2025 account</span>"}, {"leg": "Leave for Lanta (Sat 20)", "how": "Tigerline speedboat; one aggregator shows 10:00 and 11:00 (Jan 2026), another about 11:00 and 14:00 (Oct 2026). March 2027 times and fare are not published; pier transfers on both islands unpriced", "note": "<span class=\"nt\">Ask Kookkai or Tigerline in December</span>"}], "sleep": [{"name": "Pick: Kookkai Bungalows (Booking now lists it as Mook Bamboo Bungalows)", "price": "64 for 2 nights with breakfast, 32 a night", "note": "free cancellation to 15 Mar", "link": "https://www.booking.com/hotel/th/kookkai-bungalows.en-gb.html?checkin=2027-03-18&checkout=2027-03-20&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Kookkai+Bungalows+%28Booking+now+lists+it+as+Mook+Bamboo+Bungalows%29+Koh+Mook", "primary": true}, {"name": "Alternative: Koh Mook Hostel; the 43 is the cheapest unit, check the room row for a private room", "price": "43, 21 a night", "note": "Booking 9.0 from 253", "link": "https://www.booking.com/hotel/th/koh-mook-hostel.en-gb.html?checkin=2027-03-18&checkout=2027-03-20&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Koh+Mook+Hostel%3B+the+43+is+the+cheapest+unit+Koh+Mook", "primary": false}, {"name": "Alternative: Koh Mook Bungalows", "price": "58", "note": "Booking 8.8 from 492", "link": "https://www.booking.com/hotel/th/koh-mook-bungalows.en-gb.html?checkin=2027-03-18&checkout=2027-03-20&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Koh+Mook+Bungalows+Koh+Mook", "primary": false}], "sleepnote": "Airbnb has nothing real on Mook. One ATM on the island: bring THB 3,000-4,000 cash for two nights.", "menu": [{"name": "Emerald Cave", "dur": "~3 h", "cost": "park fee THB 200 (THB 400 is the Koh Rok fee); kayak THB 100 an hour", "note": "Time it by the tide, not by the clock: mid-tide is best, high water closes the entrance, very low drains the lagoon. Most people swim in with a life jacket. The 19 Mar tide is not looked up: ask Kookkai", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Emerald+Cave+Koh+Mook", "tags": ["emeraldcave"]}, {"name": "Kradan and Ngai by longtail", "dur": "~6-7 h, a full day", "cost": "about THB 800 a boat (EUR 21) split between two; listings ask USD 217", "note": "Instead of the cave, or the track", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Koh+Kradan", "tags": []}, {"name": "Sabai Beach jungle track", "dur": "~2 h: 40 min to the viewpoint, 20 to the beach, back", "cost": "free", "note": "Mud, mosquitoes, snakes: take a stick", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Sabai+Beach+Koh+Mook", "tags": ["kohmook"]}, {"name": "Bicycle round the island", "dur": "~2 h", "cost": "THB 100 a day (scooter THB 250)", "note": "Quiet roads", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Koh+Mook", "tags": ["kohmook"]}, {"name": "The village", "dur": "~1 h", "cost": "free", "note": "Muslim village, cover up. Cash only", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Ban+Koh+Mook", "tags": ["kohmook"]}, {"name": "Mong Bar", "dur": "1-2 h evening", "cost": "beer from THB 50", "note": "The only bar. Rated 4.8 (305)", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Mong+Bar+Koh+Mook", "tags": []}, {"name": "Cuttlefish snorkel", "dur": "-", "cost": "-", "note": "One reel (41.8k views), one source only", "v": "idea", "map": null, "tags": []}], "tags": ["kohmook", "emeraldcave"], "extra": ""}, {"id": "lanta", "cls": "zt", "name": "Koh Lanta", "short": "Koh Lanta", "dates": "Sat 20 - Wed 24 Mar", "nights": "4 nights", "from_": "2027-03-20", "to": "2027-03-24", "avail": "3 full days, Saturday afternoon (~3 h); leave Wednesday 06:30", "fit": "The Do list is about 24 h against about 33 h available, so about 9 h stays free for the scooter, the beach and work. Four nights is the most the list supports.", "legs": [{"leg": "Arrive from Mook", "how": "Tigerline speedboat, lands Lanta around midday-afternoon", "note": "<span class=\"nt\">Time unknown</span>"}, {"leg": "Leave Lanta (Wed 24)", "how": "shared van to Krabi airport THB 350-380 each (EUR 19-21 for two), 2-3 h with the car ferry. Pickup 06:30 (private car if the first shared van is 08:00) puts you at the airport about 09:30, 4 h before the flight; the car-ferry queue can add up to 2 h. If the guesthouse can book a private van for a small extra, take it", "note": "<span class=\"nt\">Ferry queue not published</span>"}], "sleep": [{"name": "Pick: Cat Bungalow", "price": "80 for 4 nights, 20 a night, fan and breakfast", "note": "Booking 9.1 from 688, free cancellation to 19 Mar", "link": "https://www.booking.com/hotel/th/cat-bungalow.en-gb.html?checkin=2027-03-20&checkout=2027-03-24&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Cat+Bungalow+Koh+Lanta", "primary": true}, {"name": "Alternative: Thai House Beach Resort", "price": "85", "note": "Booking 9.0 from 372", "link": "https://www.booking.com/hotel/th/thai-house-beach-resort-ko-lanta.en-gb.html?checkin=2027-03-20&checkout=2027-03-24&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Thai+House+Beach+Resort+Koh+Lanta", "primary": false}], "sleepnote": "Airbnb on Lanta is EUR 117-181 for 4 nights, so no cheaper. Lanta is spread out: the scooter is how you move (THB 250 a day).", "menu": [{"name": "Snorkel Koh Rok and Koh Haa", "dur": "~8 h, a full day", "cost": "THB 2,000-3,000 + 400 park (EUR 64-90)", "note": "Jellyfish possible until April. Tin Adventure 4.7 (270)", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Koh+Rok+Nok", "tags": ["kohrok"]}, {"name": "Old Town, then National Park and lighthouse", "dur": "~5 h: Old Town 1.5 h, park and lighthouse 3 h", "cost": "park THB 200 + 20 for a vehicle", "note": "Go mid-afternoon: park hours are 08:00-16:30 in some sources, 17:30 in others (HQ +66 75 656 576). Sunset is about 18:36, watch it from a beach. Old Town 4.4 (6,303), lighthouse 4.4 (4,381)", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Mu+Ko+Lanta+National+Park", "tags": ["kohlanta"]}, {"name": "Khao Mai Kaew cave", "dur": "~2.5 h", "cost": "THB 200 park + local guide THB 30-50", "note": "Guide is required", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Khao+Mai+Kaew+Cave+Koh+Lanta", "tags": []}, {"name": "Muay Thai gym lesson", "dur": "~1.5 h", "cost": "THB 500 (EUR 13)", "note": "Nicha 4.9 (163), Lanta Muay Thai Complex 4.9 (127). Session times not found", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Nicha+Muay+Thai+Koh+Lanta", "tags": []}, {"name": "Cooking class", "dur": "~4 h", "cost": "Time for Lime about THB 2,000 (EUR 53)", "note": "Mon's 5.0 (849), price not found", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Time+for+Lime+Koh+Lanta", "tags": []}, {"name": "Hand tennis 16:30 and beach volleyball ~16:00", "dur": "~1.5 h each", "cost": "free", "note": "Hand tennis at Hans restaurant, volleyball on Long Beach; locals play", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Long+Beach+Koh+Lanta", "tags": []}, {"name": "Klong Nin market, Saladan walking street", "dur": "~1.5 h", "cost": "cheap meals", "note": "Klong Nin market is Tue and Fri: Tue 23 Mar fits", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Klong+Nin+Beach+Koh+Lanta", "tags": ["kohlanta"]}, {"name": "Dive Hin Daeng and Hin Muang", "dur": "~8 h, a full day", "cost": "THB 4,330-4,700 + 600 park (EUR 112-125)", "note": "Not budgeted; take it instead of Rok if you dive", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Hin+Daeng+Hin+Muang+dive+site", "tags": []}, {"name": "Night squid or fishing boat", "dur": "-", "cost": "hotels sell a boat from THB 4,750 for two", "note": "Ask boatmen at Saladan or Old Town on arrival. No local listing exists", "v": "idea", "map": "https://www.google.com/maps/search/?api=1&query=Saladan+Pier+Koh+Lanta", "tags": []}, {"name": "Zipline", "dur": "-", "cost": "from THB 1,300", "note": "Tourist-priced", "v": "fine", "map": null, "tags": []}, {"name": "Muay Thai fight night", "dur": "-", "cost": "-", "note": "Both tourist stadiums rated 3.1 and 3.5: train instead", "v": "skip", "map": null, "tags": []}, {"name": "Elephant rides, jeep tours", "dur": "-", "cost": "-", "note": "Poor treatment; a jeep is THB 1,200 for what a scooter does", "v": "skip", "map": null, "tags": []}], "tags": ["kohlanta", "kohrok"], "extra": ""}, {"id": "hanoi1", "cls": "zh", "name": "Hanoi, first night", "short": "Hanoi", "dates": "Wed 24 Mar", "nights": "1 night", "from_": "2027-03-24", "to": "2027-03-25", "avail": "arrive 20:15, in the room about 22:00", "fit": "One evening hour. This night exists only because the flight lands after dark and the Ha Giang bus leaves in the morning.", "legs": [{"leg": "Noi Bai to the Old Quarter", "how": "bus 86 VND 45k (EUR 1.5), 50-70 min; Grab VND 230-350k (EUR 8-12)", "note": "<span class=\"nt\">Bus 86 last run 22:00-22:10 by source; after 22:00 take Grab</span>"}, {"leg": "Thu 25 to Ha Giang", "how": "sleeper bus from VND 260k (EUR 9) or limousine van from VND 320k (EUR 11), 5-8 h; book with the room or on Vexere.com", "note": "<span class=\"nt\">Hourly 06:00-16:00 buses are Hanoi to Ha Giang; leave Hanoi by about 08:00</span>"}], "sleep": [{"name": "Pick: La Ava's Home, Old Quarter (ensuite, AC, 25 m2)", "price": "26 a night; 52 for the two Hanoi nights", "note": "Booking 9.1 from 537, room row read 3 Nov", "link": "https://www.booking.com/hotel/vn/la-avas-home.en-gb.html?checkin=2027-03-24&checkout=2027-03-25&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=La+Ava%27s+Home+Hanoi%2C+first+night", "primary": true}, {"name": "Alternative: Bamboo Homestay Old Quarter", "price": "27.50 a night (55 read for 2 nights)", "note": "Booking 9.3 from 320", "link": "https://www.booking.com/hotel/vn/bamboo-homestay-old-quarter.en-gb.html?checkin=2027-03-24&checkout=2027-03-25&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Bamboo+Homestay+Old+Quarter+Hanoi%2C+first+night", "primary": false}], "sleepnote": "Same room for both Hanoi nights (24 Mar, 2 Apr). Skip The One Hostel (DJs until midnight).", "menu": [{"name": "Bia hoi at the Ta Hien corner", "dur": "~1 h", "cost": "beer VND 10-15k (EUR 0.35-0.5); a stall asking more charges tourist prices", "note": "Police clear the pavement about 23:00", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Ta+Hien+Street+Hanoi", "tags": ["hanoifood"]}], "tags": ["hanoifood"], "extra": ""}, {"id": "hagiang", "cls": "zg", "name": "Ha Giang loop", "short": "Ha Giang", "dates": "Thu 25 - Mon 29 Mar", "nights": "4 nights", "from_": "2027-03-25", "to": "2027-03-29", "avail": "Thu bus day, three riding days, Monday ride + bus", "fit": "Four nights holds the whole loop: Du Gia family night, Dong Van for the Sunday market, Meo Vac as the last night. The fifth night I had before was the Monday in Ha Giang town. Friday is a long riding day, so leave by 08:00 after the Thursday bus.", "legs": [{"leg": "Thu 25 Hanoi to Ha Giang", "how": "bus 6-7 h, about EUR 10; pick up the bike Friday morning", "note": "<span class=\"nt\">Operator not chosen</span>"}, {"leg": "Mon 29 Meo Vac back to Ha Giang town", "how": "ride 3.5-5 h by one guide (80-150 km, gravel at Mau Due), up to 8 h by another: leave at 07:00. Return the bike before booking anything", "note": "<span class=\"nt\">Real time not known</span>"}, {"leg": "Mon 29 evening, Ha Giang to Ninh Binh", "how": "night bus G8 23:00 or Sao Viet 22:00, arrive Tam Coc about 07:00-07:20 (see the night bus card)", "note": "<span class=\"nt\">Return the bike before boarding</span>"}], "sleep": [{"name": "Thu: Ha Giang Faithien Homestay, double room with mountain view", "price": "10", "note": "Booking 9.7 from 165, room row read 3 Nov", "link": "https://www.booking.com/hotel/vn/ha-giang-faithien-homestay.en-gb.html?checkin=2027-03-25&checkout=2027-03-26&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Ha+Giang+Faithien+Homestay+Ha+Giang+loop", "primary": true}, {"name": "Thu alternative: HagiangGo, King Room with garden view, rents bikes", "price": "10", "note": "Booking 9.3 from 543", "link": "https://www.booking.com/hotel/vn/hagianggo-hostel-motorbikes-rental-and-tour.en-gb.html?checkin=2027-03-25&checkout=2027-03-26&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Thu+alternative%3A+HagiangGo+Ha+Giang+loop", "primary": false}, {"name": "Fri: Happy Homestay Du Gia, double room with breakfast (dinner is a EUR 7 extra on the 23 rate)", "price": "14", "note": "Booking, room row read 3 Nov, free cancellation", "link": "https://www.booking.com/hotel/vn/happy-homestay-du-gia-yen-minh.en-gb.html?checkin=2027-03-26&checkout=2027-03-27&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Happy+Homestay+Du+Gia+Ha+Giang+loop", "primary": true}, {"name": "Sat: ToTo-Chan Hotel, standard double with breakfast, Dong Van", "price": "18", "note": "Booking, room row read 3 Nov (the 15 on the card was a one-guest unit)", "link": "https://www.booking.com/hotel/vn/toto-chan.en-gb.html?checkin=2027-03-27&checkout=2027-03-28&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=ToTo-Chan+Hotel+Ha+Giang+loop", "primary": true}, {"name": "Sun: Xua Vu Homestay, double room with garden view, Meo Vac", "price": "17", "note": "Booking, room row read 3 Nov, breakfast EUR 1 extra", "link": "https://www.booking.com/hotel/vn/xua-vu-homestay.en-gb.html?checkin=2027-03-28&checkout=2027-03-29&group_adults=2&no_rooms=1&selected_currency=EUR", "map": "https://www.google.com/maps/search/?api=1&query=Xua+Vu+Homestay+Ha+Giang+loop", "primary": true}], "sleepnote": "About EUR 59 for the four nights. The first list I made used a Ha Giang town card of EUR 12 that was a dorm bed; Thursday is now a private room. No dorms: a Reddit volunteer found bed bugs in a Ha Giang dorm (2026-03). Check each room row at booking. Alternatives for nights 1 and 4: Ha Giang Hostel (9.9 from 287) or Ali Hostel (10 from 89), private rooms only.", "menu": [{"name": "Self-ride the loop", "dur": "~16-18 h riding in all: Fri 5-6 h, Sat ~4 h, Sun 2-3 h, Mon 3.5-5 h", "cost": "125 cc about EUR 10-12 a day (VND 290-345k) against EUR 198 for a 3-4 day tour with a driver; a Reddit user quotes about USD 40 a day for an easy rider", "note": "Cash deposit and a written receipt, never the passport (homestays and the police need it). A notarised copy is the other way. Since April 2026 the road is more closely watched after a tourist death, so line up two shops. Film the bike before and after", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Ha+Giang+Loop", "tags": ["hagiangloop"]}, {"name": "Dong Van Sunday market, Sun 28 Mar", "dur": "~2.5 h", "cost": "free", "note": "Hours are 06:30-09:00 or 05:00-10:00 by source: be there at 06:30. The Meo Vac market is also Sunday and larger, no hours found: you reach it in the afternoon, only partly", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Dong+Van+Market+Ha+Giang", "tags": ["dongvan"]}, {"name": "Ma Pi Leng pass", "dur": "~2 h riding and viewpoints", "cost": "free", "note": "Rated 4.8 (816). Dawn or dusk. The USD 68 skywalk trek is not needed", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Ma+Pi+Leng+Pass", "tags": []}, {"name": "Nho Que boat", "dur": "duration unknown, 30 min-2 h by source", "cost": "VND 120-150k (EUR 4-5), shuttle VND 50-100k", "note": "Rated 4.8 (990)", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Nho+Que+River+Ha+Giang", "tags": []}, {"name": "Quan Ba and Heaven's Gate, Yen Minh", "dur": "3-4 h riding to Yen Minh with stops", "cost": "free", "note": "Fri morning; Ha Giang to Quan Ba is 1.5-2 h and Quan Ba to Yen Minh 1.5-2 h. The Quan Ba market is not on the menu: sources disagree on its day", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Quan+Ba+Heaven+Gate+Ha+Giang", "tags": ["quanba"]}, {"name": "Du Gia waterfall and family dinner", "dur": "~1.5 h + dinner", "cost": "fee not found", "note": "Cold water", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Du+Gia+Waterfall+Ha+Giang", "tags": []}, {"name": "Lung Cu flag tower and village", "dur": "~2.5 h, a dead-end out and back, distance not sourced", "cost": "VND 30k (EUR 1)", "note": "Only if you are in Dong Van by 13:00; sunset is 18:12 and the passes fog at dusk. Cold and foggy in March. Rated 4.6 (9,331)", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Lung+Cu+Flag+Tower", "tags": []}, {"name": "Dong Van old quarter", "dur": "~2 h", "cost": "free", "note": "Sat evening", "v": "do", "map": "https://www.google.com/maps/search/?api=1&query=Dong+Van+Old+Quarter", "tags": ["dongvan"]}, {"name": "Lung Khuy cave", "dur": "-", "cost": "fee not found", "note": "4.6 from only 48 reviews", "v": "fine", "map": "https://www.google.com/maps/search/?api=1&query=Lung+Khuy+Cave+Ha+Giang", "tags": []}, {"name": "Dong Van night market", "dur": "-", "cost": "-", "note": "Runs on lunar days 14-16, which are 21-23 Mar: none in your stay", "v": "skip", "map": null, "tags": []}], "tags": ["hagiangloop", "dongvan", "quanba"], "extra": "<div class=\"note\"><b>The police.</b> About 13 of 16 first-person self-riders on this loop were stopped; 2M VND (EUR 65) is the normal fine, the range is 0.5-4.5M, and 150 cc was fined more than 110 cc. Budget VND 2-3M each. A pre-paid fine through the shop or a signed note covered later checkpoints in several accounts. A valid 1968 IDP is not a shield. Counts are hand counts from Reddit threads, biased toward people who worried about fines.</div>"}, {"id": "hanoi2", "cls": "zh", "name": "Monday night bus, Ha Giang to Ninh Binh", "short": "Night bus", "dates": "Mon 29 Mar", "nights": "night bus", "from_": "2027-03-29", "to": "2027-03-30", "avail": "ride back by about 16:00, bus leaves 22:00 or 23:00", "fit": "No Hanoi night: you sleep on the bus and wake up in Ninh Binh on Tuesday morning.", "legs": [{"leg": "Mon 29 night bus to Ninh Binh", "how": "G8 23:00 -> Tam Coc 07:20, EUR 23-24 (rated 4.5), or Sao Viet 22:00 -> 07:00, EUR 19 (4.4); Nov 2026 timetable on 12go. Be at the pickup 30+ min ear function route() {

    ${VIEWS.map(v => link(v[0], v[1])).join('')}
    <div class="out"><p class="kick" style="padding-left:10px">The route</p>${T.stops.map(s => `<a href="#places/${s.id}" data-s="${s.id}"><i class="dd ${s.cls}"></i>${short(s)}<small>${s.dates.replace(/ Mar| Apr/g, '').replace(/^(\w+ \d+) - (\w+ \d+)$/, '$1-$2')}</small></a>`).join('')}</div>`;
  paint(false);
})();
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js');
</script>
